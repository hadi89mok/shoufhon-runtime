<script>
(function(){
  "use strict";
  if(window.__SHOUFHON_EMBED_VISIBILITY_V1__)return;
  window.__SHOUFHON_EMBED_VISIBILITY_V1__=true;

  let parentVisible=true;
  const state={visible:true};
  window.ShoufHonEmbedVisibility=state;

  function sync(){
    const visible=!document.hidden&&parentVisible!==false;
    if(state.visible===visible&&document.documentElement.classList.contains("m7-embed-suspended")===!visible){
      return;
    }
    state.visible=visible;
    document.documentElement.classList.toggle("m7-embed-suspended",!visible);
    try{
      window.dispatchEvent(new CustomEvent("shoufhon:embed-visibility",{detail:{visible:visible}}));
    }catch(_){}
  }

  window.addEventListener("message",function(event){
    if(event.source!==window.parent&&event.source!==window.top)return;
    const data=event.data||{};
    if(data.type!=="SHOUFHON_EMBED_VISIBILITY")return;
    parentVisible=data.visible!==false;
    sync();
  });

  document.addEventListener("visibilitychange",sync,{passive:true});
  sync();
})();

</script>

<!-- SHOUFHON — ONE SDK LOAD + ONE SHARED SUPABASE CLIENT PER SHOP EMBED -->
<script>
(function(){
  "use strict";

  /*
     Use the same startup pattern that was already proven on the shop embed:
     load Supabase dynamically and guard the promise on window so refresh/load
     races cannot create a second SDK request.
  */
  window.__SHOUFHON_EMBED_SUPABASE_READY__ =
    window.__SHOUFHON_EMBED_SUPABASE_READY__ ||
    (function(){
      if(window.supabase&&typeof window.supabase.createClient==="function"){
        return Promise.resolve(window.supabase);
      }

      const existing=document.querySelector(
        'script[data-m7-hours-supabase="1"],script[data-shoufhon-embed-supabase="1"],script[src*="@supabase/supabase-js@2"]'
      );

      return new Promise(function(resolve,reject){
        let settled=false;
        let checkTimer=0;
        const startedAt=Date.now();

        function cleanup(){
          clearTimeout(checkTimer);
          if(existing){
            existing.removeEventListener("load",onLoad);
            existing.removeEventListener("error",onError);
          }
        }

        function finishIfReady(){
          if(settled)return true;
          if(window.supabase&&typeof window.supabase.createClient==="function"){
            settled=true;
            cleanup();
            resolve(window.supabase);
            return true;
          }
          return false;
        }

        function fail(error){
          if(settled)return;
          settled=true;
          cleanup();
          reject(error instanceof Error?error:new Error("SUPABASE_LOAD_FAILED"));
        }

        function onLoad(){
          if(!finishIfReady()){
            fail(new Error("SUPABASE_LOAD_FAILED"));
          }
        }

        function onError(){
          fail(new Error("SUPABASE_LOAD_FAILED"));
        }

        function checkExisting(){
          if(finishIfReady())return;
          if(Date.now()-startedAt>=10000){
            fail(new Error("SUPABASE_LOAD_TIMEOUT"));
            return;
          }
          checkTimer=setTimeout(checkExisting,40);
        }

        if(existing){
          existing.addEventListener("load",onLoad,{once:true});
          existing.addEventListener("error",onError,{once:true});
          checkTimer=setTimeout(checkExisting,0);
          return;
        }

        const script=document.createElement("script");
        script.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
        script.async=true;
        script.dataset.shoufhonEmbedSupabase="1";
        script.addEventListener("load",onLoad,{once:true});
        script.addEventListener("error",onError,{once:true});
        (document.head||document.documentElement).appendChild(script);
        checkTimer=setTimeout(checkExisting,40);
      });
    })();
})();
</script>

<!-- SHOUFHON — ONE SHARED SUPABASE CLIENT PER SHOP EMBED -->
<script>
(function(){
  "use strict";

  if(window.ShoufHonEmbedDataClient)return;

  const SUPABASE_URL="https://wdtaiuwtqdepzdamgsrs.supabase.co";
  const SUPABASE_KEY="sb_publishable_lzog5ZX19HK5_rFfer8Ylw_OPG_0bXl";
  let cachedClient=null;
  let clientPromise=null;

  function usable(client){
    return !!(
      client &&
      typeof client.from==="function" &&
      typeof client.channel==="function" &&
      typeof client.rpc==="function"
    );
  }

  function patchSecurity(client){
    if(!usable(client))return client;

    try{
      if(
        window.ShoufHonFollowSecurityBridge &&
        typeof window.ShoufHonFollowSecurityBridge.patchClient==="function"
      ){
        client=window.ShoufHonFollowSecurityBridge.patchClient(client)||client;
      }
    }catch(error){
      console.warn("[ShoufHon Embed] follow security patch:",error);
    }

    try{
      if(
        window.ShoufHonInteractionSecurityBridge &&
        typeof window.ShoufHonInteractionSecurityBridge.patchClient==="function"
      ){
        client=window.ShoufHonInteractionSecurityBridge.patchClient(client)||client;
      }
    }catch(error){
      console.warn("[ShoufHon Embed] interaction security patch:",error);
    }

    return client;
  }

  async function getClient(){
    if(usable(cachedClient)){
      cachedClient=patchSecurity(cachedClient);
      return cachedClient;
    }

    if(usable(window.__SHOUFHON_EMBED_SHARED_SUPABASE_CLIENT__)){
      cachedClient=patchSecurity(window.__SHOUFHON_EMBED_SHARED_SUPABASE_CLIENT__);
      return cachedClient;
    }

    if(clientPromise)return clientPromise;

    clientPromise=(async function(){
      const lib=await window.__SHOUFHON_EMBED_SUPABASE_READY__;

      if(!lib||typeof lib.createClient!=="function"){
        throw new Error("SUPABASE_SDK_NOT_READY");
      }

      if(!window.__SHOUFHON_EMBED_SHARED_SUPABASE_CLIENT__){
        window.__SHOUFHON_EMBED_SHARED_SUPABASE_CLIENT__=
          lib.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
              auth:{
                persistSession:false,
                autoRefreshToken:false,
                detectSessionInUrl:false
              }
            }
          );
      }

      cachedClient=patchSecurity(
        window.__SHOUFHON_EMBED_SHARED_SUPABASE_CLIENT__
      );

      if(!usable(cachedClient)){
        throw new Error("SUPABASE_CLIENT_NOT_USABLE");
      }

      return cachedClient;
    })();

    try{
      return await clientPromise;
    }finally{
      clientPromise=null;
    }
  }

  window.ShoufHonEmbedDataClient={
    get:getClient,
    peek:function(){
      const client=
        cachedClient||
        window.__SHOUFHON_EMBED_SHARED_SUPABASE_CLIENT__||
        null;
      return patchSecurity(client);
    }
  };
})();
</script>

(function(){
  "use strict";
  if(window.ShoufHonProfileRowCache)return;

  const URL="https://wdtaiuwtqdepzdamgsrs.supabase.co";
  const KEY="sb_publishable_lzog5ZX19HK5_rFfer8Ylw_OPG_0bXl";
  const COLUMNS="shop_slug,shop_name,profile_image_url,story_logo_url,category,category_name,arabic_name,is_active,verified,location,directory_options";
  const TTL_MS=45000;
  const cache=new Map();
  const pending=new Map();
  const dirty=new Set();

  function key(value){
    return String(value||"").trim().toLowerCase();
  }

  function invalidate(value){
    const slug=key(value);
    if(!slug){
      cache.clear();
      pending.forEach(function(_,pendingSlug){dirty.add(pendingSlug);});
      return;
    }
    cache.delete(slug);
    if(pending.has(slug))dirty.add(slug);
  }

  async function fetchProfile(slug,client){
    /* Public identity must load independently of SDK and auth startup.
       The publishable key has public SELECT access to this active row. */
    try{
      const params=new URLSearchParams();
      params.set("select",COLUMNS);
      params.set("shop_slug","eq."+slug);
      params.set("limit","1");
      const response=await fetch(URL+"/rest/v1/shop_profiles?"+params.toString(),{
        method:"GET",
        headers:{
          "apikey":KEY,
          "Accept":"application/json"
        },
        cache:"no-store"
      });
      const text=await response.text();
      let payload=null;
      try{payload=text?JSON.parse(text):null}catch(_){payload=null}
      if(!response.ok){
        return {data:null,error:{message:(payload&&payload.message)||"PROFILE_LOAD_FAILED",status:response.status}};
      }
      const row=Array.isArray(payload)?(payload[0]||null):payload;
      return {data:row||null,error:null};
    }catch(error){
      return {data:null,error:error};
    }
  }

  async function get(value,clientOrOptions,maybeOptions){
    const slug=key(value);
    if(!slug)return {data:null,error:{message:"MISSING_SHOP_SLUG"}};

    const client=
      clientOrOptions&&typeof clientOrOptions.from==="function"
        ?clientOrOptions
        :null;

    const options=client
      ?(maybeOptions||{})
      :(clientOrOptions||{});

    if(options&&options.force===true)invalidate(slug);

    const hit=cache.get(slug);
    if(hit&&Date.now()-hit.at<TTL_MS){
      return {data:hit.data,error:null};
    }
    if(pending.has(slug))return pending.get(slug);

    const task=(async function(){
      let result=null;
      do{
        dirty.delete(slug);
        result=await fetchProfile(slug,client);
      }while(dirty.has(slug)&&!result.error);

      if(!result.error&&result.data){
        cache.set(slug,{data:result.data,at:Date.now()});
      }
      return result;
    })().finally(function(){
      if(pending.get(slug)===task)pending.delete(slug);
      dirty.delete(slug);
    });

    pending.set(slug,task);
    return task;
  }

  window.ShoufHonProfileRowCache={get:get,invalidate:invalidate};
})();

      }[

          .trim()

      ]
      ||
      ""
    );
  }


  function m7TypographyPercent(value){

    const number =
      Number(value);

    if(!Number.isFinite(number)){
      return 100;
    }

    return Math.max(
      70,
      Math.min(
        150,
        number
      )
    );
  }


  function m7ApplyModuleTypography(
    rootElement,
    options,
    moduleKey
  ){

    if(!rootElement){
      return;
    }


    const globalStyle =
      String(
        options.global_font_style ||
        "current"
      )
        .trim()
        .toLowerCase();


    const moduleStyleRaw =
      String(
        options[
          moduleKey +
          "_font_style"
        ] ||
        "inherit"
      )
        .trim()
        .toLowerCase();


    const finalStyle =
      moduleStyleRaw === "inherit"
        ? globalStyle
        : moduleStyleRaw;


    const family =
      m7TypographyFontStack(
        finalStyle
      );


    const scale =
      (
        m7TypographyPercent(
          options.global_font_size
        )
        *
        m7TypographyPercent(
          options[
            moduleKey +
            "_font_size"
          ]
        )
      ) / 10000;


    [
      rootElement,
      ...rootElement.querySelectorAll("*")
    ]
      .forEach(
        function(el){

          if(
            !el ||
            !el.tagName
          ){
            return;
          }


          const tag =
            el.tagName
              .toUpperCase();


          if(
            [
              "STYLE",
              "SCRIPT",
              "SVG",
              "PATH",
              "IMG",
              "VIDEO"
            ].includes(tag)
          ){
            return;
          }


          const directText =
            Array.from(
              el.childNodes || []
            )
              .some(
                function(node){
                  return (
                    node.nodeType === 3 &&
                    String(
                      node.textContent || ""
                    ).trim()
                  );
                }
              );


          if(!directText){
            return;
          }


          if(family){
            el.style.setProperty(
              "font-family",
              family,
              "important"
            );
          }
          else{
            el.style.removeProperty(
              "font-family"
            );
          }


          let base =
            Number(
              el.dataset
                .m7BaseFontSize
            );


          if(
            !Number.isFinite(base) ||
            base <= 0
          ){

            const current =
              parseFloat(
                getComputedStyle(el)
                  .fontSize
              );


            if(
              !Number.isFinite(current) ||
              current <= 0
            ){
              return;
            }


            base =
              current;


            el.dataset
              .m7BaseFontSize =
                String(base);

          }


          el.style.setProperty(
            "font-size",
            (
              base *
              scale
            )
              .toFixed(2) +
            "px",
            "important"
          );

        }
      );
  }

              options.page_use_universal_accent
            ).toLowerCase() === "true"
          );


    const baseAccent =
      useUniversal
        ? universalAccent
        : safeColor(
            options.hours_accent_color,

          );


    const accentRgb =
      hexToRgb(
        baseAccent
      ) ||
      {
        r:255,
        g:116,
        b:184
      };


    const mainTextColor =
      safeColor(
        options.hours_text_color,
        mixHex(
          accentRgb,
          {
            r:255,
            g:255,
            b:255
          },
          .70
        )
      );


    const subTextColor =
      safeColor(
        options.hours_sub_color,
        mixHex(
          accentRgb,
          {
            r:255,
            g:255,
            b:255
          },
          .46
        )
      );


    root.style.setProperty(
      "--m7-hours-accent",
      baseAccent
    );


    root.style.setProperty(
      "--m7-hours-accent-rgb",
      accentRgb.r +
      "," +
      accentRgb.g +
      "," +
      accentRgb.b
    );


    root.style.setProperty(
      "--m7-hours-accent-light",
      mixHex(
        accentRgb,
        {
          r:255,
          g:255,
          b:255
        },
        .45
      )
    );


    root.style.setProperty(
      "--m7-hours-accent-dark",
      mixHex(
        accentRgb,
        {
          r:0,

        },

    root.style.setProperty(
      "--m7-hours-main",

    );


    root.style.setProperty(
      "--m7-hours-sub",
      subTextColor
    );


    /* Global Motion FX master removed — Hours uses its own styling. */
    root.classList.remove(
      "m7-hours-static",
      "m7-hours-subtle"
    );

  }


  /* =========================================================
     SCHEDULE HELPERS
  ========================================================= */

  function validTime(value){

    return /^([01]\d|2[0-3]):[0-5]\d$/.test(
      String(value || "")
    );

  }


  function normalizeDay(value){

    const row =
      value &&
      typeof value === "object"
        ? value
        : {};


    return {
      enabled:
        row.enabled === true ||
        String(
          row.enabled
        ).toLowerCase() ===
        "true",

      open:
        validTime(row.open)
          ? row.open
          : "09:00",

      close:
        validTime(row.close)
          ? row.close
          : "17:00"
    };

  }


  function normalizeSchedule(value){

    if(
      !value ||
      typeof value !== "object"
    ){
      return null;
    }


    const result = {};

    let hasAnySavedDay =
      false;


    DAYS.forEach(
      function(day){

        if(
          Object.prototype
            .hasOwnProperty
            .call(
              value,
              day
            )
        ){
          hasAnySavedDay =
            true;
        }


        result[day] =
          normalizeDay(
            value[day]
          );

      }
    );


    return hasAnySavedDay
      ? result
      : null;

  }


  function timeToMinutes(value){

    const parts =
      String(
        value ||
        "00:00"
      )
        .split(":");


    return (
      Number(
        parts[0] ||
        0
      ) *
        60 +
      Number(
        parts[1] ||
        0
      )
    );

  }


  function formatTime(value){

    if(!validTime(value)){
      return "";
    }


    const parts =
      value.split(":");


    const hour =
      Number(
        parts[0]
      );


    const minute =
      Number(
        parts[1]
      );


    const suffix =
      hour >= 12
        ? "PM"
        : "AM";


    const displayHour =
      hour % 12 ||
      12;


    return (
      displayHour +
      ":" +
      String(minute)
        .padStart(
          2,
          "0"
        ) +
      " " +
      suffix
    );

  }


  function zonedNow(){

    let formatter;


    try{

      formatter =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone:
              timezone ||
              "Asia/Beirut",

            weekday:"long",
            hour:"2-digit",
            minute:"2-digit",
            hourCycle:"h23"
          }
        );

    }
    catch(_){

      timezone =
        "Asia/Beirut";


      formatter =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone:
              timezone,

            weekday:"long",
            hour:"2-digit",
            minute:"2-digit",
            hourCycle:"h23"
          }
        );

    }


    const values = {};


    formatter
      .formatToParts(
        new Date()
      )
      .forEach(
        function(part){

          if(
            part.type !==
            "literal"
          ){
            values[
              part.type
            ] =
              part.value;
          }

        }
      );


    return {
      day:
        String(
          values.weekday ||
          ""
        )
          .trim()
          .toLowerCase(),

      minutes:
        Number(
          values.hour ||
          0
        ) *
          60 +
        Number(
          values.minute ||
          0
        )
    };

  }


  function dayOffset(
    day,
    offset
  ){

    const index =
      DAYS.indexOf(
        day
      );


    if(index < 0){
      return "sunday";
    }


    return DAYS[
      (
        index +
        offset +
        DAYS.length
      ) %
      DAYS.length
    ];

  }


  function nextOpening(
    currentDay,
    currentMinutes
  ){

    if(!schedule){
      return null;
    }


    const today =
      schedule[
        currentDay
      ];


    if(
      today &&
      today.enabled
    ){

      const openMinutes =
        timeToMinutes(
          today.open
        );


      if(
        currentMinutes <
        openMinutes
      ){
        return {
          day:
            currentDay,

          time:
            today.open,

          today:true
        };
      }

    }


    for(
      let offset = 1;
      offset <= 7;
      offset++
    ){

      const day =
        dayOffset(
          currentDay,
          offset
        );


      const row =
        schedule[
          day
        ];


      if(
        row &&
        row.enabled
      ){
        return {
          day,
          time:
            row.open,
          today:false
        };
      }

    }


    return null;

  }


  function automaticState(){

    if(!schedule){
      return null;
    }


    const now =
      zonedNow();


    const today =
      schedule[
        now.day
      ] || {
        enabled:false,
        open:"09:00",
        close:"17:00"
      };


    const previousName =
      dayOffset(
        now.day,
        -1
      );


    const previous =
      schedule[
        previousName
      ] || {
        enabled:false,
        open:"09:00",
        close:"17:00"
      };


    /*
      Previous day's overnight schedule.

      Example:
      Monday 09:00 → 01:00
      Tuesday 00:30 still belongs to Monday's shift.
    */
    if(previous.enabled){

      const previousOpen =
        timeToMinutes(
          previous.open
        );


      const previousClose =
        timeToMinutes(
          previous.close
        );


      if(
        previousClose <
          previousOpen &&
        now.minutes <
          previousClose
      ){
        return {
          open:true,
          closesAt:
            previous.close
        };
      }

    }


    if(today.enabled){

      const openMinutes =
        timeToMinutes(
          today.open
        );


      const closeMinutes =
        timeToMinutes(
          today.close
        );


      /*
        Same opening and closing time = open 24 hours
        for that scheduled day.
      */
      if(
        openMinutes ===
        closeMinutes
      ){
        return {
          open:true,
          open24:true,
          closesAt:
            today.close
        };
      }


      /*
        Normal same-day hours.
      */
      if(
        closeMinutes >
        openMinutes
      ){

        if(
          now.minutes >=
            openMinutes &&
          now.minutes <
            closeMinutes
        ){
          return {
            open:true,
            closesAt:
              today.close
          };
        }

      }
      else{

        /*
          Overnight schedule.
          The after-midnight part is handled using yesterday above.
        */
        if(
          now.minutes >=
          openMinutes
        ){
          return {
            open:true,
            closesAt:
              today.close
          };
        }

      }

    }


    return {
      open:false,
      next:
        nextOpening(
          now.day,
          now.minutes
        )
    };

  }


  /* =========================================================
     RENDER
  ========================================================= */

  function setDotState(
    open,
    automatic,
    forcedColor
  ){

    let color;


    if(forcedColor){

      color =
        safeColor(
          forcedColor,
          "#d9a441"
        );

    }
    else if(automatic){

      color =
        open
          ? "#22c55e"
          : "#ef4444";

    }
    else{

      color =
        safeColor(
          directoryOptions.story_color,
          safeColor(
            directoryOptions.card_color,
            "#d9a441"
          )
        );

    }


    const rgb =
      hexToRgb(
        color
      ) ||
      {
        r:217,
        g:164,
        b:65
      };


    root.style.setProperty(
      "--m7-hours-dot",
      color
    );


    root.style.setProperty(
      "--m7-hours-dot-rgb",
      rgb.r +
      "," +
      rgb.g +
      "," +
      rgb.b
    );


    /*
      Online Service / Delivery need the WHOLE pulsing circle
      to follow the override color, including the gradient edges.
    */
    if(forcedColor){

      root.style.setProperty(
        "--m7-hours-accent-light",
        mixHex(
          rgb,
          {
            r:255,
            g:255,
            b:255
          },
          .38
        )
      );


      root.style.setProperty(
        "--m7-hours-accent-dark",
        mixHex(
          rgb,
          {
            r:0,
            g:0,
            b:0
          },
          .36
        )
      );

    }

  }


  function setText(
    mainText,
    subText
  ){

    root.innerHTML =
      '<span class="ma7alak-status-dot"></span>' +
      '<span class="ma7alak-status-text"></span>' +
      (
        subText
          ? '<span class="ma7alak-hours-sub"></span>'
          : ""
      );


    const mainEl =
      root.querySelector(
        ".ma7alak-status-text"
      );


    const subEl =
      root.querySelector(
        ".ma7alak-hours-sub"
      );


    if(mainEl){
      mainEl.textContent =
        mainText;
    }


    if(subEl){
      subEl.textContent =
        subText;
    }


    m7ApplyModuleTypography(
      root,
      directoryOptions,
      "hours"
    );

    root.classList.remove("m7-hours-pending");
    root.classList.add("m7-hours-ready");

  }


  function render(){

    const statusMode =
      String(
        directoryOptions.hours_status_mode ||
        ""
      )
        .trim()
        .toLowerCase();


    /*
      HOURS OVERRIDES
      These three modes override the weekly schedule until cleared in Admin.
    */
    if(statusMode === "online_service"){

      setDotState(
        false,
        false,
        "#38a8ff"
      );


      setText(
        "Online Service",
        ""
      );


      return;
    }


    if(statusMode === "online_delivery"){

      setDotState(
        false,
        false,
        "#a855f7"
      );


      setText(
        "Online Delivery",
        ""
      );


      return;
    }


    if(statusMode === "upon_request"){

      setDotState(
        false,
        false,
        "#facc15"
      );


      setText(
        "Upon Request",
        ""
      );


      return;
    }


    const state =
      automaticState();


    /*
      No weekly schedule saved:
      do NOT use the retired manual Status-pill text anymore.
    */
    if(!state){

      setDotState(
        false,
        false
      );


      setText(
        "Flexible hours",
        "Request Only"
      );


      return;
    }


    if(state.open){

      setDotState(
        true,
        true
      );


      setText(
        "Open now",

        state.open24
          ? "Open 24 hours"
          : (
              "Closes at " +
              formatTime(
                state.closesAt
              )
            )
      );


      return;
    }


    setDotState(
      false,
      true
    );


    if(state.next){

      setText(
        "Closed now",

        state.next.today
          ? (
              "Opens at " +
              formatTime(
                state.next.time
              )
            )
          : (
              "Opens " +
              DAY_LABELS[
                state.next.day
              ] +
              " at " +
              formatTime(
                state.next.time
              )
            )
      );


      return;
    }


    setText(
      "Closed",
      "No opening hours set"
    );

  }


  /* =========================================================
     LOAD SHOP PROFILE
  ========================================================= */

  async function loadProfile(){

    if(!SHOP_SLUG){

      directoryOptions = {};

      schedule = null;

      timezone =
        "Asia/Beirut";

      applyDesign(
        directoryOptions
      );

      render();

      return;
    }


    try{

      const profileClient =
        await getRealtimeClient();

      const profileResult =
        await window.ShoufHonProfileRowCache.get(
          SHOP_SLUG,
          profileClient
        );

      if(profileResult.error){
        throw profileResult.error;
      }

      const profile =
        profileResult.data || null;

      directoryOptions =
        profile &&
        profile.directory_options &&
        typeof profile.directory_options === "object"
          ? profile.directory_options
          : {};


      timezone =
        String(
          directoryOptions.hours_timezone ||
          "Asia/Beirut"
        ).trim() ||
        "Asia/Beirut";


      schedule =
        normalizeSchedule(
          directoryOptions.hours_schedule
        );


      applyDesign(
        directoryOptions
      );


      render();

    }
    catch(error){

      console.warn(
        "[Ma7alak Hours] profile:",
        error
      );


      /*
        If the profile request fails, do not invent opening hours.
        Keep the old manual text fallback.
      */
      schedule =
        null;


      applyDesign(
        directoryOptions
      );


      render();

    }

  }


  /* =========================================================
     LIVE ADMIN DRAFT PREVIEW
     Parent Shop Context relays MA7ALAK_DESIGN_PREVIEW into this iframe.
     This changes the real pill immediately without writing to Supabase.
  ========================================================= */

  function applyPreviewMessage(message){

    if(
      !message ||
      message.type !==
        "MA7ALAK_DESIGN_PREVIEW"
    ){
      return;
    }

    const slug =
      String(
        message.shop_slug ||
        message.shopSlug ||
        ""
      )
        .trim()
        .toLowerCase();

    if(
      !slug ||
      slug !== SHOP_SLUG
    ){
      return;
    }

    const stamp =
      Number(
        message.sent_at
      ) ||
      Date.now();

    if(
      stamp < lastPreviewStamp
    ){
      return;
    }

    lastPreviewStamp =
      stamp;

    const options =
      message.directory_options &&
      typeof message.directory_options ===
        "object"
        ? message.directory_options
        : {};

    directoryOptions = {
      ...directoryOptions,
      ...options
    };

    timezone =
      String(
        directoryOptions.hours_timezone ||
        "Asia/Beirut"
      ).trim() ||
      "Asia/Beirut";

    schedule =
      normalizeSchedule(
        directoryOptions.hours_schedule
      );

    applyDesign(
      directoryOptions
    );

    render();
  }


  window.addEventListener(
    "message",
    function(event){
      applyPreviewMessage(
        event &&
        event.data
      );
    }
  );


  try{
    if(
      "BroadcastChannel" in
      window
    ){
      previewBroadcastChannel =
        new BroadcastChannel(
          "ma7alak-design-live-v1"
        );

      previewBroadcastChannel.onmessage =
        function(event){
          applyPreviewMessage(
            event &&
            event.data
          );
        };
    }
  }
  catch(_){}


  window.addEventListener(
    "storage",
    function(event){
      if(
        event.key !==
          "ma7alak_design_live_v1:" +
          SHOP_SLUG ||
        !event.newValue
      ){
        return;
      }

      try{
        applyPreviewMessage(
          JSON.parse(
            event.newValue
          )
        );
      }
      catch(_){}
    }
  );


  /* =========================================================
     REALTIME — ADMIN SAVE UPDATES THE PILL
  ========================================================= */

  async function getRealtimeClient(){

    if(
      window.ShoufHonEmbedDataClient &&
      typeof window.ShoufHonEmbedDataClient.get === "function"
    ){
      return await window.ShoufHonEmbedDataClient.get();
    }

    throw new Error("SHOUFHON_SHARED_SUPABASE_CLIENT_NOT_READY");

  }

  async function startRealtime(){

    if(
      realtimeChannel ||
      !SHOP_SLUG
    ){
      return;
    }


    try{

      const client =
        await getRealtimeClient();


      realtimeChannel =
        client
          .channel(
            "ma7alak-hours-auto-" +
            SHOP_SLUG +
            "-" +
            Math.random()
              .toString(36)
              .slice(2)
          )
          .on(
            "postgres_changes",
            {
              event:"UPDATE",
              schema:"public",
              table:"shop_profiles",
              filter:
                "shop_slug=eq." +
                SHOP_SLUG
            },
            function(){
              window.ShoufHonProfileRowCache?.invalidate(SHOP_SLUG);
              loadProfile();
            }
          )
          .subscribe();

    }
    catch(error){

      console.warn(
        "[Ma7alak Hours] realtime:",
        error
      );

    }

  }


  /* =========================================================
     OFFSCREEN PERFORMANCE
  ========================================================= */

  function setupVisibilityPause(){

    if(
      !(
        "IntersectionObserver"
        in window
      )
    ){
      return;
    }


    const observer =
      new IntersectionObserver(
        function(entries){

          entries.forEach(
            function(entry){

              root.classList.toggle(
                "m7-hours-paused",
                !entry.isIntersecting
              );

            }
          );

        },
        {
          threshold:.01
        }
      );


    observer.observe(
      root
    );

  }


  /* =========================================================
     BOOT
  ========================================================= */

  loadProfile();
  startRealtime();
  setupVisibilityPause();


  clockTimer =
    setInterval(
      function(){

        if(
          (document.visibilityState === "visible" && window.ShoufHonEmbedVisibility?.visible !== false)
        ){
          render();
        }

      },
      30000
    );


  window.addEventListener(
    "focus",
    function(){
      loadProfile();
      render();
    }
  );


  document.addEventListener(
    "visibilitychange",
    function(){

      if(
        (document.visibilityState === "visible" && window.ShoufHonEmbedVisibility?.visible !== false)
      ){
        loadProfile();
        render();
        startRealtime();
      }

    }
  );


  window.addEventListener(
    "beforeunload",
    function(){

      if(clockTimer){
        clearInterval(
          clockTimer
        );
      }

      if(previewBroadcastChannel){
        try{
          previewBroadcastChannel.close();
        }catch(_){}
      }

    }
  );

})();
</script>

<script>
(async function(){
  "use strict";

  if(window.__MA7ALAK_PROFILE_SHELL_V1__)return;

  const shell=document.getElementById("ma7alak-profile-shell");

  let SHOP_SLUG="";
  try{
    const ctx=window.ShoufHonShopContextClient;
    if(ctx){
      SHOP_SLUG=String(ctx.slug||"").trim().toLowerCase();
      if(!SHOP_SLUG){
        SHOP_SLUG=await ctx.resolve({
          explicit:String(shell.getAttribute("data-shop-slug")||"").trim(),
          fallback:function(){return ctx.detectPageSlug();},
          timeout:350
        });
      }
    }
  }catch(error){
    console.warn("[ShoufHon Profile Shell] context:",error);
  }
  if(!SHOP_SLUG){
    try{
      SHOP_SLUG=String(
        window.ShoufHonShopContextClient?.detectPageSlug?.()||""
      ).trim().toLowerCase();
    }catch(_){}
  }
  if(!SHOP_SLUG){
    /*
       Hostinger can deliver the parent shop context after this shell starts.
       Keep the renderer alive; the main Story/Profile runtime resolves the
       slug shortly after and hands it back through setSlug().
    */
    console.warn("[ShoufHon Profile Shell] Shop context is late; waiting for profile runtime.");
  }else{
    shell.setAttribute("data-shop-slug",SHOP_SLUG);
  }

  const CHANNEL_NAME="ma7alak-design-live-v1";

  let bc=null;
  let realtimeChannel=null;
  let realtimeClient=null;
  let realtimeSlug="";
  let lastPreviewStamp=0;
  let revealTimer=0;

  function normalizeRuntimeSlug(value){
    let slug=String(value||"").trim().toLowerCase();
    try{slug=decodeURIComponent(slug)}catch(_){}
    slug=slug.replace(/^\/+|\/+$/g,"");
    return /^[a-z0-9][a-z0-9._&-]*$/i.test(slug)?slug:"";
  }

  function syncRuntimeSlug(value){
    const explicit=normalizeRuntimeSlug(value);
    const fromShell=normalizeRuntimeSlug(
      shell.getAttribute("data-shop-slug")||""
    );
    const fromContext=normalizeRuntimeSlug(
      window.ShoufHonShopContextClient?.slug||""
    );
    const next=explicit||fromShell||fromContext||SHOP_SLUG;

    if(next&&next!==SHOP_SLUG){
      SHOP_SLUG=next;
      shell.setAttribute("data-shop-slug",SHOP_SLUG);
    }

    return SHOP_SLUG;
  }

  function cacheKey(){
    const slug=syncRuntimeSlug();
    return slug?"ma7alak_profile_theme_v1:"+slug:"";
  }

  function previewStorageKey(){
    const slug=syncRuntimeSlug();
    return slug?"ma7alak_design_live_v1:"+slug:"";
  }

  function clamp(value,min,max,fallback){
    const n=Number(value);
    return Number.isFinite(n)?Math.max(min,Math.min(max,n)):fallback;
  }

  function hex(value,fallback){
    const raw=String(value||"").trim();
    return /^#[0-9a-f]{6}$/i.test(raw)?raw:fallback;
  }

  function hexRgb(value,fallback){
    const raw=hex(value,fallback).slice(1);
    return [
      parseInt(raw.slice(0,2),16),
      parseInt(raw.slice(2,4),16),
      parseInt(raw.slice(4,6),16)
    ];
  }

  function bool(value,fallback){
    if(value===undefined||value===null||value==="")return fallback;
    if(value===true||String(value).toLowerCase()==="true")return true;
    if(value===false||String(value).toLowerCase()==="false")return false;
    return fallback;
  }

  function reveal(){
    clearTimeout(revealTimer);
    shell.classList.remove("m7-profile-theme-loading");
    shell.classList.add("m7-profile-theme-ready");
    requestAnimationFrame(()=>{shell.style.opacity="1";});
  }

  function hideUntilTheme(){
    /* Fail-open: keep the shop profile visible while saved Admin design loads. */
    shell.classList.remove("m7-profile-theme-loading");
    shell.classList.add("m7-profile-theme-ready");
    shell.style.opacity="1";
  }

  function readCachedOptions(){
    try{
      const key=cacheKey();
      if(!key)return null;
      const data=JSON.parse(localStorage.getItem(key)||"null");
      return data&&typeof data==="object"&&!Array.isArray(data)?data:null;
    }catch(_){return null;}
  }

  function cacheSavedOptions(options){
    try{
      const key=cacheKey();
      if(!key)return;
      localStorage.setItem(key,JSON.stringify(options||{}));
    }catch(_){}
  }

  function apply(options,meta){
    syncRuntimeSlug();
    options=options&&typeof options==="object"&&!Array.isArray(options)?options:{};
    meta=meta||{};
    window.__M7_PROFILE_STUDIO_LAST_OPTIONS__=options;

    const accent=hex(options.story_color||options.card_color,"#d9a441");
    const shellBg=hex(options.profile_shell_bg_color,"#100d0b");
    const shellBgImageRaw=String(options.profile_shell_bg_image_url||"").trim();
    const shellBgImage=/^https?:\/\//i.test(shellBgImageRaw)
      ? shellBgImageRaw.replace(/\\/g,"%5C").replace(/"/g,"%22").replace(/[\r\n]/g,"")
      : "";
    const shellBorder=hex(options.profile_shell_border_color,accent);
    const bannerBorder=hex(options.profile_banner_border_color,shellBorder);
    const statsBorder=shellBorder;
    const statsNumber=hex(options.profile_stats_number_color,"#ffffff");
    const statsLabel=hex(options.profile_stats_label_color,"#bcb5ae");
    const followBg=hex(options.profile_follow_btn_bg_color,"#5a351a");
    const followBorder=hex(options.profile_follow_btn_border_color,shellBorder);
    const followText=hex(options.profile_follow_btn_text_color,"#ffffff");
    const messageBg=hex(options.profile_message_btn_bg_color,"#0d0d0e");
    const messageBorder=hex(options.profile_message_btn_border_color,"#65543e");
    const messageText=hex(options.profile_message_btn_text_color,"#ffffff");

    const [bgR,bgG,bgB]=hexRgb(shellBg,"#100d0b");
    const [borderR,borderG,borderB]=hexRgb(shellBorder,accent);
    const [followR,followG,followB]=hexRgb(followBg,"#5a351a");
    const [messageR,messageG,messageB]=hexRgb(messageBg,"#0d0d0e");

    const opacity=clamp(options.profile_shell_opacity,0,100,92)/100;
    const shellImageOverlay=clamp(options.profile_shell_bg_image_overlay,0,90,48)/100;
    const shellImagePosition=clamp(options.profile_shell_bg_image_position_y,0,100,50);
    const shellLayerAlpha=shellBgImage?shellImageOverlay:opacity;
    const shadow=clamp(options.profile_shell_shadow,0,100,42);
    const glow=clamp(options.profile_shell_glow,0,100,18);
    const shellFrameAllowed=["current","shimmer","glow","breathe","float","pulse","sway","bounce","flicker","none"];
    const shellFrameRaw=String(options.profile_shell_animation||"none").trim().toLowerCase();
    const shellFrameAnimation=shellFrameAllowed.includes(shellFrameRaw)?shellFrameRaw:"none";
    const shellFrameSpeed=clamp(options.profile_shell_animation_speed,0.8,8,2.8);
    const shellFrameIntensity=clamp(options.profile_shell_animation_intensity,0,100,60)/100;
    const blur=clamp(options.profile_shell_blur,0,30,10);
    const padding=clamp(options.profile_shell_padding,0,28,14);
    const topGap=clamp(options.profile_shell_top_gap,0,40,8);
    const bottomGap=clamp(options.profile_shell_bottom_gap,0,50,18);
    const borderWidth=clamp(options.profile_shell_border_width,0,4,1);
    const radius=clamp(options.profile_shell_radius,0,48,30);
    const bannerHeight=clamp(options.profile_banner_height,80,260,150);
    const bannerOverlay=clamp(options.profile_banner_overlay,0,85,30)/100;
    const bannerPos=clamp(options.profile_banner_position_y,0,100,50);
    const bannerBorderWidth=clamp(options.profile_banner_border_width,0,4,1);
    const logoSize=clamp(options.profile_logo_size,120,270,210);
    const logoOverlap=clamp(options.profile_logo_overlap,0,130,62);

    const storyEffectAllowed=["premium","glow","shimmer","sparkle","heartbeat","soft","radar","halo","comet","neon-wave","orbit-glint","double-pulse","none"];
    const storyEffectRaw=String(options.story_new_effect||"premium").trim().toLowerCase();
    const storyEffect=storyEffectAllowed.includes(storyEffectRaw)?storyEffectRaw:"premium";
    const storySpeed=clamp(options.story_new_speed,1,6,2.2);
    const storyIntensity=clamp(options.story_new_intensity,0,100,72)/100;
    const storyGlowColor=hex(
      options.story_glow_color,
      hex(options.profile_ring_color,accent)
    );
    const [storyGlowR,storyGlowG,storyGlowB]=hexRgb(
      storyGlowColor,
      hex(options.profile_ring_color,accent)
    );
    const storyGlowPower=clamp(options.story_glow_power,0,100,72)/100;
    const storySparkles=Math.round(clamp(options.story_new_sparkle_count,0,2,2));
    const storyImagePulse=bool(options.story_new_image_pulse,true);

    shell.dataset.layout=String(options.profile_shell_layout||"luxury").trim().toLowerCase();
    shell.dataset.actionStyle=String(options.profile_action_style||"premium").trim().toLowerCase();
    shell.dataset.frameAnimation=shellFrameAnimation;
    shell.classList.toggle("m7-profile-vip",bool(options.vip_crown_enabled,false));
    shell.dataset.storyEffect=storyEffect;
    shell.dataset.storyImagePulse=storyImagePulse?"1":"0";
    shell.dataset.storySparkles=String(storySparkles);
    delete shell.dataset.motionMode;
    shell.dataset.profileCircle=bool(options.profile_circle_enabled,true)?"1":"0";
    shell.classList.toggle("m7-profile-shell-disabled",!bool(options.profile_shell_enabled,true));
    shell.classList.toggle("m7-profile-no-inner-highlight",!bool(options.profile_shell_inner_highlight,true));
    shell.classList.toggle("m7-profile-has-banner",bool(options.profile_banner_enabled,false));

    shell.style.setProperty("--m7-profile-accent",accent);
    shell.style.setProperty("--m7-profile-shell-bg-rgb",bgR+","+bgG+","+bgB);
    shell.style.setProperty("--m7-profile-shell-opacity",String(opacity));
    shell.style.setProperty("--m7-profile-shell-bg-image",shellBgImage?'url("'+shellBgImage+'")':"none");
    shell.style.setProperty("--m7-profile-shell-bg-layer-alpha",String(shellLayerAlpha));
    shell.style.setProperty("--m7-profile-shell-bg-image-position",shellImagePosition+"%");
    shell.style.setProperty("--m7-profile-shell-border",shellBorder);
    shell.style.setProperty("--m7-profile-shell-border-rgb",borderR+","+borderG+","+borderB);
    shell.style.setProperty("--m7-profile-shell-border-width",borderWidth+"px");
    shell.style.setProperty("--m7-profile-shell-radius",radius+"px");
    shell.style.setProperty("--m7-profile-shell-shadow-alpha",String(Math.min(.72,shadow/100*.58)));
    shell.style.setProperty("--m7-profile-shell-glow-alpha",String(Math.min(.62,glow/100*.48)));
    shell.style.setProperty("--m7-profile-shell-glow-size",(4+glow*.22).toFixed(1)+"px");
    shell.style.setProperty("--m7-profile-shell-frame-speed",shellFrameSpeed+"s");
    shell.style.setProperty("--m7-profile-shell-frame-intensity",String(shellFrameIntensity));
    shell.style.setProperty("--m7-profile-shell-blur",blur+"px");
    shell.style.setProperty("--m7-profile-shell-padding",padding+"px");
    shell.style.setProperty("--m7-profile-shell-top-gap",topGap+"px");
    shell.style.setProperty("--m7-profile-shell-bottom-gap",bottomGap+"px");

    shell.style.setProperty("--m7-profile-banner-height",bannerHeight+"px");
    shell.style.setProperty("--m7-profile-banner-overlay",String(bannerOverlay));
    shell.style.setProperty("--m7-profile-banner-position",bannerPos+"%");
    shell.style.setProperty("--m7-profile-banner-border",bannerBorder);
    shell.style.setProperty("--m7-profile-banner-border-width",bannerBorderWidth+"px");

    shell.style.setProperty("--m7-profile-logo-size",logoSize+"px");
    shell.style.setProperty("--m7-profile-logo-overlap",logoOverlap+"px");
    shell.style.setProperty("--m7-story-orbit-y",(-(logoSize/2+2)).toFixed(1)+"px");

    shell.style.setProperty("--m7-story-speed",storySpeed+"s");
    shell.style.setProperty("--m7-story-soft-speed",(storySpeed*1.35).toFixed(2)+"s");
    shell.style.setProperty("--m7-story-delay",(-storySpeed*.45).toFixed(2)+"s");
    shell.style.setProperty("--m7-story-intensity",String(storyIntensity));
    shell.style.setProperty(
      "--m7-story-glow-rgb",
      storyGlowR+","+storyGlowG+","+storyGlowB
    );
    shell.style.setProperty(
      "--m7-story-glow-alpha",
      String((.14+storyGlowPower*.78).toFixed(3))
    );
    shell.style.setProperty(
      "--m7-story-soft-alpha",
      String((.06+storyGlowPower*.38).toFixed(3))
    );
    shell.style.setProperty(
      "--m7-story-glow-near",
      (10+storyGlowPower*28).toFixed(1)+"px"
    );
    shell.style.setProperty(
      "--m7-story-glow-far",
      (18+storyGlowPower*46).toFixed(1)+"px"
    );
    shell.style.setProperty("--m7-story-scale",String((1+storyIntensity*.080).toFixed(4)));
    shell.style.setProperty("--m7-story-scale-soft",String((1+storyIntensity*.035).toFixed(4)));

    shell.style.setProperty("--m7-profile-stats-border",statsBorder);
    shell.style.setProperty("--m7-profile-stats-number",statsNumber);
    shell.style.setProperty("--m7-profile-stats-label",statsLabel);

    shell.style.setProperty("--m7-profile-follow-bg",followBg);
    shell.style.setProperty("--m7-profile-follow-bg-rgb",followR+","+followG+","+followB);
    shell.style.setProperty("--m7-profile-follow-border",followBorder);
    shell.style.setProperty("--m7-profile-follow-text",followText);
    shell.style.setProperty("--m7-profile-message-bg",messageBg);
    shell.style.setProperty("--m7-profile-message-bg-rgb",messageR+","+messageG+","+messageB);
    shell.style.setProperty("--m7-profile-message-border",messageBorder);
    shell.style.setProperty("--m7-profile-message-text",messageText);

    if(meta.cache===true)cacheSavedOptions(options);
    if(meta.reveal===true)reveal();

    if(meta.emit!==false){
      const eventName=meta.preview===true?"ma7alak:profile-design-preview":"ma7alak:profile-design-saved";
      try{
        window.dispatchEvent(new CustomEvent(eventName,{detail:{shop_slug:SHOP_SLUG,directory_options:options,source:meta.source||"profile-shell"}}));
      }catch(_){}
    }
  }

  /*
     IMPORTANT: Admin/profile design previews must NEVER manufacture Story state.
     The new/unseen Story ring is controlled only by real active shop_stories.
     Profile image/banner add, change or remove events therefore cannot trigger it.
  */
  function previewStoryDesign(){
    return;
  }

  function receivePreview(message,source){
    if(!message||message.type!=="MA7ALAK_DESIGN_PREVIEW")return;
    const slug=normalizeRuntimeSlug(message.shop_slug||message.shopSlug||"");
    const currentSlug=syncRuntimeSlug(slug);
    if(!slug||!currentSlug||slug!==currentSlug)return;
    const stamp=Number(message.sent_at)||Date.now();
    if(stamp<lastPreviewStamp)return;
    lastPreviewStamp=stamp;

    const options=
      message.directory_options &&
      typeof message.directory_options==="object"
        ? message.directory_options
        : {};

    apply(options,{cache:false,reveal:true,emit:true,preview:true,source:source||"preview"});
    previewStoryDesign(options);

    const profile=
      message.profile &&
      typeof message.profile==="object"
        ? message.profile
        : null;

    if(profile){
      try{
        window.dispatchEvent(
          new CustomEvent(
            "ma7alak:profile-draft-preview",
            {
              detail:{
                ...profile,
                shop_slug:SHOP_SLUG,
                directory_options:options,
                sent_at:stamp,
                source:source||"preview"
              }
            }
          )
        );
      }catch(_){}
    }
  }

  function connectRealtime(client){
    const currentSlug=syncRuntimeSlug();
    if(!client||typeof client.channel!=="function"||!currentSlug)return;
    if(realtimeChannel&&realtimeClient===client&&realtimeSlug===currentSlug)return;
    if(realtimeChannel&&realtimeClient){try{realtimeClient.removeChannel(realtimeChannel);}catch(_){}}
    realtimeClient=client;
    realtimeSlug=currentSlug;
    realtimeChannel=client
      .channel("ma7alak-design-preview-"+currentSlug)
      .on("broadcast",{event:"design-preview"},payload=>receivePreview(payload&&payload.payload,"supabase"))
      .subscribe();
  }

  try{
    if("BroadcastChannel" in window){
      bc=new BroadcastChannel(CHANNEL_NAME);
      bc.onmessage=event=>receivePreview(event.data,"broadcast-channel");
    }
  }catch(_){}

  window.addEventListener("storage",event=>{
    const key=previewStorageKey();
    if(!key||event.key!==key||!event.newValue)return;
    try{receivePreview(JSON.parse(event.newValue),"storage");}catch(_){}
  });

  window.addEventListener("message",event=>{
    let trusted=false;
    try{
      trusted=
        (window.parent&&window.parent!==window&&event.source===window.parent) ||
        (window.top&&window.top!==window&&event.source===window.top) ||
        (window.parent===window&&event.source===window);
    }catch(_){}
    if(!trusted)return;
    receivePreview(event&&event.data,"post-message");
  });

  const cached=readCachedOptions();
  if(cached)apply(cached,{cache:false,reveal:false,emit:false,source:"cache-preflight"});

  hideUntilTheme();
  revealTimer=setTimeout(reveal,700);

  window.Ma7alakProfileShell={
    get slug(){return syncRuntimeSlug();},
    setSlug:function(value){
      return syncRuntimeSlug(value);
    },
    apply,
    reveal,
    hideUntilTheme,
    getCachedOptions:readCachedOptions,
    connectRealtime
  };
})();
</script>

<script>
/* Reuse the Supabase SDK request already started by the Hours block above.
   This prevents a second SDK download/parse inside the same Hostinger iframe. */
window.__SHOUFHON_EMBED_SUPABASE_READY__ =
  window.__SHOUFHON_EMBED_SUPABASE_READY__ ||
  (function(){
    if(window.supabase&&typeof window.supabase.createClient==="function"){
      return Promise.resolve(window.supabase);
    }

    const existing=document.querySelector(
      'script[data-m7-hours-supabase="1"],script[data-shoufhon-embed-supabase="1"],script[src*="@supabase/supabase-js@2"]'
    );

    return new Promise(function(resolve,reject){
      let settled=false;
      let checkTimer=0;
      const startedAt=Date.now();

      function cleanup(){
        clearTimeout(checkTimer);
        if(existing){
          existing.removeEventListener("load",onLoad);
          existing.removeEventListener("error",onError);
        }
      }

      function finishIfReady(){
        if(settled)return true;
        if(window.supabase&&typeof window.supabase.createClient==="function"){
          settled=true;
          cleanup();
          resolve(window.supabase);
          return true;
        }
        return false;
      }

      function fail(error){
        if(settled)return;
        settled=true;
        cleanup();
        reject(error instanceof Error?error:new Error("SUPABASE_LOAD_FAILED"));
      }

      function onLoad(){
        if(!finishIfReady()){
          fail(new Error("SUPABASE_LOAD_FAILED"));
        }
      }

      function onError(){
        fail(new Error("SUPABASE_LOAD_FAILED"));
      }

      function checkExisting(){
        if(finishIfReady())return;
        if(Date.now()-startedAt>=6000){
          fail(new Error("SUPABASE_LOAD_TIMEOUT"));
          return;
        }
        checkTimer=setTimeout(checkExisting,40);
      }

      if(existing){
        existing.addEventListener("load",onLoad,{once:true});
        existing.addEventListener("error",onError,{once:true});

        /* Critical refresh-race fix: the SDK can finish between the first
           window.supabase check above and listener attachment. Poll only
           during startup so a missed load event can never hang this promise. */
        checkTimer=setTimeout(checkExisting,0);
        return;
      }

      const script=document.createElement("script");
      script.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
      script.async=true;
      script.dataset.shoufhonEmbedSupabase="1";
      script.addEventListener("load",onLoad,{once:true});
      script.addEventListener("error",onError,{once:true});
      document.head.appendChild(script);
      checkTimer=setTimeout(checkExisting,40);
    });
  })();
</script>

  function ma7alakStoryHexToRgb(hex){

    const clean =
      String(hex || "")
        .trim()
        .replace("#","");

    if(!/^[0-9a-f]{6}$/i.test(clean)){
      return null;
    }

    return {

      b:parseInt(clean.slice(4,6),16)
    };
  }


  function ma7alakStoryMixHex(
    rgb,
    target,
    amount
  ){

    function clamp(value){
      return Math.max(
        0,
        Math.min(
          255,
          Math.round(value)
        )
      );
    }

    return (
      "#" +
      [
        clamp(rgb.r + (target.r-rgb.r)*amount),
        clamp(rgb.g + (target.g-rgb.g)*amount),
        clamp(rgb.b + (target.b-rgb.b)*amount)
      ]
        .map(
          function(value){
            return value
              .toString(16)
              .padStart(2,"0");
          }

  function m7dsSafeHex(value,fallback){
    const raw =
      String(value || "").trim();

    return (
      /^#[0-9a-f]{6}$/i.test(raw)
        ? raw
        : fallback
    );
  }


  function m7dsCssText(value){
    return String(value || "")
      .replace(/\\/g,"\\\\")
      .replace(/"/g,'\\"')
      .replace(/\n/g," ");
  }


  function m7dsSymbol(
    kind,
    custom
  ){

    const own =
      String(custom || "").trim();

    if(
      kind === "custom" &&
      own
    ){
      return own.slice(0,5);
    }

    return (
      {
        diamond:"◆",
        star:"★",
        sparkle:"✦",
        dot:"•",
        none:""
      }[kind] ||
      "◆"
    );
  }


  function m7dsLineBackground(
    style,
    color,
    rgba
  ){

    if(style === "solid"){
      return color;
    }

    if(style === "double"){
      return (
        "linear-gradient(to bottom," +
        color +
        " 0 1px,transparent 1px 2px," +
        color +
        " 2px 3px)"
      );
    }

    if(style === "dotted"){
      return (
        "radial-gradient(circle," +
        color +
        " 0 1.2px,transparent 1.4px) 0 50% / 7px 3px repeat-x"
      );
    }

    return (
      "linear-gradient(90deg,transparent 0%," +
      rgba +
      " 24%," +
      color +
      " 100%)"
    );
  }



  /* =========================================================
     PAGE TYPOGRAPHY
     Global + per-module font style and proportional text size.
     No external font downloads are used.
  ========================================================= */

  function m7dsFontStack(
    mode
  ){

    return (
      {
        system:
          '"Segoe UI",Arial,Helvetica,sans-serif',

        modern:
          '"Trebuchet MS","Segoe UI",Arial,sans-serif',

        elegant:
          'Georgia,"Times New Roman",serif',

        classic:
          '"Times New Roman",Georgia,serif',

        mono:
          '"Courier New",Courier,monospace'
      }[
        String(mode || "")
          .trim()
          .toLowerCase()
      ]
      ||
      ""
    );
  }


  function m7dsFontPercent(
    value
  ){

    const number =
      Number(value);

    if(
      !Number.isFinite(number)
    ){
      return 100;
    }

    return Math.max(
      70,
      Math.min(
        150,
        number
      )
    );
  }


  function m7dsApplyTypography(
    root,
    options,
    moduleKey
  ){

    if(!root){
      return;
    }


    const globalStyle =
      String(
        options.global_font_style ||
        "current"
      )
        .trim()
        .toLowerCase();


    const moduleStyleRaw =
      String(
        options[
          moduleKey +
          "_font_style"
        ] ||
        "inherit"
      )
        .trim()
        .toLowerCase();


    const finalStyle =
      moduleStyleRaw === "inherit"
        ? globalStyle
        : moduleStyleRaw;


    const family =
      m7dsFontStack(
        finalStyle
      );


    const globalScale =
      m7dsFontPercent(
        options.global_font_size
      );


    const moduleScale =
      m7dsFontPercent(
        options[
          moduleKey +
          "_font_size"
        ]
      );


    const finalScale =
      (
        globalScale *
        moduleScale
      ) / 10000;


    const elements =
      [
        root,
        ...root.querySelectorAll("*")
      ];


    elements.forEach(
      function(el){

        if(
          !el ||
          !el.tagName
        ){
          return;
        }


        const tag =
          el.tagName
            .toUpperCase();


        if(
          [
            "STYLE",
            "SCRIPT",
            "SVG",
            "PATH",
            "IMG",
            "VIDEO"
          ].includes(tag)
        ){
          return;
        }


        const directText =
          Array.from(
            el.childNodes || []
          )
            .some(
              function(node){
                return (
                  node.nodeType === 3 &&
                  String(
                    node.textContent || ""
                  ).trim()
                );
              }
            );


        const formText =
          [
            "BUTTON",
            "INPUT",
            "TEXTAREA",
            "SELECT",
            "OPTION"
          ].includes(tag);


        if(
          !directText &&
          !formText
        ){
          return;
        }


        if(
          family
        ){
          el.style.setProperty(
            "font-family",
            family,
            "important"
          );
        }
        else{
          el.style.removeProperty(
            "font-family"
          );
        }


        let base =
          Number(
            el.dataset
              .m7BaseFontSize
          );


        if(
          !Number.isFinite(base) ||
          base <= 0
        ){

          const current =
            parseFloat(
              getComputedStyle(el)
                .fontSize
            );


          if(
            !Number.isFinite(current) ||
            current <= 0
          ){
            return;
          }


          base =
            current;


          el.dataset
            .m7BaseFontSize =
              String(base);

        }


        el.style.setProperty(
          "font-size",
          (
            base *
            finalScale
          )
            .toFixed(2) +
          "px",
          "important"
        );

      }
    );

  }

  /* =========================================================
     LOAD SHOP PROFILE FROM ADMIN / SUPABASE
     ---------------------------------------------------------
     SHOP_SLUG is the ONLY shop-specific value needed here.

     Priority for the Story circle image:
       1. story_logo_url
       2. profile_image_url
       3. default placeholder when both are empty
  ========================================================= */

  async function loadShopProfileFromAdmin(){
    try{

      /* The public identity must not wait for Account.ready() or the SDK.
         Both can still be starting on a hard refresh. The shared cache
         uses the public REST read until an existing client is available. */
      const profileClient =
        supabaseClient ||
        window.Ma7alakAccount?.client ||
        window.__MA7ALAK_SHARED_SUPABASE_CLIENT__ ||
        null;

      const result =
        await window.ShoufHonProfileRowCache.get(
          SHOP_SLUG,
          profileClient
        );


      if(result.error){

        console.error(
          "MA7ALAK shop profile:",
          result.error
        );

        return null;

      }


      if(!result.data){

        console.warn(
          "MA7ALAK: No shop_profiles row found for slug:",
          SHOP_SLUG
        );

        return null;

      }


      SHOP_PROFILE =
        result.data;


      STORY_CIRCLE_IMAGE_URL =
        String(
          SHOP_PROFILE.story_logo_url ||
          SHOP_PROFILE.profile_image_url ||
          ""
        ).trim();


      SHOP_IDENTITY.name =
        String(
          SHOP_PROFILE.shop_name ||
          SHOP_IDENTITY.name ||
          ""
        ).trim();


      SHOP_IDENTITY.category =
        String(
          SHOP_PROFILE.category ||
          ""
        ).trim();


      const directoryOptions =
        SHOP_PROFILE &&
        SHOP_PROFILE.directory_options &&
        typeof SHOP_PROFILE.directory_options === "object"
          ? SHOP_PROFILE.directory_options
          : {};


      SHOP_IDENTITY.label =
        String(
          SHOP_PROFILE.category_name ||
          ""
        ).trim();


      SHOP_IDENTITY.labelIcon =
        String(
          directoryOptions.shop_label_icon ||
          "shop"
        ).trim().toLowerCase();


      SHOP_IDENTITY.labelIconText =
        String(
          directoryOptions.shop_label_icon_text ||
          ""
        ).trim();


      SHOP_IDENTITY.arabicName =
        String(
          SHOP_PROFILE.arabic_name ||
          ""
        ).trim();


      /*
         Refresh the already-existing UI with the Admin values.
      */
      renderShopIdentity();
      renderStoryCircleImage();
      renderProfileVerifiedBadge();
      applyStoryColorFromAdmin(
        SHOP_PROFILE
      );

      applyPageDesignFromAdmin(
        SHOP_PROFILE
      );

      if(
        window.Ma7alakProfileShell &&
        typeof window.Ma7alakProfileShell.apply === "function"
      ){
        window.Ma7alakProfileShell.apply(
          directoryOptions,
          {
            cache:true,
            reveal:true,
            emit:true,
            preview:false,
            source:"shop_profiles"
          }
        );
      }


      return SHOP_PROFILE;

    }
    catch(error){

      console.error(
        "MA7ALAK shop profile:",
        error
      );

      return null;

    }

  }

  /*
     Story rows are enabled in Supabase Realtime.
     This replaces the old 10-second database polling loop for normal
     Story uploads / deletes / updates.
  */
  function scheduleStoryRealtimeRetry(){
    clearTimeout(ma7alakStoryRealtimeRetryTimer);
    ma7alakStoryRealtimeRetryTimer=null;

    if(document.visibilityState!=="visible" || window.ShoufHonEmbedVisibility?.visible===false){
      return;
    }

    ma7alakStoryRealtimeAttempt=Math.min(ma7alakStoryRealtimeAttempt+1,8);
    const delay=Math.min(10000,500*Math.pow(2,ma7alakStoryRealtimeAttempt-1));

    ma7alakStoryRealtimeRetryTimer=setTimeout(function(){
      ma7alakStoryRealtimeRetryTimer=null;
      subscribeToStoryDataUpdates();
    },delay);
  }


  function releaseStoryRealtimeChannel(){
    const channel=ma7alakStoryDataChannel;
    ma7alakStoryDataChannel=null;
    ma7alakStoryRealtimeReady=false;

    if(channel&&supabaseClient){
      try{supabaseClient.removeChannel(channel);}catch(_){}
    }
  }


  function subscribeToStoryDataUpdates(){

    if(
      !supabaseClient ||
      typeof supabaseClient.channel !== "function"
    ){
      return;
    }

    if(ma7alakStoryDataChannel){
      return;
    }

    const channel=
      supabaseClient
        .channel(
          "ma7alak-story-data-" +
          SHOP_SLUG
        )
        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"shop_stories",
            filter:
              "shop_slug=eq." +
              SHOP_SLUG
          },
          function(payload){

            const eventType=
              String(payload?.eventType||"")
                .toUpperCase();

            /* Any Story row change reloads canonical Story state. The
               unseen-state transition itself starts the configured Story
               animation; there is no separate upload-burst effect anymore. */
            loadStories();
          }
        );

    ma7alakStoryDataChannel=channel;

    channel.subscribe(function(status){
      if(ma7alakStoryDataChannel!==channel){
        return;
      }

      if(status === "SUBSCRIBED"){
        ma7alakStoryRealtimeReady=true;
        ma7alakStoryRealtimeAttempt=0;
        clearTimeout(ma7alakStoryRealtimeRetryTimer);
        ma7alakStoryRealtimeRetryTimer=null;

        /* Close the tiny subscribe race with one canonical read. */
        loadStories();
        return;
      }

      if(
        status === "CHANNEL_ERROR" ||
        status === "TIMED_OUT" ||
        status === "CLOSED"
      ){
        releaseStoryRealtimeChannel();
        scheduleStoryRealtimeRetry();
      }
    });

  }

  ========================================================= */

  function updateNewStoryAnimation(){

    if(!storyWrapper){

      return;

    }


    if(
      !stories.length
    ){

      stopNewStoryAnimation();

      return;

    }


    const newestStory =
      stories[
        stories.length - 1
      ];


    let lastSeen =
      null;


    try{

      lastSeen =
        localStorage.getItem(
          STORY_SEEN_KEY
        );

    }

    catch(error){

      lastSeen =
        null;

    }


    if(!lastSeen){

      startNewStoryAnimation();

      return;

    }


    const newestTime =
      new Date(
        newestStory.created_at
      ).getTime();


    const lastSeenTime =
      new Date(
        lastSeen
      ).getTime();


    if(
      newestTime >
      lastSeenTime
    ){

      startNewStoryAnimation();

    }

    else{

      stopNewStoryAnimation();

    }

  }

     The real owner/account system runs on the top-level page.
     Story embeds ask the parent for the current owner state and also

  function setStoryViewerLoginState(value){

  function applyParentOwnerState(data){

    if(
      !data ||
      data.type !== "MA7ALAK_OWNER_STATE"
    ){
      return false;
    }

    const incomingSlug =
      String(data.shopSlug || "")
        .trim()
        .toLowerCase();

    const currentSlug =
      String(SHOP_SLUG || "")
        .trim()
        .toLowerCase();

    ma7alakParentOwnerStateReceived = true;
    ma7alakParentIsLoggedIn = !!data.isLoggedIn;
    ma7alakParentIsOwner = !!data.isOwner;
    ma7alakParentOwnerSlug = incomingSlug;

    setStoryViewerLoginState(
      ma7alakParentIsLoggedIn
    );

    setShopOwnerState(
      ma7alakParentIsOwner &&
      incomingSlug === currentSlug
    );

    return true;

  }

  function ownerPageTarget(){

    if(window.ShoufHonNativeShopTest)return window;

    try{
      if(
        window.top &&
        window.top !== window
      ){
        return window.top;
      }
    }
    catch(error){}

    try{
      if(
        window.parent &&
        window.parent !== window
      ){
        return window.parent;
      }
    }
    catch(error){}

    return null;

  }

  function requestParentOwnerState(){

    const target =
      ownerPageTarget();

    if(
      !target
    ){
      return;
    }

    try{
      target.postMessage(

          type:"MA7ALAK_OWNER_STATE_GET",

  /* =========================================================
     CHECK OWNER
  ========================================================= */

  async function checkShopOwner(){

    /*
       Parent owner state is authoritative for Hostinger embeds.
       Never allow an iframe's own cached/stale Supabase session to grant
       owner controls before the top-level page confirms ownership.
    */
    const insideShopEmbed =
      !!(
        window.parent &&
        window.parent !== window
      );

    if(ma7alakParentOwnerStateReceived){

      setStoryViewerLoginState(
        ma7alakParentIsLoggedIn
      );

      const currentSlug =
        String(SHOP_SLUG || "")
          .trim()
          .toLowerCase();

      setShopOwnerState(
        ma7alakParentIsOwner &&
        ma7alakParentOwnerSlug === currentSlug
      );

      return;

    }

    requestParentOwnerState();

    if(insideShopEmbed){
      setStoryViewerLoginState(false);
      setShopOwnerState(false);
      return;
    }

    try{
      await getMa7alakSupabaseClient();
    }
    catch(error){
      console.error("MA7ALAK shared Supabase:", error);
      return;
    }


    try{

      const result =
        await supabaseClient.auth.getSession();


      const session =
        result &&
        result.data &&
        result.data.session;


      if(!session){

        setStoryViewerLoginState(false);

        isShopOwner =
          false;

        ownerAddButton.classList.remove(
          "visible"
        );

        return;

      }


      const user =
        session.user;


      if(!user){

        setStoryViewerLoginState(false);

        isShopOwner =
          false;

        ownerAddButton.classList.remove(
          "visible"
        );

        return;

      }


      setStoryViewerLoginState(true);

      const ownerResult =
        await supabaseClient
          .from("shop_owners")
          .select(
            "shop_slug"
          )
          .eq(
            "user_id",
            user.id
          )
          .eq(
            "shop_slug",
            SHOP_SLUG
          )
          .maybeSingle();


      if(
        ownerResult.error ||
        !ownerResult.data
      ){

        isShopOwner =
          false;

        ownerAddButton.classList.remove(
          "visible"
        );

        return;

      }


      isShopOwner =
        true;


      ownerAddButton.classList.add(
        "visible"
      );

    }

    catch(error){

      console.error(
        "MA7ALAK owner check:",
        error
      );

      isShopOwner =
        false;

      ownerAddButton.classList.remove(
        "visible"
      );

    }

  }

  /* =========================================================
     UPLOAD FINISHED MESSAGE
  ========================================================= */

  window.addEventListener(
    "message",
    function(event){

      const trustedParent =
        ownerPageTarget();

      if(
        trustedParent &&
        event.source !== trustedParent
      ){
        return;
      }

      if(
        !trustedParent &&
        event.source !== window
      ){
        return;
      }

      if(applyParentOwnerState(event.data)){
        return;
      }

      if(
        event.data &&
        event.data.type === "MA7ALAK_OWNER_PROFILE_UPDATED"
      ){
        if(
          String(event.data.shopSlug || "")
            .trim()
            .toLowerCase() === SHOP_SLUG
        ){
          window.ShoufHonProfileRowCache?.invalidate(SHOP_SLUG);
          loadShopProfileFromAdmin();
        }
        return;
      }

      const storySignal =
        event.data &&
        typeof event.data === "object"
          ? event.data
          : null;

      if(!storySignal){
        return;
      }

      const storySignalSlug =
        String(
          storySignal.shopSlug ||
          storySignal.shop_slug ||
          ""
        )
          .trim()
          .toLowerCase();

      if(
        storySignalSlug &&
        storySignalSlug !== SHOP_SLUG
      ){
        return;
      }

      if(
        storySignal.type ===
        "MA7ALAK_STORY_SEEN"
      ){
        const seenAt =
          String(
            storySignal.createdAt ||
            storySignal.created_at ||
            ""

        if(seenAt){

      if(
        storySignal.type ===
        "MA7ALAK_STORY_UPLOADED"

        loadStories();
        return;
      }

      if(
        storySignal.type ===
        "MA7ALAK_STORY_DELETED"
      ){
        loadStories();
        return;
      }

      return;

    }
  );

  /* =========================================================
     LOAD STORIES
  ========================================================= */

  /* One timeout for the soonest active Story expiry. Realtime handles
     uploads/deletes; the existing visible-page refresh handles wake-up. */
  let storyExpiryTimer = null;

  function scheduleStoryExpiryRefresh(){
    clearTimeout(storyExpiryTimer);
    storyExpiryTimer = null;

    const now = Date.now();
    const nextExpiry = stories.reduce(function(soonest,story){
      const expires = Date.parse(story.expires_at || "");
      return Number.isFinite(expires) && expires > now
        ? Math.min(soonest,expires)
        : soonest;
    },Infinity);

    if(!Number.isFinite(nextExpiry))return;

    storyExpiryTimer = setTimeout(function(){
      storyExpiryTimer = null;
      if((document.visibilityState === "visible" && window.ShoufHonEmbedVisibility?.visible !== false))loadStories();
      /* Hidden pages refresh in the existing visibilitychange handler. */
    },Math.min(Math.max(nextExpiry - now + 50,50),2147483647));
  }

  async function loadStories(){

    try{
      await getMa7alakSupabaseClient();
    }
    catch(error){
      console.error("MA7ALAK shared Supabase:", error);
      return;
    }

    /*
       Only the newest Story read is allowed to paint state. Without this, an
       older request started just before an upload can finish last and erase
       the newly-arrived Story ring/animation until the next refresh.
    */
    const loadRevision=++ma7alakStoryLoadRevision;


    /*
       Always keep the permanent shop image in the circle.
       Stories only control the ring + fullscreen Story viewer.
    */
    renderStoryCircleImage();

    try{

      const now =
        new Date().toISOString();


      const result =
        await supabaseClient
          .from("shop_stories")
          .select(
            "id,shop_slug,media_type,storage_path,status_text,expires_at,created_at"
          )
          .eq(
            "shop_slug",
            SHOP_SLUG
          )
          .gt(
            "expires_at",
            now
          )
          .order(
            "created_at",
            {
              ascending:true
            }
          );


      if(
        result.error
      ){

        console.error(
          "MA7ALAK Stories:",
          result.error
        );

        return;

      }


      if(loadRevision!==ma7alakStoryLoadRevision){
        return;
      }

      stories =
        result.data || [];

      storiesLoaded =
        true;

      /* The shared viewer owns Story media; this embed only schedules
         its next expiry so the ring and NEW animation clear on time. */
      scheduleStoryExpiryRefresh();


      if(storyWrapper){

        storyWrapper.classList.toggle(
          "story-has-story",
          stories.length > 0
        );

      }


      /*
         Keep the same permanent logo whether there are
         zero Stories, image Stories, or video Stories.
      */
      renderStoryCircleImage();


      /*
         Recompute the NEW animation immediately and publish the authoritative
         Story state to the external profile bridge.
      */
      updateNewStoryAnimation();
      emitMa7alakProfileStoryState(
        "stories-loaded"
      );

    }

    catch(error){

      console.error(
        "MA7ALAK Stories:",
        error
      );

    }

  }

      typeof window.Ma7alakProfileShell.getCachedOptions === "function"
        ? window.Ma7alakProfileShell.getCachedOptions()
        : null;

        Object.assign(
          {},

          {directory_options:cachedTheme}
        );

      applyStoryColorFromAdmin(cachedProfile);
      applyPageDesignFromAdmin(cachedProfile);

      window.Ma7alakProfileShell.apply(
        cachedTheme,
        {
          cache:false,
          reveal:true,
          emit:false,
          source:"saved-cache"
        }
      );
    }

    renderShopIdentity();
    renderStoryCircleImage();


    if(!await loadShopProfileFromAdmin()){
      /* A short failed network read on first paint should not leave the
         public identity empty for the rest of the visit. */
      [1200,4000].forEach(function(delay){
        setTimeout(function(){
          if(!SHOP_PROFILE)loadShopProfileFromAdmin();
        },delay);
      });
    }

    window.dispatchEvent(new Event("shoufhon:section-data-ready"));

    /* Bring up Story/realtime independently of the public identity read.
       A delayed auth bootstrap can no longer hold the image and label blank. */
    if(!supabaseClient){
      getMa7alakSupabaseClient().then(function(){
        subscribeToStoryProfileAdminUpdates();
        subscribeToStoryDataUpdates();
      }).catch(function(error){
        console.warn("MA7ALAK story client:",error);
      });
    }

    if(
      window.Ma7alakProfileShell &&
      typeof window.Ma7alakProfileShell.connectRealtime === "function"
    ){
      window.Ma7alakProfileShell.connectRealtime(
        supabaseClient

    }

    subscribeToStoryProfileAdminUpdates();
    subscribeToStoryDataUpdates();


    window.addEventListener(
      "ma7alak:account-change",
      function(){
        checkShopOwner();
      }
    );

    window.addEventListener(
      "ma7alak:owner-change",
      function(){
        checkShopOwner();
      }
    );

    /* Current global owner bridge event used by Header / Live systems. */
    window.addEventListener(
      "ma7alak:owner-auth-change",
      function(event){

        const detail =
          event && event.detail
            ? event.detail
            : {};

        const currentOwner =
          detail.owner || null;

        if(currentOwner){

          const ownerSlug =
            String(currentOwner.shop_slug || "")
              .trim()
              .toLowerCase();

          setShopOwnerState(
            ownerSlug ===
            String(SHOP_SLUG || "")
              .trim()
              .toLowerCase()
          );

        }
        else{
          setShopOwnerState(false);
        }

      }
    );

    requestParentOwnerState();
    checkShopOwner();

    await loadStories();
  }


  initializeMa7alakStoryPage();

  /* Refresh owner state only on browser/page wake events. No owner polling. */
  window.addEventListener(
    "pageshow",
    function(){

    }
  );

  );

  document.addEventListener(
    "visibilitychange",
    function(){
      if((document.visibilityState === "visible" && window.ShoufHonEmbedVisibility?.visible !== false)){
        if(!SHOP_PROFILE)loadShopProfileFromAdmin();
        requestParentOwnerState();
        checkShopOwner();
      }

  );

     This is only a low-frequency safety refresh in case a Realtime
     event is missed. Hidden tabs do not query the database.

  setInterval(
    function(){

      if(
        (document.visibilityState === "visible" && window.ShoufHonEmbedVisibility?.visible !== false)
      ){
        loadStories();
      }

    },
    180000
  );


})();

<script>

/* =========================================================
   SHOP
