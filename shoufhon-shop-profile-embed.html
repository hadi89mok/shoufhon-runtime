========================================================= */

function ma7alakResolveShopSlug(){

  const explicit =
    document
      .getElementById("ma7alak-profile-shell")
      ?.getAttribute("data-shop-slug") ||
    "";

  if(String(explicit).trim()){
    return String(explicit).trim().toLowerCase();
  }

  const candidates = [];

  try{
    if(window.parent && window.parent !== window){
      candidates.push(window.parent.location.pathname || "");
    }
  }catch(_){}

  try{
    if(document.referrer){
      candidates.push(new URL(document.referrer).pathname || "");
    }
  }catch(_){}

  candidates.push(window.location.pathname || "");

  for(const pathname of candidates){
    const parts =
      String(pathname)
        .split("/")
        .filter(Boolean);

    const last =
      parts.length
        ? decodeURIComponent(parts[parts.length - 1])
        : "";

    if(last && last !== "embed" && last !== "editor"){
      return last.trim().toLowerCase();
    }
  }

  return "";
}

let SHOP_SLUG =
  String(document.getElementById("ma7alak-profile-shell")?.getAttribute("data-shop-slug") || "")
    .trim()
    .toLowerCase();

if(!SHOP_SLUG){
  try{
    const ctx=window.ShoufHonShopContextClient;
    SHOP_SLUG=String(ctx?.slug||"").trim().toLowerCase();
    if(!SHOP_SLUG&&ctx){
      SHOP_SLUG=await ctx.resolve({fallback:ma7alakResolveShopSlug,timeout:350});
    }
  }catch(_){}
}

if(!SHOP_SLUG){
  SHOP_SLUG=ma7alakResolveShopSlug();
}

if(!SHOP_SLUG){
  console.warn("[ShoufHon Follow] No shop context available.");
  return;
}

/* =========================================================
   FOLLOW RPC CLIENT — PARENT BRIDGE FIRST
   ---------------------------------------------------------
   Hostinger Custom Embed iframes do NOT need their own Follow
   Supabase client. Follow RPCs are executed by the ONE shared
   top-level ShoufHon Supabase client through postMessage.

   This keeps Follow independent from iframe SDK startup races
   and preserves the duplicate-client/battery optimization.
========================================================= */

function createParentFollowRpcClient(){

  if(
    !window.parent ||
    window.parent === window
  ){
    return null;
  }

  let sequence = 0;
  const pending = new Map();

  function finish(
    requestId,
    payload
  ){
    const job =
      pending.get(
        requestId
      );

    if(!job){
      return;
    }

    pending.delete(
      requestId
    );

    clearTimeout(
      job.timer
    );

    job.resolve(
      {
        data:
          payload &&
          Object.prototype.hasOwnProperty.call(
            payload,
            "data"
          )
            ? payload.data
            : null,

        error:
          payload?.error ||
          null
      }
    );
  }


  window.addEventListener(
    "message",
    function(event){

      if(
        event.source !== window.parent &&
        event.source !== window.top
      ){
        return;
      }

      const data =
        event.data ||
        {};

      if(
        data.type !==
        "SHOUFHON_FOLLOW_RPC_RESULT"
      ){
        return;
      }

      const requestId =
        String(
          data.requestId ||
          ""
        );

      if(!requestId){
        return;
      }

      finish(
        requestId,
        data
      );

    }
  );


  return {

    rpc:
      function(
        rpcName,
        args
      ){

        return new Promise(
          function(resolve){

            const requestId =
              "follow-" +
              Date.now().toString(36) +
              "-" +
              (++sequence).toString(36) +
              "-" +
              Math.random()
                .toString(36)
                .slice(2,8);


            const timer =
              setTimeout(
                function(){

                  pending.delete(
                    requestId
                  );

                  resolve(
                    {
                      data:null,
                      error:{
                        message:
                          "FOLLOW_BRIDGE_TIMEOUT"
                      }
                    }
                  );

                },
                12000
              );


            pending.set(
              requestId,
              {
                resolve:resolve,
                timer:timer
              }
            );


            try{

              window.parent
                .postMessage(
                  {
                    type:
                      "SHOUFHON_FOLLOW_RPC_REQUEST",

                    requestId:
                      requestId,

                    rpc:
                      String(
                        rpcName ||
                        ""
                      ),

                    args:
                      (
                        args &&
                        typeof args ===
                          "object" &&
                        !Array.isArray(args)
                      )
                        ? args
                        : {}
                  },
                  "*"
                );

            }
            catch(error){

              pending.delete(
                requestId
              );

              clearTimeout(
                timer
              );

              resolve(
                {
                  data:null,
                  error:{
                    message:
                      String(
                        error?.message ||
                        "FOLLOW_BRIDGE_SEND_FAILED"
                      )
                  }
                }
              );

            }

          }
        );

      }

  };

}

/* =========================================================
   SHOP PROFILE ACCENT

========================================================= */

function m7HexToRgb(hex){

  const clean =
    String(hex || "")
      .trim()
      .replace("#","");

  if(!/^[0-9a-f]{6}$/i.test(clean)){
    return null;
  }

  return {
    r:parseInt(clean.slice(0,2),16),
    g:parseInt(clean.slice(2,4),16),
    b:parseInt(clean.slice(4,6),16)
  };

}


function m7Mix(rgb,target,amount){

  const clamp =
    function(number){
      return Math.max(
        0,
        Math.min(
          255,
          Math.round(number)
        )
      );
    };

  return "#" +
    [
      clamp(rgb.r + (target.r-rgb.r)*amount),
      clamp(rgb.g + (target.g-rgb.g)*amount),
      clamp(rgb.b + (target.b-rgb.b)*amount)
    ]
      .map(function(value){
        return value
          .toString(16)
          .padStart(2,"0");
      })
      .join("");

}


function m7ApplyAccent(hex){

  const rgb =
    m7HexToRgb(hex);

  if(!rgb){
    return;
  }

  root.style.setProperty(
    "--m7-accent",
    "#" + String(hex).replace("#","")
  );

  root.style.setProperty(
    "--m7-accent-rgb",
    rgb.r + "," + rgb.g + "," + rgb.b
  );

  root.style.setProperty(
    "--m7-accent-light",
    m7Mix(
      rgb,
      {r:255,g:255,b:255},
      .46
    )
  );

  root.style.setProperty(
    "--m7-accent-dark",
    m7Mix(
      rgb,
      {r:0,g:0,b:0},
      .35
    )
  );

}



/* =========================================================
   FOLLOW / MESSAGE TYPOGRAPHY
   Reads global + Follow typography from Page Design Studio.
========================================================= */

function m7FollowFontStack(mode){

  return (
    {
      system:
        '"Segoe UI",Arial,Helvetica,sans-serif',

      modern:
        '"Trebuchet MS","Segoe UI",Arial,sans-serif',

      elegant:
        'Georgia,"Times New Roman",serif',

      classic:
        '"Times New Roman",Georgia,serif',

      mono:
        '"Courier New",Courier,monospace'
    }[
      String(mode || "")
        .trim()
        .toLowerCase()
    ]
    ||
    ""
  );

}


function m7FollowPercent(value){

  const number =
    Number(value);

  if(!Number.isFinite(number)){
    return 100;
  }

  return Math.max(
    70,
    Math.min(
      150,
      number
    )
  );

}


function m7ApplyFollowTypography(
  options
){

  const globalStyle =
    String(
      options.global_font_style ||
      "current"
    )
      .trim()
      .toLowerCase();


  const moduleStyle =
    String(
      options.follow_font_style ||
      "inherit"
    )
      .trim()
      .toLowerCase();


  const finalStyle =
    moduleStyle === "inherit"
      ? globalStyle
      : moduleStyle;


  const family =
    m7FollowFontStack(
      finalStyle
    );


  const scale =
    (
      m7FollowPercent(
        options.global_font_size
      )
      *
      m7FollowPercent(
        options.follow_font_size
      )
    ) / 10000;


  [
    root,
    ...root.querySelectorAll("*")
  ]
    .forEach(
      function(el){

        if(
          !el ||
          !el.tagName
        ){
          return;
        }


        const tag =
          el.tagName
            .toUpperCase();


        if(
          [
            "STYLE",
            "SCRIPT",
            "SVG",
            "PATH",
            "IMG",
            "VIDEO"
          ].includes(tag)
        ){
          return;
        }


        const directText =
          Array.from(
            el.childNodes || []
          )
            .some(
              function(node){
                return (
                  node.nodeType === 3 &&
                  String(
                    node.textContent || ""
                  ).trim()
                );
              }
            );


        const formText =
          [
            "BUTTON",
            "INPUT",
            "TEXTAREA",
            "SELECT",
            "OPTION"
          ].includes(tag);


        if(
          !directText &&
          !formText
        ){
          return;
        }


        if(family){
          el.style.setProperty(
            "font-family",
            family,
            "important"
          );
        }
        else{
          el.style.removeProperty(
            "font-family"
          );
        }


        let base =
          Number(
            el.dataset.m7BaseFontSize
          );


        if(
          !Number.isFinite(base) ||
          base <= 0
        ){

          const current =
            parseFloat(
              getComputedStyle(el)
                .fontSize
            );


          if(
            !Number.isFinite(current) ||
            current <= 0
          ){
            return;
          }


          base =
            current;


          el.dataset.m7BaseFontSize =
            String(base);

        }


        el.style.setProperty(
          "font-size",
          (
            base *
            scale
          )
            .toFixed(2) +
          "px",
          "important"
        );

      }
    );

}

/* =========================================================
   AUTHENTICATED FOLLOW CLIENT
========================================================= */

async function getFollowClient(){

  const h =
    host();


  try{

    const account =
      h.Ma7alakAccount;


    if(!account){

      return client;

    }


    if(
      typeof
        account.ready ===
      "function"
    ){

      await account.ready();

    }


    /*
       Logged-in Ma7alak viewers
       MUST use the authenticated
       viewer account client.

       This allows owner notifications
       to identify the actual viewer.
    */

    if(
      account.user &&
      account.client &&
      typeof
        account.client.rpc ===
      "function"
    ){

      return account.client;

    }

  }


  catch(error){

    console.warn(
      "[Ma7alak Follow] viewer auth:",
      error
    );

  }


  return client;

}

/* =========================================================
   FOLLOW TIMEOUT UI
========================================================= */

function followRetrySeconds(){

  return Math.max(
    0,
    Math.ceil(
      (
        Number(followBlockedUntil || 0) -
        Date.now()
      ) /
      1000
    )
  );

}


function startFollowTimeout(
  seconds
){

  const duration =
    Math.max(
      1,
      Math.min(
        300,
        Number(seconds) || 60
      )
    );


  followBlockedUntil =
    Date.now() +
    duration * 1000;


  if(followBlockTimer){
    clearInterval(
      followBlockTimer
    );
  }


  followBlockTimer =
    setInterval(
      function(){

        if(
          followRetrySeconds() <= 0
        ){

          clearInterval(
            followBlockTimer
          );

          followBlockTimer =
            null;

          followBlockedUntil =
            0;

        }


        render();

      },
      1000
    );


  render();

}

    buttonIcon.textContent =
      "✓";


    buttonText.textContent =
      "Following";


    button.setAttribute(
      "aria-pressed",
      "true"
    );

  }


  else{

    button
      .classList
      .remove(
        "is-following"
      );


    buttonIcon.textContent =
      "+";


    buttonText.textContent =
      "Follow";


    button.setAttribute(
      "aria-pressed",
      "false"
    );

  }


  /* BUSY / ANTI-SPAM TIMEOUT */

  const retrySeconds =
    followRetrySeconds();


  if(
    retrySeconds > 0 &&
    !isOwnShop
  ){

    buttonIcon.textContent =
      "⏳";


    buttonText.textContent =
      "Wait " +
      retrySeconds +
      "s";


    button.setAttribute(
      "aria-label",
      "Follow temporarily paused. Try again in " +
      retrySeconds +
      " seconds."
    );

  }
  else{

    button.removeAttribute(
      "aria-label"
    );

  }


  button
    .classList
    .toggle(
      "is-busy",
      busy
    );


  button.disabled =
    busy ||
    retrySeconds > 0;

}


/* =========================================================
   OWNER CHECK
========================================================= */

async function checkOwnShop(){

  try{

    const h =
      host();

    /* A cached/verified positive owner state is safe to use immediately and
       prevents the self-Follow button from flashing during refresh. */
    const immediateSlug=
      h.Ma7alakOwnerAuth
        ?.owner
        ?.shop_slug;

    if(
      immediateSlug &&
      String(immediateSlug)===SHOP_SLUG
    ){
      isOwnShop=true;
      root.classList.add("is-own-shop");
      root.classList.remove("owner-check-pending");
      return true;
    }


    if(
      h.Ma7alakOwnerAuth
        ?.ready
    ){

      await h
        .Ma7alakOwnerAuth
        .ready();

    }


    const ownedSlug =
      h.Ma7alakOwnerAuth
        ?.owner
        ?.shop_slug;


    isOwnShop =
      !!ownedSlug &&
      String(
        ownedSlug
      ) ===
      SHOP_SLUG;

    root.classList.toggle("is-own-shop",isOwnShop);
    root.classList.remove("owner-check-pending");

    return isOwnShop;

  }


  catch(_){

    isOwnShop =
      false;

    root.classList.remove("owner-check-pending");

    return false;

  }

}


/* =========================================================
   LOAD FOLLOW STATE
========================================================= */

async function loadState(){

  const followClient =
    await getFollowClient();


  const result =
    await followClient
      .rpc(
        "get_shop_follow_state",
        {

          p_shop_slug:
            SHOP_SLUG,

          p_visitor_id:
            VISITOR_ID

        }
      );


  if(
    result.error
  ){

    console.warn(
      "[Ma7alak Follow] state:",
      result.error
    );


    busy =
      false;


    render();


    showError(
      "Couldn't load Follow."
    );


    return;

  }


  const row =
    firstRow(
      result.data
    );


  if(row){

    following =
      !!row.following;


    followerCount =
      Math.max(
        0,

        Number(
          row.follower_count
        )

        ||

        0
      );

  }


  busy =
    false;


  render();

}


/* =========================================================
   LOAD EXACT FOLLOWER COUNT
========================================================= */

async function loadCount(){

  const followClient =
    await getFollowClient();


  const result =
    await followClient
      .rpc(
        "get_shop_follower_count",
        {

          p_shop_slug:
            SHOP_SLUG

        }
      );


  if(
    result.error
  ){

    return;

  }


  const next =
    Math.max(
      0,

      Number(
        result.data
      )

      ||

      0
    );


  if(
    next !==
    followerCount
  ){

    followerCount =
      next;


    render();

  }

}


/* =========================================================
   LOAD REAL FOLLOWING COUNT

   Uses the SAME installed Follow RPC as the website header.
   This is the total number of shops this visitor identity follows,
   not just a fake 0 / 1 for the shop currently being viewed.
========================================================= */

function normalizeFollowedSlugs(
  data
){

  const rows =
    Array.isArray(data)
      ? data
      : [];


  return Array
    .from(
      new Set(
        rows
          .map(
            function(row){

              if(
                typeof row ===
                "string"
              ){

                return row.trim();

              }


              return String(
                (
                  row &&
                  (
                    row.shop_slug ||
                    row.p_shop_slug ||
                    row.slug
                  )
                )
                ||
                ""
              )
                .trim();

            }
          )
          .filter(Boolean)
      )
    );

}


async function loadFollowingCount(){

  try{

    const followClient =
      await getFollowClient();


    /*
      IMPORTANT:
      "Following" belongs to THIS PROFILE OWNER.

      Example:
      On /shahznan this returns how many shops the Shahznan
      owner account follows. It is NOT the current visitor's
      personal Following count.
    */
    const result =
      await followClient
        .rpc(
          "get_shop_owner_following_count",
          {

            p_shop_slug:
              SHOP_SLUG

          }
        );


    if(result.error){

      console.warn(
        "[Ma7alak Follow] owner following count:",
        result.error
      );

      return;

    }


    const next =
      Math.max(
        0,
        Number(
          result.data
        ) || 0
      );


    if(
      next !==
      followingCount
    ){

      followingCount =
        next;


      render();

    }

  }


  catch(error){

    console.warn(
      "[Ma7alak Follow] owner following count:",
      error
    );

  }

}


/* =========================================================
   FUTURE PROFILE LIKES COUNT BRIDGE

   There is no profile-Likes database system yet, so the UI
   correctly stays at 0 for now.

   When the Likes system is added, it can send:
     ma7alak:shop-like-count
     ma7alak:shop-likes-changed

   detail:
     shopSlug / shop_slug
     likeCount / like_count / count

   This avoids having to redesign this profile panel again.
========================================================= */

function applyLikeCount(
  value
){

  const next =
    Math.max(
      0,
      Number(value) || 0
    );


  if(
    next ===
    likeCount
  ){

    return;

  }


  likeCount =
    next;


  render();

}


function externalLikeCount(
  event
){

  const detail =
    event?.detail ||
    {};


  const eventSlug =
    String(
      detail.shopSlug
      ||
      detail.shop_slug
      ||
      ""
    )
      .trim()
      .toLowerCase();


  if(
    !eventSlug ||
    eventSlug !==
      SHOP_SLUG
  ){

    return;

  }


  const value =
    detail.likeCount
    ??
    detail.like_count
    ??
    detail.count;


  if(
    value === undefined ||
    value === null ||
    Number.isNaN(
      Number(value)
    )
  ){

    return;

  }


  applyLikeCount(
    value
  );

}


try{

  const h =
    host();


  h.addEventListener(
    "ma7alak:shop-like-count",
    externalLikeCount
  );


  h.addEventListener(
    "ma7alak:shop-likes-changed",
    externalLikeCount
  );

}catch(_){}



/* =========================================================
   BROADCAST FOLLOW CHANGE
========================================================= */

function broadcastChange(){

  const detail = {

    shopSlug:
      SHOP_SLUG,

    shop_slug:
      SHOP_SLUG,

    following:
      following,

    followerCount:
      followerCount,

    follower_count:
      followerCount

  };


  try{

    const h =
      host();


    h.dispatchEvent(
      new CustomEvent(
        "ma7alak:follow-changed",
        {
          detail:
            detail
        }
      )
    );


    h.dispatchEvent(
      new CustomEvent(
        "ma7alak:follow-change",
        {
          detail:
            detail
        }
      )
    );

  }catch(_){}

}


/* =========================================================
   FOLLOW / UNFOLLOW
========================================================= */

async function toggleFollow(){

  if(
    busy ||
    isOwnShop ||
    followRetrySeconds() > 0
  ){

    return;

  }


  busy =
    true;


  const oldFollowing =
    following;


  const oldCount =
    followerCount;


  /* =====================================================
     INSTANT UI UPDATE
  ===================================================== */

  following =
    !following;


  if(
    following
  ){

    followerCount =
      oldCount + 1;

  }


  else{

    followerCount =
      Math.max(
        0,
        oldCount - 1
      );

  }


  render();


  broadcastChange();


  /* =====================================================
     DATABASE
  ===================================================== */

  try{

    const followClient =
      await getFollowClient();


    const rpcName =
      following

        ?

        "follow_shop"

        :

        "unfollow_shop";


    const result =
      await followClient
        .rpc(
          rpcName,
          {

            p_shop_slug:
              SHOP_SLUG,

            p_visitor_id:
              VISITOR_ID

          }
        );


    if(
      result.error
    ){

      throw result.error;

    }


    const row =
      firstRow(
        result.data
      );


    /*
       Use exact values
       returned by Supabase.
    */

    if(row){


      if(
        typeof
          row.following ===
        "boolean"
      ){

        following =
          row.following;

      }


      if(
        row.follower_count !==
          undefined &&
        row.follower_count !==
          null
      ){

        followerCount =
          Math.max(
            0,

            Number(
              row.follower_count
            )

            ||

            0
          );

      }

    }


    busy =
      false;


    render();


    broadcastChange();


    /*
       Confirm exact DB count.
    */

    setTimeout(
      loadCount,
      100
    );


    setTimeout(
      loadFollowingCount,
      120
    );

  }


  catch(error){

    /*
       RESTORE OLD STATE
       IF RPC FAILED
    */

    following =
      oldFollowing;


    followerCount =
      oldCount;


    busy =
      false;


    render();


    broadcastChange();


    console.warn(
      "[Ma7alak Follow]",
      error
    );


    const errorMessage =
      String(
        error?.message ||
        ""
      );


    const timeoutMatch =
      errorMessage.match(
        /Follow changes paused\. Try again in\s+(\d+)\s+seconds/i
      );


    if(timeoutMatch){

      const seconds =
        Math.max(
          1,
          Number(timeoutMatch[1]) || 60
        );


      startFollowTimeout(
        seconds
      );


      showError(
        "Too many Follow changes. Try again in " +
        seconds +
        " seconds."
      );

    }
    else{

      showError(
        "Couldn't update Follow. Try again."
      );

    }

  }

}


/* =========================================================
   MESSAGE
========================================================= */

async function openMessage(){

  if(isOwnShop){
    return;
  }

  try{
    if(window.parent&&window.parent!==window){
      window.parent.postMessage(
        {
          type:"SHOUFHON_OPEN_SHOP_CHAT",
          shop_slug:SHOP_SLUG
        },
        "*"
      );
      return;
    }
  }catch(error){
    console.warn(
      "[Ma7alak Message bridge]",
      error
    );
  }

  try{
    if(!window.Ma7alakAccount){
      showError(
        "Messaging is still loading. Try again."
      );
      return;
    }

    await window.Ma7alakAccount.ready?.();

    if(!window.Ma7alakAccount.user){
      window.Ma7alakAccount.open?.();
      return;
    }

    if(!window.Ma7alakChat){
      showError(
        "Messaging is still loading. Try again."
      );
      return;
    }

    window.Ma7alakChat.openShop(
      SHOP_SLUG
    );
  }
  catch(error){
    console.warn(
      "[Ma7alak Message]",
      error
    );

    showError(
      "Couldn't open messages."
    );
  }
}


/* =========================================================
   BUTTON EVENTS
========================================================= */

button

      event.preventDefault();

      event.stopPropagation();

      toggleFollow();

    }
  );


/* =========================================================
   EXTERNAL FOLLOW CHANGE

   This is what keeps this box synced
   when user unfollows Zee from the
   HEADER FOLLOWING PANEL.
========================================================= */

function externalFollowChange(
  event
){

  const detail =
    event?.detail ||
    {};


  const eventSlug =
    String(

      detail.shopSlug

      ||

      detail.shop_slug

      ||

      ""

    )
    .trim();


  if(
    !eventSlug ||
    eventSlug !==
      SHOP_SLUG
  ){

    return;

  }


  /* =====================================================
     DUPLICATE EVENT PROTECTION
  ===================================================== */

  const now =
    Date.now();


  if(
    now -
    lastExternalSync <
    200
  ){

    return;

  }


  lastExternalSync =
    now;


  const oldFollowing =
    following;


  /* =====================================================
     FOLLOW STATE
  ===================================================== */

  if(
    typeof
      detail.following ===
    "boolean"
  ){

    following =
      detail.following;

  }


  /* =====================================================
     EXACT COUNT IF PROVIDED
  ===================================================== */

  const providedCount =

    detail.followerCount

    ??

    detail.follower_count;


  if(
    providedCount !==
      undefined &&

    providedCount !==
      null &&

    !Number.isNaN(
      Number(
        providedCount
      )
    )
  ){

    followerCount =
      Math.max(
        0,

        Number(
          providedCount
        )
      );

  }


  /* =====================================================
     NO COUNT PROVIDED
     UPDATE LOCALLY
  ===================================================== */

  else if(
    oldFollowing &&
    !following
  ){

    followerCount =
      Math.max(
        0,
        followerCount - 1
      );

  }


  else if(
    !oldFollowing &&
    following
  ){

    followerCount =
      followerCount + 1;

  }


  busy =
    false;


  /*
     IMMEDIATE RESULT:

     ✓ Following becomes + Follow
     ✓ count updates
     ✓ Notifications ON disappears
  */

  render();


  /* confirm DB */

  setTimeout(
    loadCount,
    100
  );


  setTimeout(
    loadFollowingCount,
    120
  );


  setTimeout(
    loadState,
    300
  );

}


/* =========================================================
   LISTEN TO HOST PAGE
========================================================= */

try{

  const h =
    host();


  h.addEventListener(
    "ma7alak:follow-change",
    externalFollowChange
  );


  h.addEventListener(
    "ma7alak:follow-changed",
    externalFollowChange
  );

}catch(_){}


/* =========================================================
   POSTMESSAGE BACKUP

   Useful when Hostinger places the
   embed inside an iframe.
========================================================= */

window.addEventListener(
  "message",
  function(event){

    const data =
      event?.data;

    if(
      data &&
      data.type==="MA7ALAK_OWNER_STATE"
    ){
      const incomingSlug=String(data.shopSlug||data.shop_slug||"").trim();
      if(data.isOwner===true && incomingSlug===SHOP_SLUG){
        isOwnShop=true;
        root.classList.add("is-own-shop");
        root.classList.remove("owner-check-pending");
        render();
      }
      return;
    }


    if(
      !data ||
      data.type !==
        "MA7ALAK_FOLLOW_CHANGED"
    ){

      return;

    }


    const slug =
      String(
        data.shopSlug
        ||
        data.shop_slug
        ||
        ""
      )
      .trim();


    if(
      slug !==
      SHOP_SLUG
    ){

      return;

    }


    externalFollowChange(
      {
        detail:{
          shopSlug:
            slug,

          following:
            data.following,

          followerCount:
            data.followerCount
            ??
            data.follower_count
        }
      }
    );

  }
);


/*
  Future profile Likes iframe / parent bridge.
*/
window.addEventListener(
  "message",
  function(event){

    const data =
      event?.data;


    if(
      !data ||
      data.type !==
        "MA7ALAK_SHOP_LIKES_CHANGED"
    ){

      return;

    }


    externalLikeCount(
      {
        detail:{
          shopSlug:
            data.shopSlug
            ||
            data.shop_slug,

          likeCount:
            data.likeCount
            ??
            data.like_count
            ??
            data.count
        }
      }
    );

  }
);


/* =========================================================
   REALTIME FOLLOWER COUNT
========================================================= */

function startRealtime(){

  /*
     Parent Follow bridge intentionally uses no extra iframe Realtime
     channel. Own actions update immediately from RPC results; the
     existing 180s visible-only fallback keeps counts recovered.
  */
  if(
    !client ||
    typeof client.channel !==
      "function"
  ){
    return;
  }


  realtimeChannel =
    client

      .channel(

        "ma7alak-follow-"

        +

        SHOP_SLUG.replace(
          /[^A-Za-z0-9_-]/g,
          "_"
        )

        +

        "-"

        +

        Math.random()
          .toString(36)
          .slice(2,8)

      )


      .on(

        "postgres_changes",

        {

          event:"*",

          schema:"public",

          table:
            "shop_follows",

          filter:
            "shop_slug=eq."
            +
            SHOP_SLUG

        },


        function(){

          loadCount();

          loadFollowingCount();

        }

      )


      .subscribe();


}


/* =========================================================
   FALLBACK SYNC
========================================================= */

function startFallback(){

  fallbackTimer =
    setInterval(
      function(){

        if(
          (document.visibilityState === "visible" && window.ShoufHonEmbedVisibility?.visible !== false)
        ){

          loadCount();

          loadFollowingCount();

        }

      },
      FALLBACK_SYNC_MS
    );


  document
    .addEventListener(
      "visibilitychange",
      function(){

        if(
          (document.visibilityState === "visible" && window.ShoufHonEmbedVisibility?.visible !== false)
        ){

          checkOwnShop()
            .then(
              loadState
            )
            .then(
              loadFollowingCount
            );

        }

      }
    );

}


/* =========================================================
   CLEANUP
========================================================= */

window
  .addEventListener(
    "pagehide",
    function(){

      if(
        fallbackTimer
      ){

        clearInterval(
          fallbackTimer
        );

      }


      if(
        realtimeChannel
      ){

        try{

          client
            .removeChannel(
              realtimeChannel
            );

        }catch(_){}

      }


      if(
        profileThemeChannel
      ){

        try{

          client
            .removeChannel(
              profileThemeChannel
            );

        }catch(_){}

      }

    }
  );


/* =========================================================
   START
========================================================= */

try{
  const target=host();
  if(target&&target!==window){
    target.postMessage({type:"MA7ALAK_OWNER_STATE_GET",shopSlug:SHOP_SLUG,sentAt:Date.now()},"*");
  }
}catch(_){}

checkOwnShop()

  .then(
    loadState
  )

  .then(
    loadFollowingCount
  )

  .then(
    function(){

      startRealtime();

      startFallback();

    }
  );


})();

/* =========================================================
   OUTER PROFILE FRAME MOTION
   Only the frame/effect layer animates. Profile content stays stable.
========================================================= */
#ma7alak-profile-shell::before{
  content:"";
  position:absolute;
  inset:calc(-2px - var(--m7-profile-shell-border-width));
  border-radius:calc(var(--m7-profile-shell-radius) + 3px);
  border:max(1px,var(--m7-profile-shell-border-width)) solid rgba(var(--m7-profile-shell-border-rgb),.68);
  box-sizing:border-box;
  pointer-events:none;
  z-index:40;
  opacity:0;
  transform:translateZ(0);
  -webkit-transform:translateZ(0);
  will-change:opacity,filter,box-shadow,transform;
}

@keyframes m7ShellFrameGlow{
  0%,100%{opacity:.42;box-shadow:0 0 5px rgba(var(--m7-profile-shell-border-rgb),.22)}
  50%{opacity:1;box-shadow:0 0 calc(12px + 25px * var(--m7-profile-shell-frame-intensity)) rgba(var(--m7-profile-shell-border-rgb),calc(.30 + .52 * var(--m7-profile-shell-frame-intensity)))}

@keyframes m7ShellFrameBreathe{
  0%,100%{opacity:.35;filter:brightness(1);box-shadow:0 0 7px rgba(var(--m7-profile-shell-border-rgb),.20)}
  50%{opacity:.95;filter:brightness(calc(1 + .28 * var(--m7-profile-shell-frame-intensity)));box-shadow:0 0 calc(10px + 18px * var(--m7-profile-shell-frame-intensity)) rgba(var(--m7-profile-shell-border-rgb),.56)}
}
@keyframes m7ShellFrameShimmer{
  0%,100%{opacity:.38;filter:brightness(.92) drop-shadow(-5px 0 4px rgba(var(--m7-profile-shell-border-rgb),.10))}
  35%{opacity:.96;filter:brightness(1.35) drop-shadow(0 0 calc(6px + 10px * var(--m7-profile-shell-frame-intensity)) rgba(var(--m7-profile-shell-border-rgb),.64))}
  70%{opacity:.58;filter:brightness(1.08) drop-shadow(5px 0 5px rgba(var(--m7-profile-shell-border-rgb),.28))}
}
@keyframes m7ShellFramePulse{
  0%,100%{opacity:.40;transform:scale(1)}
  50%{opacity:1;transform:scale(calc(1 + .005 * var(--m7-profile-shell-frame-intensity)));box-shadow:0 0 calc(8px + 18px * var(--m7-profile-shell-frame-intensity)) rgba(var(--m7-profile-shell-border-rgb),.52)}
}
@keyframes m7ShellFrameFloat{
  0%,100%{opacity:.62;transform:translateY(0)}
  50%{opacity:1;transform:translateY(calc(-2px * var(--m7-profile-shell-frame-intensity)));box-shadow:0 0 calc(8px + 15px * var(--m7-profile-shell-frame-intensity)) rgba(var(--m7-profile-shell-border-rgb),.48)}
}
@keyframes m7ShellFrameSway{
  0%,100%{opacity:.58;transform:rotate(0deg)}
  50%{opacity:1;transform:rotate(calc(.18deg * var(--m7-profile-shell-frame-intensity)));filter:brightness(1.25)}
}
@keyframes m7ShellFrameBounce{
  0%,100%{opacity:.58;transform:translateY(0)}
  45%{opacity:1;transform:translateY(calc(-3px * var(--m7-profile-shell-frame-intensity)))}
  62%{transform:translateY(calc(-1px * var(--m7-profile-shell-frame-intensity)))}
}
@keyframes m7ShellFrameFlicker{
  0%,18%,22%,25%,53%,57%,100%{opacity:.82;filter:brightness(1.15);box-shadow:0 0 14px rgba(var(--m7-profile-shell-border-rgb),.44)}
  20%,24%,55%{opacity:.30;filter:brightness(.82);box-shadow:0 0 4px rgba(var(--m7-profile-shell-border-rgb),.18)}
}

#ma7alak-profile-shell[data-frame-animation="glow"]::before{
  animation:m7ShellFrameGlow var(--m7-profile-shell-frame-speed) ease-in-out infinite;
}
#ma7alak-profile-shell[data-frame-animation="breathe"]::before{
  animation:m7ShellFrameBreathe var(--m7-profile-shell-frame-speed) ease-in-out infinite;
}

#ma7alak-profile-shell[data-frame-animation="current"]::before{

}
#ma7alak-profile-shell[data-frame-animation="pulse"]::before{

}
#ma7alak-profile-shell[data-frame-animation="float"]::before{
  animation:m7ShellFrameFloat var(--m7-profile-shell-frame-speed) ease-in-out infinite;
}
#ma7alak-profile-shell[data-frame-animation="sway"]::before{

}

<script id="m7-profile-city-tag-runtime">
(function(){
  "use strict";
  if(window.__SHOUFHON_PROFILE_PUBLIC_LOCATION_TAG__)return;
  window.__SHOUFHON_PROFILE_PUBLIC_LOCATION_TAG__=true;

  const tag=document.getElementById("m7-profile-city-tag");
  const label=document.getElementById("m7-profile-city-name");
  const shell=document.getElementById("ma7alak-profile-shell");
  if(!tag||!label||!shell)return;

  let client=null;
  let slug="";
  let profileChannel=null;

  async function getClient(){
    if(client)return client;

    try{
      client =
        await window.ShoufHonEmbedDataClient?.get?.();
    }catch(_){
      client=null;
    }

    return client;
  }

  async function resolveSlug(){
    let next=String(
      shell.getAttribute("data-shop-slug")||
      window.ShoufHonShopContextClient?.slug||
      ""
    ).trim().toLowerCase();

    if(!next){
      try{
        next=String(
          await window.ShoufHonShopContextClient?.resolve?.({
            explicit:"",
            fallback:function(){
              return window.ShoufHonShopContextClient?.detectPageSlug?.()||"";
            },
            timeout:500
          })||""
        ).trim().toLowerCase();
      }catch(_){}
    }

    slug=next;
    return slug;
  }

  function applyPublicLocation(value){
    const publicLocation=String(value||"").trim();
    label.textContent=publicLocation;
    tag.hidden=!publicLocation;
  }

  async function load(){
    const c=await getClient();
    const s=await resolveSlug();

    if(!c||!s){
      applyPublicLocation("");
      return;
    }

    try{
      const profileResult=await window.ShoufHonProfileRowCache.get(s,c);

      if(profileResult.error)throw profileResult.error;
      applyPublicLocation(profileResult.data?.location||"");
    }catch(error){
      console.warn("[ShoufHon Public Location Tag]",error);
      applyPublicLocation("");
    }
  }

  async function subscribe(){
    const c=await getClient();
    const s=await resolveSlug();
    if(!c||!s)return;

    try{
      if(profileChannel)await c.removeChannel(profileChannel);
    }catch(_){}

    profileChannel=c
      .channel("m7-profile-public-location-"+s)
      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"shop_profiles",
          filter:"shop_slug=eq."+s
        },
        function(){
          window.ShoufHonProfileRowCache?.invalidate(s);
          load();
        }
      )
      .subscribe();
  }

  /* Same Admin draft source used by the rest of the shop profile. */
  window.addEventListener("ma7alak:profile-draft-preview",function(event){
    const detail=event?.detail||{};
    const eventSlug=String(detail.shop_slug||"").trim().toLowerCase();
    if(eventSlug&&slug&&eventSlug!==slug)return;
    if(!Object.prototype.hasOwnProperty.call(detail,"location"))return;
    applyPublicLocation(detail.location);
  });

  async function boot(){
    await load();
    await subscribe();
  }

  boot();

  window.addEventListener("pageshow",load);
  document.addEventListener("visibilitychange",function(){
    if((document.visibilityState === "visible" && window.ShoufHonEmbedVisibility?.visible !== false))load();
  });

  window.addEventListener("pagehide",function(){
    try{
      if(client&&profileChannel)client.removeChannel(profileChannel);
    }catch(_){}
  });
})();
</script>

(function(){

  if(window.__M7_PROFILE_STUDIO_COMPAT_20260927__)return;
  window.__M7_PROFILE_STUDIO_COMPAT_20260927__=true;

  const shell=document.getElementById("ma7alak-profile-shell");
  if(!shell)return;

  function clamp(value,min,max,fallback){
    const n=Number(value);
    return Number.isFinite(n)?Math.max(min,Math.min(max,n)):fallback;
  }
  function fontStack(value){
    switch(String(value||"inherit").trim().toLowerCase()){
      case "system": return "system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";
      case "modern": return "Arial,Helvetica,system-ui,sans-serif";
      case "elegant": return "Georgia,'Times New Roman',serif";
      case "classic": return "'Times New Roman',Times,serif";
      case "mono": return "ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace";
      default: return "inherit";
    }
  }
  function setImportant(el,key,value){
    if(!el)return;
    el.style.setProperty(key,value,"important");
  }
  function applyTextControl(el,styleKey,sizeKey,desktopBase,mobileBase,options){
    if(!el)return;
    const family=fontStack(options[styleKey]);
    const scale=clamp(options[sizeKey],70,150,100)/100;
    setImportant(el,"font-family",family);
    setImportant(el,"font-size",(
      (window.matchMedia&&window.matchMedia("(max-width:600px)").matches)
        ? mobileBase
        : desktopBase
    )*scale+"px");
  }
  function applyExtraAnimation(el,mode){
    if(!el||el.id==="ma7alak-shop-name"&&window.ShoufHonProfileFrameName||el.id==="ma7alak-shop-arabic-name"&&window.ShoufHonIdentityEffects)return;
    const m=String(mode||"").trim().toLowerCase();
    const custom={
      float:"m7StudioTextFloat 3.2s ease-in-out infinite",
      pulse:"m7StudioTextPulse 2.6s ease-in-out infinite",
      sway:"m7StudioTextSway 3.4s ease-in-out infinite",
      bounce:"m7StudioTextBounce 2.7s ease-in-out infinite",
      flicker:"m7StudioTextFlicker 2.25s linear infinite"
    };
    if(custom[m]){
      setImportant(el,"animation",custom[m]);
      setImportant(el,"-webkit-animation",custom[m]);
    }
    else if(["none","static"].includes(m)){
      setImportant(el,"animation","none");
      setImportant(el,"-webkit-animation","none");
    }
    else{
      el.style.removeProperty("animation");
      el.style.removeProperty("-webkit-animation");
    }
  }
  function apply(options){
    if(!options||typeof options!=="object"||Array.isArray(options))return;

    const bannerX=clamp(options.profile_banner_position_x,0,100,50);
    const shiftX=clamp(options.profile_logo_shift_x,-70,70,0);
    const shiftY=clamp(options.profile_logo_shift_y,-60,60,0);
    shell.style.setProperty("--m7-profile-banner-position-x",bannerX+"%");
    shell.style.setProperty("--m7-profile-logo-shift-x",shiftX+"px");
    shell.style.setProperty("--m7-profile-logo-shift-y",shiftY+"px");
    shell.style.setProperty("--m7-profile-social-offset-y",clamp(options.profile_social_offset_y,-100,140,0)+"px");

    shell.style.setProperty("--m7-shop-name-font",fontStack(options.shop_name_font_style));
    shell.style.setProperty("--m7-shop-category-font",fontStack(options.shop_category_font_style));
    shell.style.setProperty("--m7-shop-arabic-font",fontStack(options.arabic_name_font_style));
    shell.style.setProperty("--m7-profile-action-font",fontStack(options.profile_action_font_style));

    shell.style.setProperty("--m7-shop-name-scale",String(clamp(options.shop_name_font_size,70,150,100)/100));
    shell.style.setProperty("--m7-shop-category-scale",String(clamp(options.shop_category_font_size,70,150,100)/100));
    shell.style.setProperty("--m7-shop-arabic-scale",String(clamp(options.arabic_name_font_size,70,150,100)/100));
    shell.style.setProperty("--m7-profile-action-scale",String(clamp(options.profile_action_font_size,70,150,100)/100));

    /*
       The original profile renderer writes inline font sizes with
       !important. CSS variables alone cannot override those declarations,
       so apply the four Studio text controls directly to the real elements.
       This keeps the existing profile/VIP effects and makes saved + live
       preview values visibly work on desktop and phone.
    */
    applyTextControl(
      document.getElementById("ma7alak-shop-name"),
      "shop_name_font_style","shop_name_font_size",32,29,options
    );
    applyTextControl(
      document.getElementById("ma7alak-shop-category-text"),
      "shop_category_font_style","shop_category_font_size",10,10,options
    );
    applyTextControl(
      document.getElementById("ma7alak-shop-arabic-name"),
      "arabic_name_font_style","arabic_name_font_size",21,19,options
    );
    document.querySelectorAll(
      "#ma7alak-follow-embed .ma7alak-follow-btn-text,#ma7alak-follow-embed .ma7alak-message-text"
    ).forEach(el=>applyTextControl(
      el,"profile_action_font_style","profile_action_font_size",14,14,options
    ));

    const banner=document.getElementById("ma7alak-profile-banner");
    if(banner){
      const y=clamp(options.profile_banner_position_y,0,100,50);
      setImportant(banner,"background-position",bannerX+"% "+y+"%");
    }

    const shopName=document.getElementById("ma7alak-shop-name");
    // The shared name renderer owns animation after it mounts.
    if(!window.ShoufHonProfileFrameName)applyExtraAnimation(shopName,options.shop_name_animation);

    applyExtraAnimation(document.getElementById("ma7alak-shop-arabic-name"),options.arabic_name_animation);
  }

  function fromEvent(event){
    const detail=event&&event.detail||{};
    const opts=detail.directory_options;
    if(opts&&typeof opts==="object"&&!Array.isArray(opts))apply(opts);
  }

  window.addEventListener("resize",()=>{
    const cached=window.__M7_PROFILE_STUDIO_LAST_OPTIONS__;
    if(cached)apply(cached,{emit:false});
  },{passive:true});

  window.addEventListener("ma7alak:profile-design-preview",fromEvent);
  window.addEventListener("ma7alak:profile-design-saved",fromEvent);
  window.addEventListener("ma7alak:profile-draft-preview",fromEvent);
  window.addEventListener("shoufhon:design-preview",event=>{
    const d=event&&event.detail||{};
    if(d&&d.type==="MA7ALAK_DESIGN_PREVIEW"&&d.directory_options)apply(d.directory_options);
  });
  window.addEventListener("message",event=>{
    const d=event&&event.data;
    if(d&&d.type==="MA7ALAK_DESIGN_PREVIEW"&&d.directory_options)apply(d.directory_options);
  });

  try{
    const cached=window.Ma7alakProfileShell&&window.Ma7alakProfileShell.getCachedOptions
      ? window.Ma7alakProfileShell.getCachedOptions()
      : null;
    if(cached)apply(cached);
  }catch(_){}
})();
</script>

<script id="shoufhon-profile-image-crop-runtime">
(function(){
  "use strict";
  const shell=document.getElementById("ma7alak-profile-shell");if(!shell)return;
  let options={},queued=false;
  const clamp=(value,min,max,fallback)=>value===undefined||value===null||value===""?fallback:Number.isFinite(Number(value))?Math.max(min,Math.min(max,Number(value))):fallback;
  function crop(prefix,zoom,x,y){
    shell.style.setProperty(prefix+"-size",zoom+"%");
    shell.style.setProperty(prefix+"-left",((100-zoom)*x/100)+"%");
    shell.style.setProperty(prefix+"-top",((100-zoom)*y/100)+"%");
    shell.style.setProperty(prefix+"-x",x+"%");shell.style.setProperty(prefix+"-y",y+"%");
  }
  function apply(o){
    if(!o||typeof o!=="object"||Array.isArray(o))return;options=o;
    crop("--m7-banner-crop",clamp(o.profile_banner_zoom,100,300,100),clamp(o.profile_banner_position_x,0,100,50),clamp(o.profile_banner_position_y,0,100,50));
    crop("--m7-logo-crop",clamp(o.profile_logo_image_zoom,100,300,100),clamp(o.profile_logo_image_position_x,0,100,50),clamp(o.profile_logo_image_position_y,0,100,50));
    const banner=document.getElementById("ma7alak-profile-banner");
    if(banner){
      const raw=String(o.profile_banner_image_url||"").trim();
      const url=/^https?:\/\//i.test(raw)?raw.replace(/\\/g,"%5C").replace(/"/g,"%22").replace(/[\r\n]/g,""):"";
      shell.style.setProperty("--m7-banner-crop-image",url?'url("'+url+'")':"none");
      const enabled=o.profile_banner_enabled!==false&&String(o.profile_banner_enabled||"").toLowerCase()!=="false";
      const styleName=String(o.profile_banner_style||"rounded-fade").toLowerCase();
      banner.classList.toggle("visible",Boolean(url)&&enabled);
      banner.classList.toggle("m7-banner-straight",styleName==="straight");
      banner.classList.toggle("m7-banner-rounded",styleName==="rounded");
      banner.classList.toggle("m7-banner-wave",styleName==="wave");
      banner.classList.toggle("m7-banner-fade",styleName==="fade");
      banner.classList.toggle("m7-banner-rounded-fade",styleName==="rounded-fade");
      if(url){
        banner.dataset.imageCrop="1";
        banner.style.setProperty("background-image","none","important");
      }else{
        banner.removeAttribute("data-image-crop");
        banner.style.removeProperty("background-image");
      }
    }
  }
  function schedule(next){
    if(next&&typeof next==="object"&&!Array.isArray(next))options=next;
    if(queued)return;queued=true;
    Promise.resolve().then(()=>{queued=false;if(typeof document!=="undefined"&&shell.isConnected)apply(options)});
  }
  const receive=e=>{const d=e.detail||{};if(d.directory_options||d.profile?.directory_options)schedule(d.directory_options||d.profile.directory_options)};
  window.ShoufHonProfileBannerApply=apply;
  for(const name of ["ma7alak:profile-design-preview","ma7alak:profile-design-saved","ma7alak:profile-draft-preview","shoufhon:design-preview"])window.addEventListener(name,receive);
  window.addEventListener("message",e=>{
    if(e.source!==window.parent&&e.source!==window.top)return;
    const d=e.data||{};if(["MA7ALAK_DESIGN_PREVIEW","MA7ALAK_PROFILE_STATE","MA7ALAK_PROFILE_UPDATED"].includes(d.type))schedule(d.directory_options||d.profile?.directory_options);
  });
  window.addEventListener("resize",()=>schedule(),{passive:true});
  window.addEventListener("pageshow",()=>schedule());
  window.ShoufHonProfileImageCrop={apply};
  schedule(window.Ma7alakProfileShell?.getCachedOptions?.()||window.__M7_PROFILE_STUDIO_LAST_OPTIONS__||{});
})();
</script>
