<!-- SHOUFHON — OFFSCREEN MEDIA SLEEP -->
<style id="shoufhon-media-embed-sleep-v1">
html.m7-embed-suspended:not(#shoufhon-pause-guard):not(#shoufhon-pause-guard):not(#shoufhon-pause-guard) *,
html.m7-embed-suspended:not(#shoufhon-pause-guard):not(#shoufhon-pause-guard):not(#shoufhon-pause-guard) *::before,
html.m7-embed-suspended:not(#shoufhon-pause-guard):not(#shoufhon-pause-guard):not(#shoufhon-pause-guard) *::after{
  animation-play-state:paused!important;
  -webkit-animation-play-state:paused!important;
}
</style>
<script>
(function(){
  "use strict";
  if(window.__SHOUFHON_EMBED_VISIBILITY_V1__)return;
  window.__SHOUFHON_EMBED_VISIBILITY_V1__=true;
  let parentVisible=true;
  const state={visible:true};
  window.ShoufHonEmbedVisibility=state;

  function sync(){
    const visible=!document.hidden&&parentVisible!==false;
    if(state.visible===visible&&document.documentElement.classList.contains("m7-embed-suspended")===!visible)return;
    state.visible=visible;
    document.documentElement.classList.toggle("m7-embed-suspended",!visible);
    try{window.dispatchEvent(new CustomEvent("shoufhon:embed-visibility",{detail:{visible:visible}}));}catch(_){}
  }

  window.addEventListener("message",function(event){
    if(event.source!==window.parent&&event.source!==window.top)return;
    const data=event.data||{};
    if(data.type!=="SHOUFHON_EMBED_VISIBILITY")return;
    parentVisible=data.visible!==false;
    sync();
  });
  document.addEventListener("visibilitychange",sync,{passive:true});
  sync();
})();
</script>

  45%,60%{opacity:1;transform:scale(1.014)}
}
@-webkit-keyframes m7VideoFrameWave{
  0%,100%{opacity:.62;-webkit-transform:scale(.996)}
  45%,60%{opacity:1;-webkit-transform:scale(1.014)}
}
@keyframes m7VideoFrameGlow{
  0%,100%{opacity:.40;transform:scale(.992)}
  50%{opacity:1;transform:scale(1.016)}
}
@-webkit-keyframes m7VideoFrameGlow{
  0%,100%{opacity:.40;-webkit-transform:scale(.992)}
  50%{opacity:1;-webkit-transform:scale(1.016)}
}
@keyframes m7VideoFrameShimmer{
  0%,100%{opacity:.42;transform:translateX(-.6%) scale(.998)}
  34%{opacity:1;transform:translateX(.35%) scale(1.01)}
  68%{opacity:.60;transform:translateX(.7%) scale(1.002)}
}
@-webkit-keyframes m7VideoFrameShimmer{
  0%,100%{opacity:.42;-webkit-transform:translateX(-.6%) scale(.998)}
  34%{opacity:1;-webkit-transform:translateX(.35%) scale(1.01)}
  68%{opacity:.60;-webkit-transform:translateX(.7%) scale(1.002)}
}
@keyframes m7VideoFrameBreathe{
  0%,100%{opacity:.50;transform:scale(.992)}
  50%{opacity:.96;transform:scale(1.014)}
}
@-webkit-keyframes m7VideoFrameBreathe{
  0%,100%{opacity:.50;-webkit-transform:scale(.992)}
  50%{opacity:.96;-webkit-transform:scale(1.014)}
}
@keyframes m7VideoFrameFlicker{
  0%,18%,22%,25%,53%,57%,100%{opacity:.90}
  20%,24%,55%{opacity:.34}
}
@-webkit-keyframes m7VideoFrameFlicker{
  0%,18%,22%,25%,53%,57%,100%{opacity:.90}
  20%,24%,55%{opacity:.34}
}

/* Animation aura for every photo frame style, without moving the image itself. */
#m7-media-showcase .m7-media-card.video::after,
#m7-media-showcase .m7-media-hero-card.video::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
  border-radius:inherit;
  opacity:0;
  box-shadow:0 0 0 transparent;
  will-change:opacity,transform;
}

/* Same fix for Current premium / 2 / 3 / 4-color / soft-blend video frames. */
#m7-media-showcase:not(.m7-video-frame-layers):not(.m7-video-frame-none) :is(.m7-media-card,.m7-media-hero-card).video::after{
  padding:var(--m7-video-frame-width,3px);
  background:var(--m7-video-frame-bg,var(--m7-video-frame-primary,#d9a441));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
}

#m7-media-showcase.m7-video-frame-none :is(.m7-media-card,.m7-media-hero-card).video::after{
  display:none;
}

#m7-media-showcase.m7-video-frame-anim-pulse :is(.m7-media-card,.m7-media-hero-card).video::after{
  animation:m7VideoFramePulse var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  -webkit-animation:m7VideoFramePulse var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  box-shadow:0 0 14px color-mix(in srgb,var(--m7-video-frame-primary,#d9a441) 48%,transparent);
}
#m7-media-showcase.m7-video-frame-anim-wave :is(.m7-media-card,.m7-media-hero-card).video::after{
  animation:m7VideoFrameWave var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  -webkit-animation:m7VideoFrameWave var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  box-shadow:0 0 13px color-mix(in srgb,var(--m7-video-frame-secondary,#f2d18d) 44%,transparent);
}
#m7-media-showcase.m7-video-frame-anim-glow :is(.m7-media-card,.m7-media-hero-card).video::after{
  animation:m7VideoFrameGlow var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  -webkit-animation:m7VideoFrameGlow var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  box-shadow:0 0 18px color-mix(in srgb,var(--m7-video-frame-primary,#d9a441) 58%,transparent);
}
#m7-media-showcase.m7-video-frame-anim-shimmer :is(.m7-media-card,.m7-media-hero-card).video::after{
  animation:m7VideoFrameShimmer var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  -webkit-animation:m7VideoFrameShimmer var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  box-shadow:0 0 16px color-mix(in srgb,var(--m7-video-frame-primary,#d9a441) 52%,transparent);
}
#m7-media-showcase.m7-video-frame-anim-breathe :is(.m7-media-card,.m7-media-hero-card).video::after{
  animation:m7VideoFrameBreathe var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  -webkit-animation:m7VideoFrameBreathe var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  box-shadow:0 0 14px color-mix(in srgb,var(--m7-video-frame-primary,#d9a441) 46%,transparent);
}
#m7-media-showcase.m7-video-frame-anim-flicker :is(.m7-media-card,.m7-media-hero-card).video::after{
  animation:m7VideoFrameFlicker var(--m7-video-frame-speed,3.2s) linear infinite!important;
  -webkit-animation:m7VideoFrameFlicker var(--m7-video-frame-speed,3.2s) linear infinite!important;
  box-shadow:0 0 16px color-mix(in srgb,var(--m7-video-frame-primary,#d9a441) 48%,transparent);
}

/* Layer mode animates the actual color layers too. */
#m7-media-showcase.m7-video-frame-layers.m7-video-frame-anim-pulse :is(.m7-media-card,.m7-media-hero-card).video .m7-media-frame-layer{
  animation:m7VideoFramePulse var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  -webkit-animation:m7VideoFramePulse var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  will-change:transform,opacity;
}
#m7-media-showcase.m7-video-frame-layers.m7-video-frame-anim-wave :is(.m7-media-card,.m7-media-hero-card).video .m7-media-frame-layer{
  animation:m7VideoFrameWave var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  -webkit-animation:m7VideoFrameWave var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  will-change:transform,opacity;
}
#m7-media-showcase.m7-video-frame-layers.m7-video-frame-anim-glow :is(.m7-media-card,.m7-media-hero-card).video .m7-media-frame-layer{
  animation:m7VideoFrameGlow var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  -webkit-animation:m7VideoFrameGlow var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
}
#m7-media-showcase.m7-video-frame-layers.m7-video-frame-anim-shimmer :is(.m7-media-card,.m7-media-hero-card).video .m7-media-frame-layer{
  animation:m7VideoFrameShimmer var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  -webkit-animation:m7VideoFrameShimmer var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
}
#m7-media-showcase.m7-video-frame-layers.m7-video-frame-anim-breathe :is(.m7-media-card,.m7-media-hero-card).video .m7-media-frame-layer{
  animation:m7VideoFrameBreathe var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
  -webkit-animation:m7VideoFrameBreathe var(--m7-video-frame-speed,3.2s) ease-in-out infinite!important;
}
#m7-media-showcase.m7-video-frame-layers.m7-video-frame-anim-flicker :is(.m7-media-card,.m7-media-hero-card).video .m7-media-frame-layer{
  animation:m7VideoFrameFlicker var(--m7-video-frame-speed,3.2s) linear infinite!important;
  -webkit-animation:m7VideoFrameFlicker var(--m7-video-frame-speed,3.2s) linear infinite!important;
}

/* =========================================================
   GRID PAGES
========================================================= */

.m7-media-viewport{
  width:100%;

  overflow-x:auto;
  overflow-y:hidden;

  scroll-snap-type:
    x mandatory;

  scrollbar-width:
    none;

  -webkit-overflow-scrolling:
    touch;

  overscroll-behavior-x:
    contain;

  touch-action:
    pan-x pan-y;
}

.m7-media-viewport::-webkit-scrollbar{
  display:none;
}

.m7-media-track{
  width:100%;

  display:flex;

  align-items:flex-start;

  gap:14px;
}

.m7-media-page{
  width:100%;

  flex:
    0 0 100%;

  scroll-snap-align:
    start;

  scroll-snap-stop:
    always;

  padding:
    0 1px;

  box-sizing:border-box;
}

.m7-media-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:
    10px;
}

.m7-media-card{
  position:relative;

  width:100%;

  aspect-ratio:
    4 / 5;

  display:block;

  margin:0;
  padding:2px;

  overflow:hidden;

  border:0;

  border-radius:
    20px;

  cursor:pointer;

  -webkit-tap-highlight-color:
    transparent;

  background:
    linear-gradient(
      145deg,
      var(--m7-photo-light),
      var(--m7-photo-soft) 27%,
      var(--m7-photo) 52%,
      var(--m7-photo-dark) 76%,
      var(--m7-photo-light)
    );

  box-shadow:
    0 11px 26px rgba(0,0,0,.32),
    0 0 12px rgba(var(--m7-photo-rgb),.08);

  transition:
    transform .15s ease;
}

.m7-media-card.video{
  background:
    linear-gradient(
      145deg,
      var(--m7-video-light),
      var(--m7-video-soft) 27%,
      var(--m7-video) 52%,
      var(--m7-video-dark) 76%,
      var(--m7-video-light)
    );

  box-shadow:
    0 11px 26px rgba(0,0,0,.32),
    0 0 13px rgba(var(--m7-video-rgb),.10);
}

.m7-media-card:active{
  transform:
    scale(.975);
}

.m7-media-card-inner{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  border-radius:
    18px;

  background:
    #070607;
}

.m7-media-card-media{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  background:
    #070607;

  pointer-events:none;
}

.m7-media-card-shade{
  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,0) 58%,
      rgba(0,0,0,.50) 100%
    );
}

.m7-media-type-badge{
  position:absolute;

  left:9px;
  bottom:9px;

  min-height:
    24px;

  display:flex;

  align-items:center;

  gap:5px;

  padding:
    0 8px;

  border:
    1px solid
    rgba(255,255,255,.17);

  border-radius:
    999px;

  background:
    rgba(8,8,9,.66);

  color:
    rgba(255,255,255,.82);

  font-size:
    7px;

  font-weight:
    900;

  line-height:
    1;

  letter-spacing:
    .8px;

  backdrop-filter:
    blur(8px);

  -webkit-backdrop-filter:
    blur(8px);

  pointer-events:none;
}

.m7-media-type-badge.video{
  color:
    var(--m7-video-light);

  border-color:
    rgba(var(--m7-video-rgb),.35);
}

.m7-media-play{
  width:22px;
  height:22px;

  display:grid;
  place-items:center;

  border-radius:50%;

  background:
    rgba(var(--m7-video-rgb),.17);

  border:
    1px solid
    rgba(var(--m7-video-rgb),.32);

  color:
    var(--m7-video-light);

  font-size:
    8px;

  line-height:1;
}


/* =========================================================
   PAGE DOTS
========================================================= */

.m7-media-dots{
  min-height:
    8px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:6px;

  margin-top:
    11px;
}

.m7-media-dot{
  width:6px;
  height:6px;

  border-radius:
    999px;

  background:
    rgba(var(--m7-photo-rgb),.23);

  transition:
    width .16s ease,
    background .16s ease;
}

.m7-media-dot.active{
  width:19px;

  background:
    linear-gradient(
      90deg,
      var(--m7-photo-light),
      var(--m7-photo)
    );

  box-shadow:
    0 0 8px
    rgba(var(--m7-photo-rgb),.18);
}


/* =========================================================
   UNIFIED FULLSCREEN VIEWER
========================================================= */

#m7-media-viewer{
  --m7-vv-height:100%;
  --m7-keyboard-offset:0px;

  position:fixed !important;

  inset:0 !important;

  /*
     PHONE BROWSER + PWA:
     The parent viewport manager sizes the Hostinger iframe to the REAL
     VisualViewport. Fill that iframe exactly instead of asking vh/dvh to
     recalculate against browser chrome a second time.
  */
  width:100% !important;
  height:100% !important;
  min-width:0 !important;
  min-height:0 !important;
  max-width:100% !important;
  max-height:100% !important;

  display:none;

  margin:0 !important;
  padding:0 !important;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(var(--m7-view-rgb,217,164,65),.13),
      rgba(8,7,8,.97) 42%,
      #000 100%
    );

  z-index:
    2147483647 !important;

  box-sizing:border-box;

  touch-action:none;
}

#m7-media-viewer.active{
  display:block !important;
}

#m7-media-viewer:fullscreen,
#m7-media-viewer:-webkit-full-screen{
  width:100% !important;
  height:100% !important;
  background:#000;
}

.m7v-stage{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  padding:
    max(64px, env(safe-area-inset-top))
    0
    max(42px, env(safe-area-inset-bottom));

  box-sizing:border-box;
}

.m7v-image,
.m7v-video{
  display:none;

  width:100%;
  height:100%;

  max-width:100%;
  max-height:100%;

  margin:0;
  padding:0;

  object-fit:contain;

  border:0;

  background:transparent;

  user-select:none;

  -webkit-user-select:none;

  -webkit-user-drag:none;
}

.m7v-image.active,
.m7v-video.active{
  display:block;
}

.m7v-video{
  background:#000;
  opacity:0;
  transition:opacity .16s ease;

  /*
     Horizontal swipes navigate media.
     Simple taps still reach the native video controls.
  */
  touch-action:pan-y;
  -ms-touch-action:pan-y;
}

.m7v-video.m7-ready{
  opacity:1;
}

.m7v-loader{
  position:absolute;
  left:50%;
  top:50%;
  z-index:18;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-width:112px;
  padding:12px 15px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:16px;
  background:rgba(8,8,9,.68);
  color:rgba(255,255,255,.74);
  font:800 10px/1.2 Arial,"Segoe UI",sans-serif;
  letter-spacing:.18px;
  pointer-events:none;
  opacity:0;
  visibility:hidden;
  transform:translate(-50%,-50%) scale(.96);
  -webkit-transform:translate(-50%,-50%) scale(.96);
  transition:opacity .14s ease,transform .14s ease,visibility 0s linear .14s;
  -webkit-transition:opacity .14s ease,-webkit-transform .14s ease,visibility 0s linear .14s;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.m7v-loader.active{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,-50%) scale(1);
  -webkit-transform:translate(-50%,-50%) scale(1);
  transition-delay:0s;
}

.m7v-loader-ring{
  width:28px;
  height:28px;
  border:3px solid rgba(255,255,255,.16);
  border-top-color:var(--m7-view-light,#fff4d6);
  border-radius:50%;
  animation:m7MediaLoaderSpin .72s linear infinite;
  -webkit-animation:m7MediaLoaderSpin .72s linear infinite;
}

@keyframes m7MediaLoaderSpin{
  to{transform:rotate(360deg)}
}
@-webkit-keyframes m7MediaLoaderSpin{
  to{-webkit-transform:rotate(360deg)}
}

.m7v-top{
  position:absolute;

  top:
    max(16px, env(safe-area-inset-top));

  left:50%;

  transform:
    translateX(-50%);

  z-index:40;

  display:flex;

  align-items:center;

  gap:7px;
}

.m7v-type,
.m7v-counter{
  min-height:
    31px;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:
    0 11px;

  border:
    1px solid
    rgba(var(--m7-view-rgb,217,164,65),.24);

  border-radius:
    999px;

  background:
    rgba(16,12,14,.68);

  color:
    var(--m7-view-light,#fff4d6);

  font-family:
    Arial,
    "Segoe UI",
    sans-serif;

  font-size:
    9px;

  font-weight:
    850;

  line-height:
    1;

  letter-spacing:
    .85px;

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);
}

.m7v-counter{
  color:
    rgba(255,255,255,.72);
}

.m7v-close{
  position:absolute;

  top:
    max(13px, env(safe-area-inset-top));

  right:
    max(13px, env(safe-area-inset-right));

  z-index:60;

  width:46px;
  height:46px;

  display:grid;

  place-items:center;

  margin:0;
  padding:0;

  border:
    1px solid
    rgba(var(--m7-view-rgb,217,164,65),.40);

  border-radius:
    50%;

  background:
    rgba(20,14,17,.86);

  color:
    var(--m7-view-light,#fff4d6);

  font-family:
    Arial,
    sans-serif;

  font-size:
    31px;

  font-weight:
    300;

  line-height:
    1;

  cursor:pointer;

  backdrop-filter:
    blur(10px);

  -webkit-backdrop-filter:
    blur(10px);

  box-shadow:
    0 8px 24px rgba(0,0,0,.42);

  -webkit-tap-highlight-color:
    transparent;
}

.m7v-close:active{
  transform:
    scale(.91);
}

.m7v-arrow{
  display:none!important;
  position:absolute;

  top:50%;

  z-index:55;

  width:43px;
  height:58px;

  display:grid;

  place-items:center;

  padding:0;

  transform:
    translateY(-50%);

  border:
    1px solid
    rgba(var(--m7-view-rgb,217,164,65),.22);

  border-radius:
    16px;

  background:
    rgba(15,11,13,.52);

  color:
    var(--m7-view-light,#fff4d6);

  font-family:
    Arial,
    sans-serif;

  font-size:
    39px;

  font-weight:
    300;

  line-height:
    1;

  cursor:pointer;

  backdrop-filter:
    blur(10px);

  -webkit-backdrop-filter:
    blur(10px);

  -webkit-tap-highlight-color:
    transparent;
}

.m7v-arrow:active{
  transform:
    translateY(-50%)
    scale(.91);
}

.m7v-prev{
  left:7px;
}

.m7v-next{
  right:7px;
}

.m7v-hint{
  position:absolute;

  left:50%;

  bottom:
    max(13px, env(safe-area-inset-bottom));

  transform:
    translateX(-50%);

  z-index:40;

  color:
    rgba(255,255,255,.38);

  font-family:
    Arial,
    "Segoe UI",
    sans-serif;

  font-size:
    8px;

  font-weight:
    800;

  line-height:
    1;

  letter-spacing:
    1.5px;

  pointer-events:none;
}

    font-size:

  }

/* =========================================================
   ADMIN ROUNDING — FINAL GEOMETRY
   Keep the selected Gallery radius authoritative on Samsung / iOS.
   Do the clipping on the real card/inner media only — no colored overlay.
========================================================= */
#m7-media-showcase:not(.m7-gallery-frame-layers) .m7-media-card.photo,

  function esc(value){

    return String(
      value == null
        ? ""
        : value
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function validUrl(value){

    return /^https?:\/\//i.test(
      String(value || "").trim()
    );

  }


  function normalizeNumber(
    value,
    fallback
  ){

    const number =
      Number(value);

    return Number.isFinite(number)
      ? number
      : fallback;

  }


  function hexToRgb(hex){

    const clean =
      String(hex || "")
        .trim()
        .replace(
          "#",
          ""
        );


    if(
      !/^[0-9a-f]{6}$/i.test(clean)
    ){
      return null;
    }


    return {
      r:
        parseInt(
          clean.slice(0,2),
          16
        ),

      g:
        parseInt(
          clean.slice(2,4),
          16
        ),

      b:
        parseInt(
          clean.slice(4,6),
          16
        )
    };

  }


  function mix(
    rgb,
    target,
    amount
  ){

    const clamp =
      function(value){

        return Math.max(
          0,
          Math.min(
            255,
            Math.round(value)
          )
        );

      };


    return (
      "#" +
      [
        clamp(
          rgb.r +
          (
            target.r -
            rgb.r
          ) *
          amount
        ),

        clamp(
          rgb.g +
          (
            target.g -
            rgb.g
          ) *
          amount
        ),

        clamp(
          rgb.b +
          (
            target.b -
            rgb.b
          ) *
          amount
        )
      ]
        .map(
          function(value){

            return value
              .toString(16)
              .padStart(
                2,
                "0"
              );

          }
        )
        .join("")
    );

  }


  function boolOption(
    value,
    fallback
  ){

    if(
      value === undefined ||
      value === null
    ){
      return fallback;
    }


    return (
      value === true ||
      String(value)
        .toLowerCase() ===
        "true"
    );

  }


  function safeHex(value,fallback){

    const raw=
      String(value || "")
        .trim();

    return /^#[0-9a-f]{6}$/i.test(raw)
      ? raw
      : fallback;

  }


  function clampNumber(value,min,max,fallback){

    const number=
      Number(value);

    return Number.isFinite(number)
      ? Math.max(min,Math.min(max,number))
      : fallback;

  }


  function fontStack(mode){

    return (
      {
        system:
          '"Segoe UI",Arial,Helvetica,sans-serif',

        modern:
          '"Trebuchet MS","Segoe UI",Arial,sans-serif',

        elegant:
          'Georgia,"Times New Roman",serif',

        classic:
          '"Times New Roman",Georgia,serif',

        mono:
          '"Courier New",Courier,monospace'
      }[
        String(mode || "")
          .trim()
          .toLowerCase()
      ] ||
      ""
    );

  }


  function fontPercent(value){

    const number =
      Number(value);

    if(
      !Number.isFinite(number)
    ){
      return 100;
    }


    return Math.max(
      70,
      Math.min(
        150,
        number
      )
    );

  }


  function applyTypography(){

    const options =
      profileOptions || {};


    const globalStyle =
      String(
        options.global_font_style ||
        "current"
      )
        .trim()
        .toLowerCase();


    /*
      Until a dedicated Media typography control is added,
      the merged module uses Gallery typography first.
      A future media_font_style/media_font_size is already supported.
    */
    const localStyle =
      String(
        options.media_font_style ||
        options.gallery_font_style ||
        "inherit"
      )
        .trim()
        .toLowerCase();


    const finalStyle =
      localStyle === "inherit"
        ? globalStyle
        : localStyle;


    const family =
      fontStack(
        finalStyle
      );


    const scale =
      (
        fontPercent(
          options.global_font_size
        )
        *
        fontPercent(
          options.media_font_size ||
          options.gallery_font_size
        )
      ) / 10000;


    [
      root,
      viewer
    ]
      .filter(Boolean)
      .forEach(
        function(scope){

          [
            scope,
            ...scope.querySelectorAll("*")
          ]
            .forEach(
              function(el){

                if(
                  !el ||
                  !el.tagName
                ){
                  return;
                }


                const tag =
                  el.tagName
                    .toUpperCase();


                if(
                  [
                    "STYLE",
                    "SCRIPT",
                    "SVG",
                    "PATH",
                    "IMG",
                    "VIDEO",
                    "SOURCE"
                  ].includes(tag)
                ){
                  return;
                }


                const directText =
                  Array.from(
                    el.childNodes ||
                    []
                  )
                    .some(
                      function(node){

                        return (
                          node.nodeType ===
                            3 &&
                          String(
                            node.textContent ||
                            ""
                          ).trim()
                        );

                      }
                    );


                const formText =
                  [
                    "BUTTON",
                    "INPUT",
                    "TEXTAREA",
                    "SELECT",
                    "OPTION",
                    "A"
                  ].includes(tag);


                if(
                  !directText &&
                  !formText
                ){
                  return;
                }


                if(family){

                  el.style.setProperty(
                    "font-family",
                    family,
                    "important"
                  );

                }
                else{

                  el.style.removeProperty(
                    "font-family"
                  );

                }


                let base =
                  Number(
                    el.dataset
                      .m7BaseFontSize
                  );


                if(
                  !Number.isFinite(base) ||
                  base <= 0
                ){

                  const current =
                    parseFloat(
                      getComputedStyle(el)
                        .fontSize
                    );


                  if(
                    !Number.isFinite(
                      current
                    ) ||
                    current <= 0
                  ){
                    return;
                  }


                  base =
                    current;


                  el.dataset
                    .m7BaseFontSize =
                      String(base);

                }


                el.style.setProperty(
                  "font-size",
                  (
                    base *
                    scale
                  )
                    .toFixed(2) +
                  "px",
                  "important"
                );

              }
            );

        }
      );

  }

  function setAccentVars(
    prefix,
    color
  ){

    const rgb =
      hexToRgb(
        color
      );


    if(!rgb){
      return;
    }


    root.style.setProperty(
      "--m7-" +
      prefix,
      color
    );

    root.style.setProperty(
      "--m7-" +
      prefix +
      "-rgb",
      rgb.r +
      "," +
      rgb.g +
      "," +
      rgb.b
    );

    root.style.setProperty(
      "--m7-" +
      prefix +
      "-light",
      mix(
        rgb,
        {
          r:255,
          g:255,
          b:255
        },
        .48
      )
    );

    root.style.setProperty(
      "--m7-" +
      prefix +
      "-soft",
      mix(
        rgb,
        {
          r:255,
          g:255,
          b:255
        },
        .20
      )
    );

    root.style.setProperty(
      "--m7-" +
      prefix +
      "-dark",
      mix(
        rgb,
        {
          r:0,
          g:0,
          b:0
        },
        .38
      )
    );

  }

  function sortedImages(rows){

    return (
      Array.isArray(rows)
        ? rows.slice()
        : []
    )
      .filter(
        function(item){

          return validUrl(
            item.image_url
          );

        }
      )
      .sort(
        function(a,b){

          if(
            a.is_featured === true &&
            b.is_featured !== true
          ){
            return -1;
          }


          if(
            b.is_featured === true &&
            a.is_featured !== true
          ){
            return 1;
          }


          const aSort =
            normalizeNumber(
              a.sort_order,
              0
            );


          const bSort =
            normalizeNumber(
              b.sort_order,
              0
            );


          if(
            aSort !== bSort
          ){
            return (
              aSort -
              bSort
            );
          }


          return String(
            a.created_at ||
            ""
          )
            .localeCompare(
              String(
                b.created_at ||
                ""
              )
            );

        }
      )
      .map(
        function(item){

          return {
            type:"photo",
            id:
              "photo-" +
              String(item.id),

            sourceId:
              item.id,

            url:
              String(
                item.image_url
              ).trim(),

            sort:
              normalizeNumber(
                item.sort_order,
                0
              ),

            featured:
              item.is_featured ===
              true,

            createdAt:
              String(
                item.created_at ||
                ""
              )
          };

        }
      );

  }

     ---------------------------------------------------------
     Hostinger embeds can be isolated from the top-page auth session.

     Writes NEVER trust iframe-local identity: they run through the
     authenticated top-page account bridge, and SQL derives auth.uid().
  ========================================================= */

  function socialKey(item){
    if(
      !item ||
      item.kind === "album" ||
      !item.sourceId ||
      !["photo","video"].includes(String(item.type||""))
    ){

    }

    return mediaKey(
      item.type,
      item.sourceId
    );

  function socialErrorMessage(

    const raw =
      String(
        error?.message ||
        error ||
        ""
      );

    if(
      raw.includes(
        "LOGIN_REQUIRED"
      )
    ){
      return "Log in to interact.";
    }

    if(
      raw.includes(
        "PLEASE_SLOW_DOWN"
      ) ||
      raw.includes(
        "RATE_LIMITED"
      )
    ){
      return "You're going a little fast. Try again in a moment.";
    }

    if(
      raw.includes(
        "COMMENT_LENGTH_INVALID"
      )
    ){
      return "Comments must be 1–500 characters.";
    }

    if(
      raw.includes(
        "DUPLICATE_COMMENT"
      )
    ){
      return "You already posted that comment.";
    }

    if(
      raw.includes(
        "ACCOUNT_NOT_ACTIVE"
      )
    ){
      return "This account can't interact right now.";
    }

    if(
      raw.includes(
        "MEDIA_NOT_FOUND"
      ) ||
      raw.includes(
        "COMMENT_NOT_FOUND"
      )
    ){
      return "This item is no longer available.";
    }

    return "Could not update. Please try again.";
  }


  function bridgeRequestId(){

    mediaRpcSequence +=
      1;

    return (
      "m7media_" +
      Date.now()
        .toString(36) +
      "_" +
      mediaRpcSequence
        .toString(36) +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,8)
    );

  }


  window.addEventListener(
    "message",
    function(event){

      /*
         In an isolated Hostinger embed, only trust replies from the
         actual parent page. This prevents sibling/third-party frames
         from spoofing account/RPC responses.
      */
      if(
        window.parent !== window &&
        event.source !== window.parent
      ){
        return;
      }

      const data =
        event.data ||
        {};

      if(
        data.type ===
          "SHOUFHON_MEDIA_RPC_RESPONSE"
      ){

        const requestId =
          String(
            data.requestId ||
            ""
          );

        const pending =
          mediaRpcPending.get(
            requestId
          );

        if(!pending){
          return;
        }

        mediaRpcPending.delete(
          requestId
        );

        clearTimeout(
          pending.timer
        );

        if(data.error){
          const error =
            new Error(
              String(
                data.error.message ||
                "REQUEST_FAILED"
              )
            );

          error.code =
            String(
              data.error.code ||
              ""
            );

          pending.reject(
            error
          );
        }
        else{
          pending.resolve(
            data.data
          );
        }

        return;
      }


      if(
        data.type ===
          "SHOUFHON_ACCOUNT_STATE_RESPONSE" &&
        accountStatePending &&
        String(
          data.requestId ||
          ""
        ) ===
          accountStatePending.requestId
      ){

        clearTimeout(
          accountStatePending.timer
        );

        const resolve =
          accountStatePending.resolve;

        accountStatePending =
          null;

        accountBridgeState = {
          loggedIn:
            data.loggedIn === true,
          user:
            data.user &&
            typeof data.user ===
              "object"
              ? data.user
              : null,
          loaded:true,
          loadedAt:Date.now()
        };

        resolve(
          accountBridgeState
        );

      }

    }
  );


  window.addEventListener(
    "message",
    function(event){
      if(
        window.parent !== window &&
        event.source !== window.parent
      ){
        return;
      }

      const data=event.data||{};

      if(
        data.type !==
          "MA7ALAK_ACCOUNT_CHANGED"
      ){
        return;
      }

      accountBridgeState={
        loggedIn:data.signedIn===true,
        user:null,
        loaded:false,
        loadedAt:0
      };

      /* Reload auth-sensitive like/comment state only when visible. */
      if(document.visibilityState==="visible"){
        loadEngagementState().catch(function(){});
        if(commentsOpen){
          syncCommentComposerAccount(true).catch(function(){});
          commentsLoading=false;
          loadComments(false).catch(function(){});

    }
  );


  async function accountState(
    force
  ){

    if(
      !force &&
      accountBridgeState.loaded &&
      Date.now() -
        Number(
          accountBridgeState.loadedAt ||
          0
        ) <
        8000
    ){
      return accountBridgeState;
    }


    /*
       Non-iframe fallback. The same code can run directly on a page.
    */
    if(
      window.parent ===
        window &&
      window.Ma7alakAccount
    ){

      try{
        await window.Ma7alakAccount
          .ready?.();
      }
      catch(_){}

      const account =
        window.Ma7alakAccount;

      const user =
        account?.user ||
        null;

      const profile =
        account?.profile ||
        null;

      const meta =
        user?.user_metadata ||
        {};

      accountBridgeState = {
        loggedIn:!!user,
        user:user
          ? {
              id:user.id,
              display_name:
                profile?.display_name ||
                meta.full_name ||
                meta.name ||
                "ShoufHon user",
              avatar_url:
                profile?.avatar_url ||
                meta.avatar_url ||
                meta.picture ||
                ""
            }
          : null,
        loaded:true,
        loadedAt:Date.now()
      };

      return accountBridgeState;
    }


    if(
      !window.parent ||
      window.parent ===
        window
    ){

      accountBridgeState = {
        loggedIn:false,
        user:null,
        loaded:true,
        loadedAt:Date.now()
      };

      return accountBridgeState;
    }


    if(
      accountStatePending
    ){
      return accountStatePending.promise;
    }


    const requestId =
      bridgeRequestId();


    let resolvePromise;

    const promise =
      new Promise(
        function(resolve){
          resolvePromise =
            resolve;
        }
      );


    const timer =
      setTimeout(
        function(){

          if(
            accountStatePending &&
            accountStatePending
              .requestId ===
              requestId
          ){

            accountStatePending =
              null;

            accountBridgeState = {
              loggedIn:false,
              user:null,
              loaded:true,
              loadedAt:Date.now()
            };

            resolvePromise(
              accountBridgeState
            );

          }

        },
        1800
      );


    accountStatePending = {
      requestId:requestId,
      resolve:resolvePromise,
      timer:timer,
      promise:promise
    };


    try{
      window.parent
        .postMessage(
          {
            type:
              "SHOUFHON_ACCOUNT_STATE_REQUEST",
            requestId:requestId
          },
          "*"
        );
    }
    catch(_){}


    return promise;

  }

  async function mediaRpc(
    fn,
    args,
    options
  ){

    const settings =
      options ||
      {};

    const readOnly =
      settings.readOnly ===
        true;


    /*
       Direct/top-page path.
    */
    if(
      window.parent ===
        window &&
      window.Ma7alakAccount?.client
    ){

      try{
        await window.Ma7alakAccount
          .ready?.();
      }
      catch(_){}

      if(
        !readOnly &&
        !window.Ma7alakAccount
          ?.user
      ){
        throw new Error(
          "LOGIN_REQUIRED"
        );
      }

      const result =
        await window.Ma7alakAccount
          .client
          .rpc(
            fn,
            args ||
            {}
          );

      if(result.error){
        throw result.error;
      }

      return result.data;
    }


    /*
       Authenticated parent bridge.
    */
    if(
      window.parent &&
      window.parent !==
        window
    ){

      const requestId =
        bridgeRequestId();

      try{

        return await new Promise(
          function(resolve,reject){

            const timer =
              setTimeout(
                function(){

                  mediaRpcPending.delete(
                    requestId
                  );

                  reject(
                    new Error(
                      "MEDIA_BRIDGE_TIMEOUT"
                    )
                  );

                },
                4500
              );

            mediaRpcPending.set(
              requestId,
              {
                resolve:resolve,
                reject:reject,
                timer:timer
              }
            );

            window.parent
              .postMessage(
                {
                  type:
                    "SHOUFHON_MEDIA_RPC_REQUEST",
                  requestId:requestId,
                  fn:fn,
                  args:
                    args ||
                    {}
                },
                "*"
              );

          }
        );

      }
      catch(error){

        /*
           Public reads can safely fall back to the embed's anon client.
           Authenticated writes never do.
        */
        if(!readOnly){
          throw error;
        }

      }

    }


    if(readOnly){

      const result =
        await supabaseClient
          .rpc(
            fn,
            args ||
            {}
          );

      if(result.error){
        throw result.error;
      }

      return result.data;
    }


    throw new Error(
      "LOGIN_REQUIRED"
    );

  function sortMediaList(list){

    return (list || [])
      .slice()
      .sort(
        function(a,b){

          if(
            a.featured === true &&
            b.featured !== true
          ){
            return -1;
          }

          if(
            b.featured === true &&
            a.featured !== true
          ){
            return 1;
          }

          if(
            a.sort !==
            b.sort
          ){
            return a.sort - b.sort;
          }

          return String(a.createdAt || "")
            .localeCompare(
              String(b.createdAt || "")
            );

        }
      );

  }


  function buildAlbumMedia(
    photos,
    videos
  ){

    const configuredLimit =
      Number(
        profileOptions &&
        profileOptions.owner_media_album_item_limit !== undefined
          ? profileOptions.owner_media_album_item_limit
          : 8
      );

    if(
      Number.isFinite(configuredLimit) &&
      configuredLimit <= 0
    ){
      return {
        albums:[],
        membership:new Set()
      };
    }

    const mediaMap =
      new Map();

    (photos || []).forEach(
      function(item){
        mediaMap.set(
          mediaKey("photo",item.sourceId),
          item
        );
      }
    );

    (videos || []).forEach(
      function(item){
        mediaMap.set(
          mediaKey("video",item.sourceId),
          item
        );
      }
    );

    const membership =
      new Set();

    const albums =
      (Array.isArray(albumRows)
        ? albumRows
        : []
      )
        .map(
          function(album){

            const rows =
              (Array.isArray(albumItemRows)
                ? albumItemRows
                : []
              )
                .filter(
                  function(row){
                    return (
                      String(row.album_id) ===
                      String(album.id)
                    );
                  }
                )
                .sort(
                  function(a,b){
                    return (
                      normalizeNumber(a.sort_order,0) -
                      normalizeNumber(b.sort_order,0)
                    );
                  }
                );

            const resolved =
              rows
                .map(
                  function(row){

                    const key =
                      mediaKey(
                        row.media_type,
                        row.media_id
                      );

                    const media =
                      mediaMap.get(key);

                    if(!media){
                      return null;
                    }

                    return {
                      ...media,
                      albumItemId:row.id,
                      albumItemSort:
                        normalizeNumber(
                          row.sort_order,
                          0
                        ),
                      albumCover:
                        row.is_cover === true
                    };

                  }
                )
                .filter(Boolean);

            if(
              resolved.length < 2
            ){
              return null;
            }

            resolved.forEach(
              function(item){
                membership.add(
                  mediaKey(
                    item.type,
                    item.sourceId
                  )
                );
              }
            );

            const cover =
              resolved.find(
                function(item){
                  return item.albumCover;
                }
              ) ||
              resolved[0];

            return {
              kind:"album",
              type:cover.type,
              id:"album-" + String(album.id),
              sourceId:album.id,
              url:cover.url,
              sort:normalizeNumber(
                album.sort_order,
                cover.sort
              ),
              featured:resolved.some(
                function(item){
                  return item.featured === true;
                }
              ),
              createdAt:String(
                album.created_at ||
                ""
              ),
              title:String(
                album.title ||
                "Album"
              ).trim() || "Album",
              description:String(
                album.description ||
                ""
              ).trim(),
              items:resolved
            };

          }
        )
        .filter(Boolean);

    return {
      albums:albums,
      membership:membership
    };

  }


  function interleave(
    photos,
    videos,
    firstType
  ){

    const result = [];

    let photoIndex =
      0;

    let videoIndex =
      0;

    let turn =
      firstType === "video"
        ? "video"
        : "photo";


    while(
      photoIndex <
        photos.length ||
      videoIndex <
        videos.length
    ){

      if(
        turn === "photo"
      ){

        if(
          photoIndex <
          photos.length
        ){

          result.push(
            photos[
              photoIndex++
            ]
          );

        }
        else if(
          videoIndex <
          videos.length
        ){

          result.push(
            videos[
              videoIndex++
            ]
          );

        }


        turn =
          "video";

      }
      else{

        if(
          videoIndex <
          videos.length
        ){

          result.push(
            videos[
              videoIndex++
            ]
          );

        }
        else if(
          photoIndex <
          photos.length
        ){

          result.push(
            photos[
              photoIndex++
            ]
          );

        }


        turn =
          "photo";

      }

    }


    return result;

  }


  function rebuildMedia(){

    allPhotoMedia =
      sortedImages(
        imageRows
      );


    allVideoMedia =
      sortedVideos(
        videoRows
      );


    const albumBundle =
      buildAlbumMedia(
        allPhotoMedia,
        allVideoMedia
      );


    const photos =
      sortMediaList([
        ...allPhotoMedia.filter(
          function(item){
            return !albumBundle.membership.has(
              mediaKey("photo",item.sourceId)
            );
          }
        ),
        ...albumBundle.albums.filter(
          function(item){
            return item.type === "photo";
          }
        )
      ]);


    const videos =
      sortMediaList([
        ...allVideoMedia.filter(
          function(item){
            return !albumBundle.membership.has(
              mediaKey("video",item.sourceId)
            );
          }
        ),
        ...albumBundle.albums.filter(
          function(item){
            return item.type === "video";
          }
        )
      ]);


    /*
      Preserve featured-photo behavior. If that photo lives inside an album,
      the album frame becomes the featured hero instead of duplicating it.
    */
    const featuredPhoto =
      photos.find(
        function(item){
          return item.featured;
        }
      ) ||
      null;


    if(featuredPhoto){

      const remainingPhotos =
        photos.filter(
          function(item){
            return item.id !== featuredPhoto.id;
          }
        );

      allMedia =
        [
          featuredPhoto,
          ...interleave(
            remainingPhotos,
            videos,
            "video"
          )
        ];

    }
    else{

      const firstPhoto =
        photos[0] ||
        null;

      const firstVideo =
        videos[0] ||
        null;

      let heroItem = null;

      if(
        firstPhoto &&
        firstVideo
      ){
        heroItem =
          firstVideo.sort < firstPhoto.sort
            ? firstVideo
            : firstPhoto;
      }
      else{
        heroItem =
          firstPhoto ||
          firstVideo ||
          null;
      }

      if(heroItem){

        const remainingPhotos =
          photos.filter(
            function(item){
              return item.id !== heroItem.id;
            }
          );

        const remainingVideos =
          videos.filter(
            function(item){
              return item.id !== heroItem.id;
            }
          );

        allMedia =
          [
            heroItem,
            ...interleave(
              remainingPhotos,
              remainingVideos,
              heroItem.type === "photo"
                ? "video"
                : "photo"
            )
          ];

      }
      else{
        allMedia = [];
      }

    }


    updateCounts();

    applyFilter(
      activeFilter,
      true
    );

  }

     COUNTS + FILTERS
  ========================================================= */

  function updateCounts(){

    const photoCount =
      allPhotoMedia.length;

    const videoCount =
      allVideoMedia.length;

    const albumCount =
      allMedia.filter(
        function(item){
          return item.kind === "album";
        }
      ).length;

    counts.textContent =
      photoCount +
      (photoCount === 1 ? " photo" : " photos") +
      " · " +
      videoCount +
      (videoCount === 1 ? " video" : " videos") +
      (albumCount
        ? " · " + albumCount + (albumCount === 1 ? " album" : " albums")
        : "");

    filters
      ?.querySelector('[data-filter="photo"]')
      ?.toggleAttribute(
        "disabled",
        photoCount === 0
      );

    filters
      ?.querySelector('[data-filter="video"]')
      ?.toggleAttribute(
        "disabled",
        videoCount === 0
      );

  }


  function applyFilter(
    filter,
    force
  ){

    const next =
      [
        "all",
        "photo",
        "video"
      ].includes(filter)
        ? filter
        : "all";


    if(
      !force &&
      next === activeFilter
    ){
      return;
    }


    activeFilter =
      next;


    if(
      next === "all"
    ){

      visibleMedia =
        allMedia.slice();

    }
    else{

      /*
        Albums collapse only the ALL feed. Photo/Video filters still expose
        every underlying item so visitors can browse the full library.
      */
      visibleMedia =
        sortMediaList(
          next === "photo"
            ? allPhotoMedia
            : allVideoMedia
        );

    }


    filters
      ?.querySelectorAll(
        ".m7-media-filter"
      )
      .forEach(
        function(button){

          const active =
            button.getAttribute(
              "data-filter"
            ) ===
            activeFilter;


          button.classList.toggle(
            "active",
            active
          );


          button.setAttribute(
            "aria-selected",
            active
              ? "true"
              : "false"
          );

        }
      );


    renderVisibleMedia();

  }


  filters
    ?.addEventListener(
      "click",
      function(event){

        const button =
          event.target.closest(
            ".m7-media-filter"
          );


        if(
          !button ||
          button.disabled
        ){
          return;
        }


        applyFilter(
          String(
            button.getAttribute(
              "data-filter"
            ) ||
            "all"
          )
        );

      }
    );

  function renderVisibleMedia(){

    disconnectPreviewObserver();
    disconnectCardMotionObserver();


    if(
      !visibleMedia.length
    ){

      content.hidden =
        true;

      loading.hidden =
        false;

      loading.textContent =
        activeFilter ===
          "photo"
          ? "No photos yet."
          : (
              activeFilter ===
                "video"
                ? "No videos yet."
                : "No media yet."
            );

      hero.innerHTML =
        "";

      track.innerHTML =
        "";

      dots.innerHTML =
        "";

      return;

    }


    loading.hidden =
      true;

    content.hidden =
      false;


    hero.innerHTML =
      heroMarkup(
        visibleMedia[0]
      );


    const rest =
      visibleMedia.slice(
        1
      );


    const pages = [];


    for(
      let index = 0;
      index <
        rest.length;
      index += 6
    ){

      pages.push({
        items:
          rest.slice(
            index,
            index + 6
          ),

        startIndex:
          index + 1
      });

    }


    if(
      !pages.length
    ){

      viewport.style.display =
        "none";

      track.innerHTML =
        "";

      dots.innerHTML =
        "";

      dots.style.display =
        "none";

    }
    else{

      viewport.style.display =
        "";

      track.innerHTML =
        pages
          .map(
            function(
              page,
              pageIndex
            ){

              const cards =
                page.items
                  .map(
                    function(
                      item,
                      localIndex
                    ){

                      return cardMarkup(
                        item,
                        page.startIndex +
                        localIndex
                      );

                    }
                  )
                  .join("");


              return `
                <section
                  class="m7-media-page"
                  data-media-page="${pageIndex}"
                  data-count="${page.items.length}"
                >
                  <div class="m7-media-grid">
                    ${cards}
                  </div>
                </section>
              `;

            }
          )
          .join("");


      dots.innerHTML =
        pages
          .map(
            function(_,index){

              return (
                '<span ' +
                  'class="m7-media-dot' +
                  (
                    index === 0
                      ? " active"
                      : ""
                  ) +
                  '" ' +
                  'data-media-dot="' +
                    index +
                  '"' +
                '></span>'
              );

            }
          )
          .join("");


      dots.style.display =
        pages.length > 1
          ? ""
          : "none";


      viewport.scrollLeft =
        0;

    }


    root
      .querySelectorAll(
        "[data-media-index]"
      )
      .forEach(
        function(button){

          button.addEventListener(
            "click",
            function(event){

              event.preventDefault();

              openMedia(
                Number(
                  button.getAttribute(
                    "data-media-index"
                  ) ||
                  0
                )
              );

            }
          );

        }
      );


    updateDots();

    startPreviewObserver();
    startCardMotionObserver();

    applyTypography();

  }


  /* =========================================================

  ========================================================= */

  function updateDots(){

    const pages =
      Array.from(
        track.querySelectorAll(
          ".m7-media-page"
        )
      );


    if(
      !pages.length
    ){
      return;
    }


    const scrollLeft =
      viewport.scrollLeft;


    let pageIndex =
      0;

    let closest =
      Infinity;


    pages.forEach(
      function(
        page,
        index
      ){

        const distance =
          Math.abs(
            page.offsetLeft -
            scrollLeft
          );


        if(
          distance <
          closest
        ){

          closest =
            distance;

          pageIndex =
            index;

        }

      }
    );


    dots
      .querySelectorAll(
        ".m7-media-dot"
      )
      .forEach(
        function(
          dot,
          index
        ){

          dot.classList.toggle(
            "active",
            index ===
              pageIndex
          );

        }
      );

  }

  /* =========================================================

  ========================================================= */

  function preparePreviewVideo(
    video
  ){

    if(
      !video ||
      video.dataset
        .m7PreviewReady ===
        "1"
    ){
      return;
    }


    video.dataset
      .m7PreviewReady =
        "1";


    video.muted =
      true;

    video.defaultMuted =
      true;

    video.playsInline =
      true;


    video.addEventListener(
      "timeupdate",
      function(){

        if(
          video.currentTime >=
          1
        ){

          try{
            video.currentTime =
              0;
          }
          catch(_){}

        }

      }
    );


    video.addEventListener(
      "ended",
      function(){

        try{
          video.currentTime =
            0;
        }
        catch(_){}

      }
    );

  }


  function pausePreview(
    video
  ){

    if(!video){
      return;
    }


    try{
      video.pause();
    }
    catch(_){}

  }


  // Decode stills one at a time. Never keep multiple gallery videos playing.
  const previewPrimeQueue = [];
  let previewPrimeActive = null;
  let previewPrimeRetryTimer = null;
  let previewCovered = false;
  let mediaPageAway = false;
  let viewerVisibilityPaused = false;

  function previewCanRun(video){
    return video?.isConnected && visiblePreviewVideos.has(video) &&
      !viewerOpen && !previewCovered && !mediaPageAway && !document.hidden &&
      !root.closest(".m7-native-offscreen") && window.ShoufHonEmbedVisibility?.visible !== false;
  }

  function releasePreviewSource(video){
    if(!video)return;
    const index=previewPrimeQueue.indexOf(video);
    if(index>=0)previewPrimeQueue.splice(index,1);
    if(previewPrimeActive?.video===video)previewPrimeActive.cancel();
    else delete video.dataset.m7PrimePending;
    pausePreview(video);
    // Keep the decoded still and attached source when leaving the viewport.
    try{video.preload="metadata"}catch(_){}
  }

  function primePreviewFrame(video){
    if(!previewCanRun(video) || video.dataset.m7FramePrimed==="1" ||
       video.dataset.m7PrimePending==="1" || Date.now()<Number(video.dataset.m7PrimeRetryAt||0) || Number(video.dataset.m7PrimeAttempts||0)>=2)return;
    video.dataset.m7PrimePending="1";
    previewPrimeQueue.push(video);
  }

  function drainPreviewPrimeQueue(){
    if(previewPrimeActive)return;
    let video;
    while(previewPrimeQueue.length){
      const candidate=previewPrimeQueue.shift();
      if(previewCanRun(candidate)){video=candidate;break}
      delete candidate.dataset.m7PrimePending;
    }
    if(!video)return;
    preparePreviewVideo(video);
    video.dataset.m7PrimeAttempts=String(Number(video.dataset.m7PrimeAttempts||0)+1);
    let done=false,timeout=null,paintTimer=null,frameCallback=null;
    const cleanup=()=>{
      clearTimeout(timeout);clearTimeout(paintTimer);
      video.removeEventListener("loadeddata",onPixels);
      video.removeEventListener("canplay",onPixels);
      video.removeEventListener("error",onError);
      if(frameCallback!==null)try{video.cancelVideoFrameCallback?.(frameCallback)}catch(_){}
    };
    const finish=(success,cancelled=false)=>{
      if(done)return;
      done=true;cleanup();pausePreview(video);
      try{video.preload="metadata"}catch(_){}
      delete video.dataset.m7PrimePending;
      if(success)video.dataset.m7FramePrimed="1";
      if(cancelled)video.dataset.m7PrimeAttempts=String(Math.max(0,Number(video.dataset.m7PrimeAttempts||0)-1));
      previewPrimeActive=null;
      // A timeout/error never counts as a decoded frame. Retry once without a scroll.
      if(!success&&!cancelled&&previewCanRun(video)&&Number(video.dataset.m7PrimeAttempts)<2){
        video.dataset.m7PrimeRetryAt=String(Date.now()+1000);
        clearTimeout(previewPrimeRetryTimer);
        previewPrimeRetryTimer=setTimeout(()=>{
          previewPrimeRetryTimer=null;
          if(previewCanRun(video)){primePreviewFrame(video);syncPreviewPlayback()}
        },1000);
      }
      Promise.resolve().then(syncPreviewPlayback);
    };
    const onError=()=>finish(false);
    const onPixels=()=>{
      if(done||video.readyState<2)return;
      if(!previewCanRun(video)){finish(false,true);return}
      // Let the decoded frame paint even when muted autoplay is denied.
      if(paintTimer===null)paintTimer=setTimeout(()=>finish(video.readyState>=2),120);
    };
    previewPrimeActive={video,cancel:()=>finish(false,true)};
    video.addEventListener("loadeddata",onPixels);
    video.addEventListener("canplay",onPixels);
    video.addEventListener("error",onError);
    try{video.preload="auto"}catch(_){}
    ensurePreviewSource(video);
    if(done)return;
    timeout=setTimeout(()=>finish(video.readyState>=2),8000);
    if(typeof video.requestVideoFrameCallback==="function"){
      frameCallback=video.requestVideoFrameCallback(()=>finish(true));
    }
    try{
      const promise=video.play();
      promise?.then(()=>onPixels()).catch(()=>onPixels());
    }catch(_){onPixels()}
    onPixels();
  }

  function ensurePreviewSource(
    video
  ){

    if(
      !video ||
      video.dataset.m7SourceLoaded ===
        "1"
    ){
      return;
    }


    const source =
      String(
        video.getAttribute(
          "data-video-src"
        ) ||
        ""
      ).trim();


    if(!source){
      return;
    }


    video.src =
      source;

    video.dataset.m7SourceLoaded =
      "1";


    try{
      video.load();
    }
    catch(_){}

  }


  function playPreview(
    video
  ){

    if(
      !video ||
      viewerOpen || previewCovered || mediaPageAway ||
      document.hidden || root.closest(".m7-native-offscreen") ||
      window.ShoufHonEmbedVisibility?.visible === false ||
      root.classList.contains(
        "m7-media-static"
      )
    ){
      pausePreview(
        video
      );

      return;
    }


    preparePreviewVideo(
      video
    );

    ensurePreviewSource(
      video
    );


    try{

      if(
        video.currentTime >
        1.05
      ){
        video.currentTime =
          0;
      }

    }
    catch(_){}


    const promise =
      video.play();


    if(
      promise &&
      typeof promise.catch ===
        "function"
    ){

      promise.catch(
        function(){}
      );

    }

  }


  function syncPreviewPlayback(){
    const all=Array.from(root.querySelectorAll("[data-preview-video]"));
    if(viewerOpen || previewCovered || mediaPageAway || document.hidden || root.closest(".m7-native-offscreen") || window.ShoufHonEmbedVisibility?.visible===false){
      clearTimeout(previewPrimeRetryTimer);previewPrimeRetryTimer=null;
      all.forEach(releasePreviewSource);
      return;
    }
    const visible=all
      .filter(video=>visiblePreviewVideos.has(video))
      .map(video=>({video,top:video.getBoundingClientRect().top}))
      .sort((a,b)=>a.top-b.top)
      .map(item=>item.video);
    const staticMode=root.classList.contains("m7-media-static") ||
      navigator.connection?.saveData===true ||
      window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
    // Static mode still prepares ALL nearby thumbnails, with one decoder at a time.
    visible.forEach(video=>{ensurePreviewSource(video);primePreviewFrame(video)});
    all.forEach(video=>{
      if(!visiblePreviewVideos.has(video)){releasePreviewSource(video);return}
      if(previewPrimeActive?.video===video)return;
      if(!staticMode&&!previewPrimeActive&&!previewPrimeQueue.length&&video===visible[0])playPreview(video);
      else pausePreview(video);
    });
    drainPreviewPrimeQueue();
  }

  function disconnectCardMotionObserver(){

    if(cardMotionObserver){
      try{cardMotionObserver.disconnect()}catch(_){}
      cardMotionObserver=null;
    }

    uncertainMotionCards.clear();
    if(cardMotionFrame){cancelAnimationFrame(cardMotionFrame);cardMotionFrame=0;}

    root
      .querySelectorAll(".m7-media-motion-sleep")
      .forEach(function(card){
        card.classList.remove("m7-media-motion-sleep");
      });

  }


  // Native shop pages can briefly receive a stale false intersection while
  // mobile layout settles. Correct only those disagreements, without scanning
  // all cards on normal scroll. Embed documents retain parent clipping.
  const uncertainMotionCards=new Set();
  let cardMotionFrame=0;
  function cardNearViewport(card,trackRects){
    const rect=card.getBoundingClientRect();
    const height=window.innerHeight||document.documentElement.clientHeight||0;
    const width=window.innerWidth||document.documentElement.clientWidth||0;
    if(!rect.width||!rect.height||rect.bottom < -260||rect.top > height+260||rect.right<=0||rect.left>=width)return false;
    const track=card.closest(".m7-media-track");
    if(track){
      let clip=trackRects?.get(track);
      if(!clip){
        clip=track.getBoundingClientRect();
        trackRects?.set(track,clip);
      }
      if(rect.right<=clip.left||rect.left>=clip.right)return false;
    }
    return true;
  }
  function refreshUncertainCardMotion(){
    if(!uncertainMotionCards.size||cardMotionFrame)return;
    cardMotionFrame=requestAnimationFrame(()=>{
      cardMotionFrame=0;
      const trackRects=new Map();
      uncertainMotionCards.forEach(card=>{
        const near=card.isConnected&&cardNearViewport(card,trackRects);
        card.classList.toggle("m7-media-motion-sleep",!near);
        if(!near)uncertainMotionCards.delete(card);
      });
    });
  }
  window.addEventListener("scroll",refreshUncertainCardMotion,{passive:true});
  window.addEventListener("resize",refreshUncertainCardMotion,{passive:true});
  window.addEventListener("pageshow",refreshUncertainCardMotion);

  function startCardMotionObserver(){

    disconnectCardMotionObserver();

    const cards =
      Array.from(
        root.querySelectorAll(
          ".m7-media-hero-card,.m7-media-card"
        )
      );

    if(!cards.length || !("IntersectionObserver" in window)){
      return;
    }

    const viewportHeight =
      window.innerHeight ||
      document.documentElement.clientHeight ||
      0;

    cards.forEach(function(card){
      try{
        const rect=card.getBoundingClientRect();
        const near=rect.bottom>=-260 && rect.top<=viewportHeight+260;
        card.classList.toggle("m7-media-motion-sleep",!near);
      }catch(_){}
    });

    cardMotionObserver =
      new IntersectionObserver(
        function(entries){
          const trackRects=new Map();
          entries.forEach(function(entry){
            entry.target.classList.toggle(
              "m7-media-motion-sleep",
              !entry.isIntersecting && !(window.self===window.top&&cardNearViewport(entry.target,trackRects))
            );
            if(!entry.isIntersecting&&!entry.target.classList.contains("m7-media-motion-sleep"))uncertainMotionCards.add(entry.target);
            else uncertainMotionCards.delete(entry.target);
          });
        },
        {
          root:null,
          rootMargin:"260px 0px",
          threshold:0
        }
      );

    cards.forEach(function(card){
      try{cardMotionObserver.observe(card)}catch(_){}
    });

  }


  function disconnectPreviewObserver(){

    if(
      previewObserver
    ){

      try{
        previewObserver.disconnect();
      }
      catch(_){}

      previewObserver =
        null;

    }


    visiblePreviewVideos.clear();


    root
      .querySelectorAll(
        "[data-preview-video]"
      )
      .forEach(
        releasePreviewSource
      );

  }


  function startPreviewObserver(){

    disconnectPreviewObserver();


    const videos =
      Array.from(
        root.querySelectorAll(
          "[data-preview-video]"
        )
      );


    if(
      !videos.length
    ){
      return;
    }


    videos.forEach(
      preparePreviewVideo
    );


    if(!("IntersectionObserver" in window)){
      videos.forEach(video=>visiblePreviewVideos.add(video));
      syncPreviewPlayback();
      return;
    }

    previewObserver =
      new IntersectionObserver(
        function(entries){

          entries.forEach(
            function(entry){

              if(
                entry.isIntersecting
              ){

                visiblePreviewVideos.add(
                  entry.target
                );

              }
              else{

                visiblePreviewVideos.delete(
                  entry.target
                );

              }

            }
          );


          syncPreviewPlayback();

        },
        {
          root:null,

          /*
             Pre-warm media shortly before it reaches the visible area.
             The old 55% gate could classify an obviously visible card as
             offscreen until the user scrolled. Any real intersection now
             counts, while the single-moving-preview rule below is unchanged.
          */
          rootMargin:
            "220px 0px",

          threshold:[
            0,
            .01,
            .15,
            .55
          ]
        }
      );


    videos.forEach(
      function(video){

        previewObserver.observe(
          video
        );

      }
    );

  }


  function scheduleWakeRefresh(){

    clearTimeout(
      wakeRefreshTimer
    );

    wakeRefreshTimer =
      setTimeout(
        function(){

          wakeRefreshTimer =
            null;
          if(!mediaSectionAwake())return;

          loadAll(
            false
          );

          syncPreviewPlayback();

        },
        120
      );

  }


  document.addEventListener(
    "visibilitychange",
    function(){

      if(
        document.visibilityState ===
          "visible" &&
        window.ShoufHonEmbedVisibility?.visible !== false
      ){

        scheduleWakeRefresh();
        if(viewerVisibilityPaused && viewerOpen && viewerVideo.getAttribute("src")){
          viewerVisibilityPaused=false;
          viewerVideo.play()?.catch(()=>{});
        }

      }
      else{

        viewerVisibilityPaused=viewerVisibilityPaused || (viewerOpen && !viewerVideo.paused);
        try{viewerVideo.pause()}catch(_){}

        clearTimeout(
          wakeRefreshTimer
        );

        wakeRefreshTimer =
          null;

        root
          .querySelectorAll(
            "[data-preview-video]"
          )
          .forEach(
            releasePreviewSource
          );

      }

    }
  );


  window.addEventListener(
    "focus",
    function(){

      if(window.ShoufHonEmbedVisibility?.visible===false){
        return;
      }

      scheduleWakeRefresh();

    }
  );


  window.addEventListener(
    "shoufhon:embed-visibility",
    function(event){

      if(event?.detail?.visible===false){
        clearTimeout(wakeRefreshTimer);
        wakeRefreshTimer=null;
        root
          .querySelectorAll(
            "[data-preview-video]"
          )
          .forEach(
            releasePreviewSource
          );
        return;
      }

      scheduleWakeRefresh();
      syncPreviewPlayback();

    }
  );


  // Reuse the shared viewport lifecycle; no observer or polling controller.
  window.addEventListener("shoufhon:viewport-open",()=>{previewCovered=true;syncPreviewPlayback()});
  window.addEventListener("shoufhon:viewport-close",()=>{previewCovered=false;syncPreviewPlayback()});
  window.addEventListener("pagehide",()=>{
    mediaPageAway=true;
    clearTimeout(wakeRefreshTimer);
    viewerVisibilityPaused=viewerVisibilityPaused || (viewerOpen && !viewerVideo.paused);
    try{viewerVideo.pause()}catch(_){}
    syncPreviewPlayback();
  });
  window.addEventListener("pageshow",()=>{
    mediaPageAway=false;
    if(!document.hidden){
      if(viewerVisibilityPaused && viewerOpen && viewerVideo.getAttribute("src")){
        viewerVisibilityPaused=false;viewerVideo.play()?.catch(()=>{});
      }
      syncPreviewPlayback();
    }
  });

  function normalizeIndex(index){

    const length =
      viewerMedia.length;


    if(!length){
      return 0;
    }


    if(
      index < 0
    ){
      return (
        length - 1
      );
    }


    if(
      index >= length
    ){
      return 0;
    }


    return index;

  }


  function viewerAccent(
    item
  ){

    const prefix =
      item &&
      item.type ===
        "video"
        ? "video"
        : "photo";


    const color =
      getComputedStyle(root)
        .getPropertyValue(
          "--m7-" +
          prefix
        )
        .trim() ||
      "#d9a441";


    const rgb =
      hexToRgb(
        color
      ) ||
      {
        r:242,
        g:202,
        b:237
      };


    viewer.style.setProperty(
      "--m7-view-rgb",
      rgb.r +
      "," +
      rgb.g +
      "," +
      rgb.b
    );


    viewer.style.setProperty(
      "--m7-view-light",
      mix(
        rgb,
        {
          r:255,
          g:255,
          b:255
        },
        .48
      )
    );

  }

  function relativeCommentTime(
    value
  ){

    const time =
      new Date(
        value ||
        0
      ).getTime();

    if(
      !Number.isFinite(
        time
      )
    ){
      return "Just now";
    }

    const seconds =
      Math.max(
        0,
        Math.floor(
          (
            Date.now() -
            time
          ) /
          1000
        )
      );

    if(seconds < 45){
      return "Just now";
    }

    const minutes =
      Math.floor(
        seconds /
        60
      );

    if(minutes < 60){
      return (
        minutes +
        "m"
      );
    }

    const hours =
      Math.floor(
        minutes /
        60
      );

    if(hours < 24){
      return (
        hours +
        "h"
      );
    }

    const days =
      Math.floor(
        hours /
        24
      );

    if(days < 7){
      return (
        days +
        "d"
      );
    }

    return new Date(
      time
    ).toLocaleDateString(
      "en-US",
      {
        month:"short",
        day:"numeric"
      }
    );

  }

  function avatarMarkup(
    url,
    name,
    className,
    extraAttributes,
    officialAdmin
  ){

    const attrs =
      String(
        extraAttributes ||
        ""
      ).trim();

    const attrText =
      attrs
        ? " " + attrs
        : "";

    const safeUrl =
      validUrl(url)
        ? String(url)
        : "";

    const official =
      officialAdmin === true;

    const finalClassName =
      String(className || "") +
      (official ? " m7-official-ring" : "");

    const shield =
      official
        ? officialShieldMarkup()
        : "";

    const letters =
      String(
        name ||
        "S"
      )
        .trim()
        .split(/\s+/)
        .slice(0,2)
        .map(
          function(part){
            return (
              part[0] ||
              ""
            );
          }
        )
        .join("")
        .slice(0,2)
        .toUpperCase() ||
      "S";

    if(safeUrl){

      return `
        <span class="${esc(finalClassName)}"${attrText}>
          <img
            src="${esc(safeUrl)}"
            alt=""
            loading="lazy"
            decoding="async"
          >
          ${shield}
        </span>
      `;

    }

    return `
      <span class="${esc(finalClassName)}"${attrText}>
        ${esc(letters)}
        ${shield}
      </span>
    `;

  }

  async function toggleCurrentMediaLike(){

    const item =
      currentViewerItem();

    const key =
      socialKey(
        item
      );

    if(
      !key ||
      !viewerLikeButton ||
      viewerLikeButton.dataset.busy ===
        "1"
    ){
      return;
    }


    const account =
      await accountState(
        true
      );

    if(
      !account.loggedIn
    ){

      requestLogin();

      socialToast(
        "Log in to like photos and videos."
      );

      return;
    }


    const previous = {
      ...engagementFor(
        item
      )
    };


    /*
       Instant feedback; server result is authoritative and replaces this.
    */
    const nextLiked =
      previous.liked_by_me !==
        true;

    const optimistic = {
      ...previous,
      liked_by_me:
        nextLiked,
      like_count:
        Math.max(
          0,
          Number(
            previous.like_count ||
            0
          ) +
          (
            nextLiked
              ? 1
              : -1
          )
        )
    };

    engagementMap.set(
      key,
      optimistic
    );

    updateEngagementDom();


    if(nextLiked){

      viewerLikeButton.classList.remove(
        "just-liked"
      );

      void viewerLikeButton
        .offsetWidth;

      viewerLikeButton.classList.add(
        "just-liked"
      );

      setTimeout(
        function(){
          viewerLikeButton.classList.remove(
            "just-liked"
          );
        },
        420
      );

    }


    viewerLikeButton.dataset.busy =
      "1";


    try{

      const result =
        await mediaRpc(
          "ma7alak_toggle_media_like",
          {
            p_shop_slug:
              SHOP_SLUG,
            p_media_type:
              item.type,
            p_media_id:
              Number(
                item.sourceId
              )
          }
        );


      const row =
        Array.isArray(result)
          ? (
              result[0] ||
              {}
            )
          : (
              result ||
              {}
            );


      engagementMap.set(
        key,
        {
          ...optimistic,
          liked_by_me:
            row.liked ===
              true,
          like_count:
            Math.max(
              0,
              Number(
                row.like_count ??
                optimistic.like_count
              )
            ),
          comment_count:
            Math.max(
              0,
              Number(
                row.comment_count ??
                optimistic.comment_count
              )
            )
        }
      );


      updateEngagementDom();

    }
    catch(error){

      engagementMap.set(
        key,
        previous
      );

      updateEngagementDom();

      socialToast(
        socialErrorMessage(
          error
        )
      );

    }
    finally{

      delete viewerLikeButton
        .dataset.busy;

    }

  }

      }
      else{

        const initial =
          account.loggedIn
            ? (
                name
                  .trim()
                  .charAt(0)
                  .toUpperCase() ||
                "S"
              )
            : "S";

        commentMe.textContent =
          initial;

      }

    }


    if(
      commentInput
    ){

      commentInput.disabled =
        !account.loggedIn;

      commentInput.placeholder =
        account.loggedIn
          ? "Write a comment…"
          : "Log in to join the conversation";

    }


    if(
      commentSend
    ){

      commentSend.disabled =
        false;

      if(
        !account.loggedIn
      ){

        commentSend.textContent =
          "Log in";

      }
      else if(
        editingCommentId
      ){

        commentSend.textContent =
          "Save";

      }
      else{

        commentSend.textContent =
          "Send";

      }

    }


    return account;

  }


  function commentById(
    id
  ){

    const numeric =
      Number(
        id
      );

    return commentsRows.find(
      function(row){
        return (
          Number(
            row.id
          ) ===
          numeric
        );
      }
    ) ||
    null;

  }


  function rootIdForComment(
    row
  ){

    return Number(
      row?.thread_root_id ||
      row?.id ||
      0
    );

  }

  ){

            )

            )

    const actions =
