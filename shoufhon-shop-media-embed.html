  function renderComments(
    focusId
  ){

    if(
      !commentsList
    ){
      return;
    }


    if(
      !commentsRows.length
    ){

      commentsList.innerHTML =
        `<div class="m7c-empty">No comments yet.<br>Be the first to join the conversation.</div>`;

      if(commentsCount){
        commentsCount.textContent =
          "0";
      }

      return;
    }


    const roots =
      [];

    const byRoot =
      new Map();


    commentsRows
      .forEach(
        function(row){

          const rootId =
            rootIdForComment(
              row
            );

          if(
            !row.parent_comment_id
          ){

            roots.push(
              row
            );

          }
          else{

            if(
              !byRoot.has(
                rootId
              )
            ){
              byRoot.set(
                rootId,
                []
              );
            }

            byRoot
              .get(
                rootId
              )
              .push(
                row
              );

          }

        }
      );


    /*
       Defensive fallback for a reply whose root row was removed outside this
       feature. It still remains visible instead of disappearing.
    */
    const rootIds =
      new Set(
        roots.map(
          function(row){
            return Number(
              row.id
            );
          }
        )
      );


    byRoot.forEach(
      function(replies,rootId){

        if(
          !rootIds.has(
            Number(
              rootId
            )
          ) &&
          replies.length
        ){

          roots.push(
            replies[0]
          );

          byRoot.delete(
            rootId
          );

        }

      }
    );


    roots.sort(
      function(a,b){
        return (
          new Date(
            a.created_at ||
            0
          ).getTime() -
          new Date(
            b.created_at ||
            0
          ).getTime()
        );
      }
    );


    let html =
      "";


    roots.forEach(
      function(rootRow){

        const rootId =
          Number(
            rootRow.id
          );

        const replies =
          (
            byRoot.get(
              rootId
            ) ||
            []
          )
            .slice()
            .sort(
              function(a,b){
                return (
                  new Date(
                    a.created_at ||
                    0
                  ).getTime() -
                  new Date(
                    b.created_at ||
                    0
                  ).getTime()
                );
              }
            );


        const focusInside =
          replies.some(
            function(reply){
              return (
                Number(
                  reply.id
                ) ===
                Number(
                  focusId ||
                  0
                )
              );
            }
          );


        if(focusInside){
          expandedThreads.add(
            rootId
          );
        }


        html +=
          renderCommentRow(
            rootRow,
            false,
            focusId
          );


        if(
          replies.length
        ){

          const expanded =
            expandedThreads.has(
              rootId
            );

          html += `
            <button
              class="m7c-thread-toggle"
              type="button"
              data-thread-toggle="${rootId}"
            >
              ${expanded ? "Hide replies" : "View " + replies.length + (replies.length === 1 ? " reply" : " replies")}
            </button>
          `;


          if(expanded){

            replies.forEach(
              function(reply){

                html +=
                  renderCommentRow(
                    reply,
                    true,
                    focusId
                  );

              }
            );

          }

        }

      }
    );


    commentsList.innerHTML =
      html;
    window.ShoufHonCircleDesign.syncAvatarColors(commentsList,null,async slugs=>{const result=await supabaseClient.from('shop_profiles').select('shop_slug,directory_options').in('shop_slug',slugs);if(result.error)throw result.error;return result.data||[]});


    if(
      commentsCount
    ){

      commentsCount.textContent =
        String(
          commentsRows.filter(
            function(row){
              return !row.deleted;
            }
          ).length
        );

    }


    if(focusId){

      requestAnimationFrame(
        function(){

          const node =
            commentsList.querySelector(
              '[data-comment-id="' +
              CSS.escape(
                String(
                  focusId
                )
              ) +
              '"]'
            );

          if(node){

            node.scrollIntoView({
              block:"center",
              behavior:"smooth"
            });

            setTimeout(
              function(){
                node.classList.remove(
                  "focus"
                );
              },
              1800
            );

          }

        }
      );

    }

  }


  async function loadComments(
    showLoading,
    focusId
  ){

    const item =
      currentViewerItem();

    const key =
      socialKey(
        item
      );

    if(
      !key ||
      commentsLoading
    ){
      return;
    }


    commentsLoading =
      true;

    commentsMediaKey =
      key;


    if(
      showLoading &&
      commentsList
    ){

      commentsList.innerHTML =
        `<div class="m7c-empty">Loading comments…</div>`;

    }


    try{

      const rows =
        await mediaRpc(
          "shoufhon_get_media_comments",
          {
            p_shop_slug:
              SHOP_SLUG,
            p_media_type:
              item.type,
            p_media_id:
              Number(
                item.sourceId
              ),
            p_limit:200
          },
          {
            readOnly:true
          }
        );


      /*
         Ignore a slow response if the viewer moved to another item.
      */
      if(
        commentsMediaKey !==
          socialKey(
            currentViewerItem()
          )
      ){
        return;
      }


      commentsRows =
        Array.isArray(rows)
          ? rows
          : [];


      renderComments(
        focusId
      );

    }
    catch(error){

      if(commentsList){

        commentsList.innerHTML =
          `<div class="m7c-empty">Could not load comments.<br>Try again in a moment.</div>`;

      }

      console.warn(
        "[ShoufHon Media] comments:",
        error
      );

    }
    finally{

      commentsLoading =
        false;

    }

  }


  async function openComments(
    options
  ){

    const item =
      currentViewerItem();

    if(
      !socialKey(
        item
      ) ||
      !commentsSheet
    ){
      return;
    }

    if(!mediaCommentsEnabled){
      closeComments();
      socialToast(
        "Comments are turned off for this shop."
      );
      return;
    }

    const settings =
      options ||
      {};


    commentsOpen =
      true;

    commentsSheet.classList.add(
      "open"
    );

    commentsSheet.setAttribute(
      "aria-hidden",
      "false"
    );

    syncKeyboardViewport();


    await syncCommentComposerAccount(
      true
    );


    if(
      settings.focusCommentId
    ){

      const target =
        commentById(
          settings.focusCommentId
        );

      if(target){

        expandedThreads.add(
          rootIdForComment(
            target
          )
        );

      }

    }


    await loadComments(
      true,
      settings.focusCommentId ||
      null
    );

  }

    ){

      );

        "true"
      );

      longPressTimer
    );

    longPressTimer =
      null;

  }


  function closeComments(){

    commentsOpen =
      false;

    commentsMediaKey =
      "";

      [];

    expandedThreads.clear();

    closeCommentActions();

    clearLongPress();


    if(
      commentsSheet
    ){

      commentsSheet.classList.remove(
        "open"
      );

      commentsSheet.setAttribute(
        "aria-hidden",
        "true"
      );

    );

      null;

    replyTarget =

  function setEditingComment(
    row
  ){

    if(
      !row ||
      row.can_edit !==
        true ||
      row.deleted
    ){
      return;
    }

    replyTarget =
      null;

    editingCommentId =
      Number(
        row.id
      );


    if(replyChip){

      replyChip.hidden =
        false;

    }

        );

          commentInput.value.length,
          commentInput.value.length
        );

      catch(_){}

    }


    if(commentSend){

      commentSend.textContent =
        "Save";

    }

    if(
      !commentInput
    ){
      return;
    }

    commentInput.style.height =
      "auto";

    commentInput.style.height =
      Math.min(
        92,
        Math.max(
          37,
          commentInput.scrollHeight
        )
      ) +
      "px";

  }


  async function submitComment(){

    const item =
      currentViewerItem();

    if(
      !socialKey(
        item
      ) ||
      !commentSend
    ){
      return;
    }


    const account =
      await accountState(
        true
      );


    if(
      !account.loggedIn
    ){

      requestLogin();

      socialToast(
        "Log in to comment."
      );

      return;
    }


    const body =
      String(
        commentInput?.value ||
        ""
      ).trim();


    if(
      !body
    ){

      socialToast(
        "Write a comment first."
      );

      return;
    }


    if(
      body.length >
        500
    ){

      socialToast(
        "Comments can be up to 500 characters."
      );

      return;
    }


    commentSend.disabled =
      true;


    try{

      if(
        editingCommentId
      ){

        await mediaRpc(
          "ma7alak_edit_media_comment",
          {
            p_comment_id:
              Number(
                editingCommentId
              ),
            p_body:
              body
          }
        );

        socialToast(
          "Comment updated."
        );

      }
      else{

        const newId =
          await mediaRpc(
            "ma7alak_create_media_comment",
            {
              p_shop_slug:
                SHOP_SLUG,
              p_media_type:
                item.type,
              p_media_id:
                Number(
                  item.sourceId
                ),
              p_parent_comment_id:
                replyTarget
                  ? Number(
                      replyTarget.id
                    )
                  : null,
              p_body:
                body
            }
          );


        if(replyTarget){

          expandedThreads.add(
            rootIdForComment(
              replyTarget
            )
          );

        }


        socialToast(
          replyTarget
            ? "Reply posted."
            : "Comment posted."
        );


        /*
           Focus the newly-created row after refresh.
        */
        resetCommentComposer();

        await loadEngagementState();

        commentsLoading =
          false;

        await loadComments(
          false,
          Number(
            newId
          ) ||
          null
        );

        return;

      }


      resetCommentComposer();

      await loadEngagementState();

      commentsLoading =
        false;

      await loadComments(
        false
      );

    }
    catch(error){

      socialToast(
        socialErrorMessage(
          error
        )
      );

    }
    finally{

      commentSend.disabled =
        false;

      await syncCommentComposerAccount(
        false
      );

    }

  }


  async function toggleCommentLike(
    commentId
  ){

    const account =
      await accountState(
        true
      );


    if(
      !account.loggedIn
    ){

      requestLogin();

      socialToast(
        "Log in to like comments."
      );

      return;
    }


    const row =
      commentById(
        commentId
      );

    if(
      !row ||
      row.deleted ||
      row._likeBusy
    ){
      return;
    }


    row._likeBusy =
      true;


    try{

      const result =
        await mediaRpc(
          "ma7alak_toggle_media_comment_like",
          {
            p_comment_id:
              Number(
                commentId
              )
          }
        );


      const state =
        Array.isArray(result)
          ? (
              result[0] ||
              {}
            )
          : (
              result ||
              {}
            );


      row.liked_by_me =
        state.liked ===
          true;

      row.like_count =
        Math.max(
          0,
          Number(
            state.like_count ||
            0
          )
        );

      row.liked_by_shop_owner =
        state.liked_by_shop_owner ===
          true;


      renderComments();

    }
    catch(error){

      socialToast(
        socialErrorMessage(
          error
        )
      );

    }
    finally{

      delete row._likeBusy;

    }

  }


  function commentAuthorShopTarget(
    row
  ){

    if(
      !row ||
      row.author_is_shop_owner !==
        true
    ){
      return "";
    }

    const raw =
      String(
        row.author_shop_url ||
        ""
      ).trim();

    if(raw){
      try{
        return new URL(
          raw,
          window.location.origin
        ).href;
      }
      catch(_){}
    }

    const slug =
      String(
        row.author_shop_slug ||
        ""
      )
        .trim()
        .toLowerCase();

    if(!slug){
      return "";
    }

    try{
      return new URL(
        "/" +
          encodeURIComponent(
            slug
          ),
        window.location.origin
      ).href;
    }
    catch(_){
      return "";
    }

  }


  function openCommentAuthorShop(
    row
  ){

    if(
      !row ||
      row.author_is_shop_owner !==
        true
    ){
      return;
    }

    const slug =
      String(
        row.author_shop_slug ||
        ""
      )
        .trim()
        .toLowerCase();

    if(!slug){
      return;
    }

    closeCommentActions();

    /*
      Hostinger embeds can be sandboxed. Ask the top-level ShoufHon shop
      context bridge to perform the real navigation instead of relying on
      direct iframe -> top.location access.
    */
    try{
      if(
        window.parent &&
        window.parent !== window
      ){
        window.parent.postMessage(
          {
            type:"SHOUFHON_OPEN_SHOP_PROFILE",
            shopSlug:slug,
            sentAt:Date.now()
          },
          "*"
        );
        return;
      }
    }
    catch(_){}

    try{
      window.location.href =
        "/" +
        encodeURIComponent(slug);
    }
    catch(_){}

  }

      !commentActions ||
      !commentActionsButtons ||

    );

  function messageCommentAuthor(
    row
  ){

    if(
      !row ||
      row.can_message_author !==
        true ||
      !row.author_user_id
    ){
      return;
    }

    const viewerUserId =
      String(
        row.author_user_id
      ).trim();

    if(!viewerUserId){
      return;
    }

    closeCommentActions();

    const launch = function(){

      try{
        if(
          window.parent &&
          window.parent !== window &&
          window.parent.Ma7alakChat &&
          typeof window.parent.Ma7alakChat.openViewerUser ===
            "function"
        ){
          window.parent.Ma7alakChat.openViewerUser(
            viewerUserId
          );
          return;
        }
      }
      catch(_){}

      try{
        window.parent.postMessage(
          {
            type:"SHOUFHON_MEDIA_MESSAGE_USER",
            viewerUserId:viewerUserId,
            shopSlug:SHOP_SLUG,
            sentAt:Date.now()
          },
          "*"
        );
      }
      catch(_){
        socialToast(
          "Could not open messages."
        );
      }

    };

    /*
      Close the promoted Media viewer before opening the real header Inbox
      conversation so the chat is never hidden underneath the fullscreen
      Hostinger iframe.
    */
    try{
      closeComments();
    }
    catch(_){}

    Promise.resolve(
      closeMedia()

  /* Drag the comment sheet down from its handle/header to close. */
  let commentSheetDragStartY =
    null;

  let commentSheetDragY =
    0;

  function commentSheetDragStart(
    event
  ){

    const point =
      event.touches
        ? event.touches[0]
        : event;

    if(!point){
      return;
    }

    commentSheetDragStartY =
      point.clientY;

    commentSheetDragY =
      0;

  }


  function commentSheetDragMove(
    event
  ){

    if(
      commentSheetDragStartY ===
        null
    ){
      return;
    }

    const point =
      event.touches
        ? event.touches[0]
        : event;

    if(!point){
      return;
    }

    commentSheetDragY =
      Math.max(
        0,
        point.clientY -
        commentSheetDragStartY
      );

    if(
      commentsSheet &&
      commentSheetDragY >
        0
    ){

      commentsSheet.style.transition =
        "none";

      commentsSheet.style.transform =
        "translate3d(0," +
        Math.min(
          180,
          commentSheetDragY
        ) +
        "px,0)";

    }

  }


  function commentSheetDragEnd(){

    if(
      commentSheetDragStartY ===
        null
    ){
      return;
    }

    const shouldClose =
      commentSheetDragY >
        64;

    commentSheetDragStartY =
      null;

    commentSheetDragY =
      0;


    if(commentsSheet){

      commentsSheet.style.removeProperty(
        "transition"
      );

      commentsSheet.style.removeProperty(

      );

    const image =

      item.url,

    /*
       Keep a small cache only. This is enough to make the next/previous
       swipe feel immediate without turning the gallery into a bandwidth hog.

    if(

  function resolveKeyboardViewport(){

    let targetWindow =
      window;

    let viewport =
      window.visualViewport ||
      null;

    /*
       Hostinger embeds are iframes. On some phone browsers the iframe's
       VisualViewport does not reflect the keyboard, while the top page does.
       Use the parent viewport when same-origin access is available.
    */
    try{

      if(
        window.parent &&
        window.parent !== window &&
        window.parent.document &&
        window.parent.visualViewport
      ){
        targetWindow =
          window.parent;

        viewport =
          window.parent.visualViewport;
      }

    }
    catch(_){}

    keyboardWindow =
      targetWindow;

    keyboardViewport =
      viewport;

  }


  function syncKeyboardViewport(){

    if(
      !viewer
    ){
      return;
    }

    if(
      !keyboardWindow
    ){
      resolveKeyboardViewport();
    }

    const targetWindow =
      keyboardWindow ||
      window;

    const viewport =
      keyboardViewport ||
      targetWindow.visualViewport ||
      null;

    let layoutHeight =
      0;

    try{
      layoutHeight =
        Math.max(
          Number(
            targetWindow.innerHeight ||
            0
          ),
          Number(
            targetWindow.document
              ?.documentElement
              ?.clientHeight ||
            0
          )
        );
    }
    catch(_){
      layoutHeight =
        Math.max(
          window.innerHeight || 0,
          document.documentElement
            ?.clientHeight ||
          0
        );
    }

    const visualHeight =
      Math.max(
        220,
        Number(
          portalVisualViewport.height ||
          viewport?.height ||
          layoutHeight ||
          window.innerHeight ||
          0
        )
      );

    const visualTop =
      Math.max(
        0,
        Number(
          portalVisualViewport.offsetTop ||
          viewport?.offsetTop ||
          0
        )
      );

    const portalManaged =
      portalVisualViewport.height > 0 &&
      window.parent &&
      window.parent !== window;

    /*
       IMPORTANT: when the ShoufHon viewport manager promotes this Hostinger
       iframe, the iframe itself is already resized/moved to the real
       VisualViewport (including the keyboard). Applying the keyboard height
       again here double-shifts the comments sheet upward.
    */
    const keyboardOffset =
      portalManaged
        ? 0
        : Math.max(
            0,
            Math.round(
              layoutHeight -
              visualHeight -
              visualTop
            )
          );

    viewer.style.setProperty(
      "--m7-vv-height",
      Math.round(
        visualHeight
      ) +
      "px"
    );

    viewer.style.setProperty(
      "--m7-keyboard-offset",
      keyboardOffset +
      "px"
    );

    const inputFocused =
      document.activeElement ===
        commentInput;

    viewer.classList.toggle(
      "keyboard-open",
      (
        commentsOpen &&
        (
          inputFocused ||
          (
            !portalManaged &&
            keyboardOffset >
              80
          )
        )
      )
    );

  }


  function ensureCommentComposerVisible(){

    if(
      !commentsOpen ||
      !commentComposer
    ){
      return;
    }

    syncKeyboardViewport();

    requestAnimationFrame(
      function(){

        syncKeyboardViewport();

        try{

          const portalManaged =
            portalVisualViewport.height > 0 &&
            window.parent &&
            window.parent !== window;

          /*
             In promoted Hostinger embeds the parent already keeps the iframe
             above the keyboard. scrollIntoView() here can scroll the embedded
             document itself and pull the composer toward the top of the
             screen, which is the large empty-gap bug seen on phones.
          */
          if(portalManaged){
            return;
          }

          const viewport =
            keyboardViewport;

          const bottom =
            viewport
              ? (
                  Number(
                    viewport.offsetTop ||
                    0
                  ) +
                  Number(
                    viewport.height ||
                    0
                  )
                )
              : window.innerHeight;

          const rect =
            commentComposer
              .getBoundingClientRect();

          if(
            rect.bottom >
              bottom - 4
          ){
            commentComposer.scrollIntoView({
              block:"end",
              inline:"nearest",
              behavior:"auto"
            });
          }

        }
        catch(_){}

      }
    );

  }

  window.addEventListener(
    "message",
    function(event){
      try{
        if(
          window.parent &&
          window.parent !== window &&
          event.source !== window.parent
        ){
          return;
        }
      }catch(_){
        return;
      }

      const data =
        event && event.data
          ? event.data
          : {};

      if(
        data.type !== "SHOUFHON_VISUAL_VIEWPORT"
      ){
        return;
      }

      const kind =
        String(
          data.viewerKind ||
          ""
        ).trim();

      if(
        kind &&
        kind !== "media-viewer"
      ){
        return;
      }

      portalVisualViewport = {
        width:
          Math.max(
            0,
            Number(data.width || 0)
          ),
        height:
          Math.max(
            0,
            Number(data.height || 0)
          ),
        offsetTop:
          Math.max(
            0,
            Number(data.offsetTop || 0)
          ),
        offsetLeft:
          Math.max(
            0,
            Number(data.offsetLeft || 0)
          )
      };

      syncKeyboardViewport();
    }
  );

  function mediaShareUrl(item){return "https://shoufhon.com/reel-share/media/"+encodeURIComponent(SHOP_SLUG)+"/"+item.type+"/"+item.sourceId;}
function whatsappNumber(raw){
  raw=String(raw||"").trim();
  if(/^https?:\/\//i.test(raw)){
    try{var u=new URL(raw);if(["wa.me","www.wa.me"].includes(u.hostname))raw=u.pathname.slice(1);else if(["api.whatsapp.com","web.whatsapp.com"].includes(u.hostname)&&u.pathname==="/send")raw=u.searchParams.get("phone")||"";else return ""}catch(_){return ""}
  }
  if(!/^[+\d\s().-]+$/.test(raw))return "";
  var n=raw.replace(/[^\d]/g,"").replace(/^00/,"");
  if(n.startsWith("9610"))n="961"+n.slice(4);
  else if(n.length===8&&n[0]==="0")n="961"+n.slice(1);
  else if(n.length===8||n.length===7)n="961"+n;
  if(n.startsWith("961")&&!/^961\d{7,8}$/.test(n))return "";
  return /^[1-9]\d{9,14}$/.test(n)?n:"";
}

  async function updateMediaShareActions(item){
    const button=document.getElementById("m7v-whatsapp");button.hidden=true;button.removeAttribute("href");
    const key=item.type+":"+item.sourceId;
    const valid=()=>viewerMedia[currentIndex]===item;
    const sync=(row)=>{
      if(!valid())return;
      const n=whatsappNumber(row?.whatsapp_url);if(!n)return;
      const url=new URL("https://wa.me/"+n);
      url.searchParams.set("text","Hello, I'm reaching out regarding this "+(item.type==="video"?"video":"photo")+" on ShoufHon:\n"+mediaShareUrl(item));
      button.href=url.href;button.hidden=false;
    };
    const cachedContact=whatsappContactCache.get(SHOP_SLUG);
    if(cachedContact)sync({whatsapp_url:cachedContact});
    try{
      let cached=mediaShareCache.get(key);
      if(!cached||Date.now()-cached.at>60000){
        cached={at:Date.now(),promise:mediaRpc("shoufhon_get_media_share",{p_shop_slug:SHOP_SLUG,p_media_type:item.type,p_media_id:Number(item.sourceId)},{readOnly:true}).then(rows=>Array.isArray(rows)?rows[0]:rows)};
        mediaShareCache.set(key,cached);

  /* =========================================================
     MEDIA RETURN POSITION
     ---------------------------------------------------------
     The top-level ShoufHon viewport manager owns iframe promotion.
     Keep only the exact page POV here so closing Media cannot flash up to
     the profile circle before the page settles back on the opened media.
  ========================================================= */

  let mediaReturnState = null;

  function captureMediaReturnPosition(){

    /*
      IMPORTANT PHONE RULE:
      This iframe owns only its own local scroll position.
      The TOP-LEVEL shoufhon-viewport-manager.js is the single owner of
      parent-page scroll locking/restoration. Never call parent.scrollTo()
      or touch parent.history.scrollRestoration from inside this embed.
      Having both layers restore the parent was the visible up/down jump.
    */
    mediaReturnState = {
      localX:Number(window.scrollX || 0),
      localY:Number(window.scrollY || 0)
    };

  }


  function restoreMediaReturnPosition(){

    const state = mediaReturnState;
    mediaReturnState = null;

    if(!state){
      return;
    }

    const x = Number(state.localX || 0);
    const y = Number(state.localY || 0);

    const restore = function(){
      try{
        window.scrollTo({
          left:x,
          top:y,
          behavior:"auto"
        });
      }
      catch(_){
        try{
          window.scrollTo(x,y);
        }
        catch(__){}
      }
    };

    restore();
    // Only restore the iframe once. Repeated frame scrolls after closing can
    // compete with a new gesture while Hostinger restores the embed height.

  }


  async function enterViewport(){

    if(window.ShoufHonNativeShopTest){
      window.ShoufHonNativeShopUI?.openViewport("media-viewer");
      return;
    }

    /*
       SHOUFHON VIEWPORT MODE ONLY.
       Never request browser/native fullscreen here.

       This Media Showcase lives inside a Hostinger iframe, so ask the
       parent page to promote this exact iframe into the normal browser
       viewport through the universal ShoufHon viewport manager.
    */
    try{

      if(
        window.parent &&
        window.parent !== window
      ){

        window.parent.postMessage(
          {
            type:
              "SHOUFHON_EMBED_VIEWER_OPEN",
            viewerKind:
              "media-viewer",
            shopSlug:
              SHOP_SLUG
          },
          "*"
        );

      }

    }
    catch(_){}

  }

  function requestedMediaDeepLink(){

    const urls =
      [];


    try{
      if(
        window.parent &&
        window.parent !==
          window
      ){
        urls.push(
          window.parent.location.href
        );
      }
    }
    catch(_){}


    try{
      if(document.referrer){
        urls.push(
          document.referrer
        );
      }
    }
    catch(_){}


    try{
      urls.push(
        window.location.href
      );
    }
    catch(_){}


    for(
      const value
      of urls
    ){

      try{

        const url =
          new URL(
            value,
            location.href
          );

        const raw =
          String(
            url.searchParams.get(
              "media"
            ) ||
            ""
          ).trim();

        const match =
          raw.match(
            /^(photo|video):(\d+)$/
          );

        if(!match){
          continue;
        }

        return {
          mediaType:
            match[1],
          mediaId:
            Number(
              match[2]
            ),
          comments:
            url.searchParams.get(
              "comments"
            ) ===
              "1",
          commentId:
            Number(
              url.searchParams.get(
                "comment"
              ) ||
              0
            ) ||
            null
        };

      }
      catch(_){}

    }


    return null;

  }


  async function openExactMedia(
    mediaType,
    mediaId,
    options
  ){

    const type =
      String(
        mediaType ||
        ""
      ).toLowerCase();

    const id =
      Number(
        mediaId
      );

    if(
      !["photo","video"].includes(
        type
      ) ||
      !Number.isFinite(
        id
      )
    ){
      return false;
    }


    const base =
      type ===
        "photo"
        ? allPhotoMedia
        : allVideoMedia;

    const index =
      base.findIndex(
        function(item){
          return (
            Number(
              item.sourceId
            ) ===
            id
          );
        }
      );


    if(index < 0){
      return false;
    }

    captureMediaReturnPosition();


    viewerAlbum =
      null;

    viewerMedia =
      base.slice();

    viewerOpen =
      true;


    root
      .querySelectorAll(
        "[data-preview-video]"
      )
      .forEach(
        releasePreviewSource
      );


    showMedia(
      index
    );


    viewer.classList.add(
      "active"
    );

    viewer.setAttribute(
      "aria-hidden",
      "false"
    );


    if(!window.ShoufHonNativeShopTest){
      document.documentElement.style.overflow="hidden";
      document.body.style.overflow="hidden";
    }

    await enterViewport();


    const settings =
      options ||
      {};


    if(
      settings.comments
    ){

      await openComments({
        focusCommentId:
          settings.commentId ||
          null
      });

    }


    return true;

  }


  async function maybeOpenRequestedMedia(){

  async function closeMedia(options={}){

    if(window.ShoufHonNativeShopTest&&viewerOpen){
      window.ShoufHonNativeShopUI?.closeViewport("media-viewer",options.fromPortalBack===true);
    }

    if(
      !viewerOpen
    ){
      return;
    }


    /*
      Viewport mode has no browser fullscreen state.
      Mark the viewer closed, then ask the parent viewport manager to restore
      the Hostinger iframe and the original page.
    */
    viewerOpen =
      false;


    try{

      if(
        window.parent &&
        window.parent !== window
      ){

        window.parent.postMessage(
          {
            type:"SHOUFHON_EMBED_VIEWER_CLOSE",
            viewerKind:"media-viewer",
            shopSlug:SHOP_SLUG,
            fromHistory:
              options.fromPortalBack === true,
            reason:
              options.fromPortalBack === true
                ? "back"
                : "close"
          },
          "*"
        );

      }

    }
    catch(_){}


    finishClose();

  /* =========================================================
     PHONE BACK — COMMENTS FIRST, VIEWER SECOND
     ---------------------------------------------------------
     The top page owns the Hostinger fullscreen portal/history entry.
     When Back is pressed it asks this embed what should close.

     1) comments open -> close comments only and keep viewer fullscreen
     2) comments closed -> close the Media viewer
  ========================================================= */
  window.addEventListener(
    "message",
    function(event){

      try{
        if(
          window.parent &&
          window.parent !== window &&
          event.source !== window.parent
        ){
          return;
        }
      }
      catch(_){
        return;
      }

      const data =
        event && event.data
          ? event.data
          : {};

      if(
        data.type !==
          "SHOUFHON_EMBED_VIEWER_BACK"
      ){
        return;
      }

      const kind =
        String(
          data.viewerKind ||
          ""
        ).trim();

      if(
        kind &&
        kind !== "media-viewer"
      ){
        return;
      }

      if(commentsOpen){
        closeComments();

        try{
          window.parent.postMessage(
            {
              type:
                "SHOUFHON_EMBED_VIEWER_BACK_HANDLED",
              viewerKind:
                "media-viewer",
              shopSlug:
                SHOP_SLUG,
              handled:
                "comments"
            },
            "*"
          );
        }
        catch(_){}

        return;
      }

      if(viewerOpen){
        /*
           Back #2 belongs to the Media viewer. The parent viewport manager
           now knows whether the browser is on viewer level 1 or already on
           the marked shop-page base, so it will never navigate behind the
           current shop page.
        */
        closeMedia({
          fromPortalBack:true
        });
      }

    }
  );



  /* =========================================================
     MEDIA NOTIFICATION DEEP-LINK BRIDGE
     ---------------------------------------------------------
     The top page owns the real URL/session state. Hostinger may isolate
     this embed, so the parent explicitly hands the exact media/comment
     target into the iframe. This makes Bell notifications open the same
     exact reply flow as owner Activity.
  ========================================================= */
  window.addEventListener(
    "message",
    async function(event){

      try{
        if(
          window.parent &&
          window.parent !== window &&
          event.source !== window.parent
        ){
          return;
        }
      }
      catch(_){
        return;
      }

      const data =
        event && event.data
          ? event.data
          : {};

      if(
        data.type !==
          "SHOUFHON_MEDIA_DEEPLINK_OPEN"
      ){
        return;
      }

      const incomingSlug =
        String(
          data.shopSlug ||
          ""
        )
          .trim()
          .toLowerCase();

      if(
        incomingSlug &&
        incomingSlug !==
          String(SHOP_SLUG||"")
            .trim()
            .toLowerCase()
      ){
        return;
      }

      const opened =
        await openExactMedia(
          data.mediaType,
          data.mediaId,
          {
            comments:
              data.comments === true,
            commentId:

          }

      if(opened){
        try{
          window.parent.postMessage(
            {
              type:
                "SHOUFHON_MEDIA_DEEPLINK_CONSUMED",
              shopSlug:
                SHOP_SLUG,
              mediaType:
                String(data.mediaType||""),
              mediaId:
                Number(data.mediaId)||0,
              commentId:
                Number(data.commentId)||null
            },
            "*"
          );
        }
        catch(_){}
      }

    }
  );

  /*
     PHONE-FIRST MEDIA NAVIGATION

     - swipe left/right on photos OR videos
     - tap/click left half = previous
     - tap/click right half = next
     - arrows are hidden; they are no longer required
     - only the small native video-control strip at the bottom is protected
       from tap navigation so play/progress controls remain usable
  */
  let swipeTracking =
    false;

  let touchStartedOnVideoControls =
    false;


  function viewerTapDirection(
    clientX
  ){

    const rect =
      viewerStage
        .getBoundingClientRect();


    if(
      !rect.width
    ){
      return;
    }


    if(
      clientX <
      rect.left +
      rect.width / 2
    ){
      previousMedia();
    }
    else{
      nextMedia();
    }

  }


  viewerStage.addEventListener(
    "touchstart",
    function(event){

      if(
        !viewerOpen ||
        commentsOpen ||
        !event.touches ||
        !event.touches[0]
      ){
        return;
      }


      const touch =
        event.touches[0];


      touchStartX =
        touch.clientX;

      touchStartY =
        touch.clientY;

      touchCurrentX =
        touchStartX;

      touchCurrentY =
        touchStartY;

      swipeTracking =
        true;

      touchStartedOnVideoControls =
        false;


      /*
         The whole video remains swipeable.
         Only a simple TAP inside the bottom native controls strip is
         reserved for play/progress/volume controls.
      */
      if(
        viewerVideo.classList
          .contains(
            "active"
          )
      ){

        const rect =
          viewerVideo
            .getBoundingClientRect();

        const controlGuard =
          Math.min(
            76,
            Math.max(
              50,
              rect.height * .14

        touchStartedOnVideoControls =
          touchStartY >=
            rect.bottom -

      passive:true,
      capture:true

  viewerStage.addEventListener(
    "touchmove",
    function(event){

        !swipeTracking ||
        !event.touches ||
        !event.touches[0]

        return;
      }


      touchCurrentX =
        event.touches[0]
          .clientX;

      touchCurrentY =
        event.touches[0]
          .clientY;


      const moveX =
        touchCurrentX -
        touchStartX;

      const moveY =
        touchCurrentY -
        touchStartY;


      /*
         Horizontal swipe always belongs to the Media viewer, including
         when the active item is a video.
      */
      if(
        Math.abs(moveX) > 10 &&
        Math.abs(moveX) >
          Math.abs(moveY) * 1.05
      ){

        if(
          event.cancelable
        ){
          event.preventDefault();
        }

      }

    },
    {
      passive:false,
      capture:true
    }
  );


  viewerStage.addEventListener(
    "touchend",
    function(){

      if(
        !swipeTracking
      ){
        return;
      }


      swipeTracking =
        false;


      const moveX =
        touchCurrentX -
        touchStartX;

      const moveY =
        touchCurrentY -
        touchStartY;


      const horizontalSwipe =
        Math.abs(moveX) >=
          38 &&
        Math.abs(moveX) >
          Math.abs(moveY) * 1.02;


      if(
        horizontalSwipe
      ){

        touchStartedOnVideoControls =
          false;


        if(
          moveX < 0
        ){
          nextMedia();
        }
        else{
          previousMedia();
        }

        return;
      }


      /*
         A clean tap on either side also navigates.
         Do not hijack a tap on the native video control strip.
      */
      const cleanTap =
        Math.abs(moveX) <
          18 &&
        Math.abs(moveY) <
          18;


      if(
        cleanTap &&
        !touchStartedOnVideoControls
      ){
        viewerTapDirection(
          touchStartX
        );
      }


      touchStartedOnVideoControls =
        false;

    },
    {
      passive:true,
      capture:true
    }
  );


  viewerStage.addEventListener(
    "touchcancel",
    function(){

      swipeTracking =
        false;

      touchStartedOnVideoControls =
        false;

    },
    {
      passive:true,
      capture:true
    }
  );


  /*
     Mouse/desktop click gets the same left/right behavior.
     Touch browsers are handled by touchend above.
  */
  viewerStage.addEventListener(
    "click",
    function(event){

      if(
        !viewerOpen ||
        commentsOpen ||
        event.detail === 0
      ){
        return;
      }

         Avoid duplicate navigation after a touch-generated click.
      */
      if(
        "ontouchstart" in window
      ){
        return;
      }


      viewerTapDirection(
        event.clientX
      );

    }
  );

  /* =========================================================

  function signatureFor(
    images,
    videos,
    albums,
    albumItems,
    options
  ){

    return JSON.stringify({
      images:
        (images || [])
          .map(
            function(row){

              return [
                row.id,
                row.image_url,
                row.sort_order,
                row.is_featured,
                row.created_at
              ];

            }
          ),

      videos:
        (videos || [])
          .map(
            function(row){

              return [
                row.id,
                row.video_url,
                row.sort_order,
                row.created_at
              ];

            }
          ),

      albums:
        (albums || [])
          .map(
            function(row){
              return [
                row.id,
                row.title,
                row.description,
                row.sort_order,
                row.updated_at
              ];
            }
          ),

      albumItems:
        (albumItems || [])
          .map(
            function(row){
              return [
                row.id,
                row.album_id,
                row.media_type,
                row.media_id,
                row.sort_order,
                row.is_cover
              ];
            }
          ),

      design:
        options || {}
    });

  }


  async function loadAll(
    forceRender
  ){

    if(
      !SHOP_SLUG
    ){

      loading.textContent =
        "Missing shop slug.";

      return;
    }


    try{

      const results =
        await Promise.all([
          supabaseClient
            .from(
              "shop_gallery"
            )
            .select(
              "id,image_url,sort_order,is_featured,created_at"
            )
            .eq(
              "shop_slug",
              SHOP_SLUG
            )
            .order(
              "sort_order",
              {
                ascending:true
              }
            )
            .order(
              "created_at",
              {
                ascending:true
              }
            ),

          supabaseClient
            .from(
              "shop_videos"
            )
            .select(
              "id,video_url,sort_order,created_at"
            )
            .eq(
              "shop_slug",
              SHOP_SLUG
            )
            .order(
              "sort_order",
              {
                ascending:true
              }
            )
            .order(
              "created_at",
              {
                ascending:true
              }
            ),

          supabaseClient
            .from(
              "shop_media_albums"
            )
            .select(
              "id,shop_slug,title,description,sort_order,created_at,updated_at"
            )
            .eq(
              "shop_slug",
              SHOP_SLUG
            )
            .order(
              "sort_order",
              {ascending:true}
            )
            .order(
              "id",
              {ascending:true}
            ),

          supabaseClient
            .from(
              "shop_media_album_items"
            )
            .select(
              "id,album_id,shop_slug,media_type,media_id,sort_order,is_cover,created_at"
            )
            .eq(
              "shop_slug",
              SHOP_SLUG
            )
            .order(
              "album_id",
              {ascending:true}
            )
            .order(
              "sort_order",
              {ascending:true}
            )
            .order(
              "id",
              {ascending:true}
            ),

          supabaseClient
            .from(
              "shop_profiles"
            )
            .select(
              "shop_slug,directory_options"
            )
            .eq(
              "shop_slug",
              SHOP_SLUG
            )
            .maybeSingle()
        ]);


      const imageResult =
        results[0];

      const videoResult =
        results[1];

      const albumResult =
        results[2];

      const albumItemsResult =
        results[3];

      const profileResult =
        results[4];


      if(
        imageResult.error
      ){
        throw imageResult.error;
      }


      if(
        videoResult.error
      ){
        throw videoResult.error;
      }


      if(
        albumResult.error
      ){
        throw albumResult.error;
      }

      if(
        albumItemsResult.error
      ){
        throw albumItemsResult.error;
      }

      if(
        profileResult.error
      ){

        console.warn(
          "[Ma7alak Media] profile design:",
          profileResult.error
        );

      }


      const nextImages =
        imageResult.data ||
        [];


      const nextVideos =
        videoResult.data ||
        [];


      const nextAlbums =
        albumResult.data ||
        [];

      const nextAlbumItems =
        albumItemsResult.data ||
        [];


      const nextOptions =
        (
          profileResult.data &&
          profileResult.data
            .directory_options &&
          typeof profileResult.data
            .directory_options ===
            "object"
        )
          ? profileResult.data
              .directory_options
          : {};


      const signature =
        signatureFor(
          nextImages,
          nextVideos,
          nextAlbums,
          nextAlbumItems,
          nextOptions
        );


      if(
        forceRender === true ||
        signature !==
          lastSignature
      ){

        lastSignature =
          signature;

        imageRows =
          nextImages;

        videoRows =
          nextVideos;

        albumRows =
          nextAlbums;

        albumItemRows =
          nextAlbumItems;

        profileOptions =
          nextOptions;

        try{
          window.dispatchEvent(
            new CustomEvent(
              "shoufhon:media-profile-options",
              {
                detail:{
                  shopSlug:SHOP_SLUG,
                  directory_options:nextOptions
                }
              }
            )
          );
        }catch(_){}


        applyProfileOptions();

        rebuildMedia();

      }


      await loadEngagementState();

    }
    catch(error){

      console.error(
        "[Ma7alak Media] load:",
        error
      );


      if(
        !allMedia.length
      ){

        content.hidden =
          true;

        loading.hidden =
          false;

        loading.textContent =
          "Media could not be loaded.";

      }

    }

  }


  /* =========================================================
     ADMIN LIVE DESIGN PREVIEW
     Unsaved changes can arrive through BroadcastChannel,
     storage, postMessage or Supabase Realtime Broadcast.
     Saved changes still use shop_profiles Realtime below.
  ========================================================= */

  function applyLiveDesignOptions(
    nextOptions
  ){

    if(
      !nextOptions ||
      typeof nextOptions !==
        "object"
    ){
      return;
    }

    profileOptions = {
      ...(profileOptions || {}),
      ...nextOptions
    };

    applyProfileOptions();

  }


  function handleDesignPreviewMessage(
    message
  ){

    const data =
      message &&
      message.data !== undefined
        ? message.data
        : message;

    if(
      !data ||
      data.type !==
        "MA7ALAK_DESIGN_PREVIEW" ||
      String(
        data.shop_slug || ""
      ).trim() !==
        SHOP_SLUG
    ){
      return;
    }

    applyLiveDesignOptions(
      data.directory_options
    );

  }


  try{

    if(
      "BroadcastChannel" in
      window
    ){

      designBroadcastChannel =
        new BroadcastChannel(
          "ma7alak-design-live-v1"
        );

      designBroadcastChannel
        .addEventListener(
          "message",
          handleDesignPreviewMessage
        );

    }

  }
  catch(_){}


  window.addEventListener(
    "storage",
    function(event){

      if(
        event.key !==
          "ma7alak_design_live_v1:"+
          SHOP_SLUG ||
        !event.newValue
      ){
        return;
      }

      try{
        handleDesignPreviewMessage(
          JSON.parse(
            event.newValue
          )
        );
      }
      catch(_){}

    }
  );


  window.addEventListener(
    "message",
    handleDesignPreviewMessage
  );


  function startDesignPreviewRealtime(){

    if(
      !SHOP_SLUG ||
      typeof supabaseClient.channel !==
        "function"
    ){
      return;
    }

    if(
      designPreviewRealtime
    ){
      try{
        supabaseClient.removeChannel(
          designPreviewRealtime
        );
      }catch(_){}
    }

    designPreviewRealtime =
      supabaseClient
        .channel(
          "ma7alak-design-preview-"+
          SHOP_SLUG
        )
        .on(
          "broadcast",
          {
            event:
              "design-preview"
          },
          function(payload){
            handleDesignPreviewMessage(
              payload &&
              payload.payload
                ? payload.payload
                : payload
            );
          }
        )
        .subscribe();

  }


  /* =========================================================
     REALTIME
  ========================================================= */

  function scheduleRefresh(){
    if(!mediaSectionAwake())return;

    clearTimeout(
      refreshTimer
    );


    refreshTimer =
      setTimeout(
        function(){
          if(!mediaSectionAwake())return;

          loadAll(
            true
          );

        },
        90
      );

  }


  function applyProfileRealtime(
    payload
  ){
    if(!mediaSectionAwake())return;

    const nextOptions =
      payload &&
      payload.new &&
      payload.new.directory_options &&
      typeof payload.new.directory_options ===
        "object"
        ? payload.new.directory_options
        : null;

    if(!nextOptions){
      scheduleRefresh();
      return;
    }

    profileOptions =
      nextOptions;

    lastSignature =
      signatureFor(
        imageRows,
        videoRows,
        albumRows,
        albumItemRows,
        profileOptions
      );

    applyProfileOptions();

  }


  function startRealtime(){

    if(
      !SHOP_SLUG ||
      typeof supabaseClient.channel !==
        "function"
    ){
      return;
    }


    if(
      mediaRealtime
    ){

      try{

        supabaseClient
          .removeChannel(
            mediaRealtime
          );

      }
      catch(_){}

    }


    mediaRealtime =
      supabaseClient
        .channel(
          "ma7alak-media-showcase-" +
          SHOP_SLUG +
          "-" +
          Math.random()
            .toString(36)
            .slice(2,8)
        )

        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"shop_gallery",
            filter:
              "shop_slug=eq." +
              SHOP_SLUG
          },
          scheduleRefresh
        )

        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"shop_videos",
            filter:
              "shop_slug=eq." +
              SHOP_SLUG
          },
          scheduleRefresh
        )

        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"shop_media_albums",
            filter:
              "shop_slug=eq." +
              SHOP_SLUG
          },
          scheduleRefresh
        )

        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"shop_media_album_items",
            filter:
              "shop_slug=eq." +
              SHOP_SLUG
          },
          scheduleRefresh
        )

        .on(
          "postgres_changes",
          {
            event:"UPDATE",
            schema:"public",
            table:"shop_profiles",
            filter:
              "shop_slug=eq." +
              SHOP_SLUG
          },
          applyProfileRealtime
        )

        /*
           Public aggregate only. Raw likes/comments stay private behind RPCs.
           One aggregate UPDATE is enough to refresh counters + open comments.
        */
        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"shop_media_engagement",
            filter:
              "shop_slug=eq." +
              SHOP_SLUG
          },
          scheduleSocialRefresh
        )

        .subscribe(
          function(status){

            if(
              status ===
                "CHANNEL_ERROR" ||
              status ===
                "TIMED_OUT" ||
              status ===
                "CLOSED"
            ){

              clearTimeout(
                realtimeRetryTimer
              );


              realtimeRetryTimer =
                setTimeout(
                  startRealtime,
                  1800
                );

            }

          }
        );

  }


  /* =========================================================
     BOOT
  ========================================================= */

  loading.hidden =
    false;

  content.hidden =
    true;


  await loadAll(
    true
  );

  window.dispatchEvent(new Event("shoufhon:section-data-ready"));


  startRealtime();


  const openedFromPageUrl =
    await maybeOpenRequestedMedia();


  if(!openedFromPageUrl){
    try{
      if(
        window.parent &&
        window.parent !== window
      ){
        window.parent.postMessage(
          {
            type:"SHOUFHON_MEDIA_DEEPLINK_READY",
            shopSlug:SHOP_SLUG
          },
          "*"
        );
      }
    }
    catch(_){}
  }

  /*
     Owner Media actions already return the fresh database snapshot.
     Refresh the public showcase immediately too, instead of waiting for a
     page reload or for the Realtime socket to wake back up after fullscreen.
  */
  window.addEventListener(
    "shoufhon:owner-media-updated",
    function(event){
      const detail =
        event?.detail ||
        {};

      const incoming=
        String(
          detail.shopSlug||
          ""
        ).trim().toLowerCase();

      if(
        incoming &&
        incoming!==
          String(SHOP_SLUG||"")
            .trim()
            .toLowerCase()
      ){
        return;
      }

      /*
         Comments ON/OFF changes only one profile option. Apply it in-place
         instead of rebuilding the entire photo/video grid while the owner
         editor is closing. Realtime confirms the saved profile state.
      */
      if(
        String(detail.reason||"") ===
          "comments-toggle" &&
        detail.snapshot &&
        typeof detail.snapshot ===
          "object"
      ){

        profileOptions = {
          ...(profileOptions || {}),
          media_comments_enabled:
            detail.snapshot.commentsEnabled !==
              false
        };

        lastSignature =
          signatureFor(
            imageRows,
            videoRows,
            albumRows,
            albumItemRows,
            profileOptions
          );

        applyProfileOptions();
        return;
      }

      clearTimeout(
        ownerMediaRefreshTimer
      );

      ownerMediaRefreshTimer =
        setTimeout(
          function(){
            ownerMediaRefreshTimer =
              null;
            loadAll(true);
          },
          90
        );
    }
  );

  startDesignPreviewRealtime();


  window.addEventListener(
    "beforeunload",
    function(){

      disconnectPreviewObserver();


      clearTimeout(
        realtimeRetryTimer
      );


      clearTimeout(
        refreshTimer
      );

      clearTimeout(
        wakeRefreshTimer
      );

      clearTimeout(
        ownerMediaRefreshTimer
      );

      clearTimeout(
        socialRefreshTimer
      );

      clearTimeout(
        socialToastTimer
      );

      clearLongPress();

      mediaRpcPending.forEach(
        function(pending){
          clearTimeout(
            pending.timer
          );
        }
      );

      mediaRpcPending.clear();


      if(
        designBroadcastChannel
      ){
        try{
          designBroadcastChannel.close();
        }catch(_){}
      }


      if(
        designPreviewRealtime
      ){
        try{
          supabaseClient
            .removeChannel(
              designPreviewRealtime
            );
        }catch(_){}
      }


      if(
        mediaRealtime
      ){

        try{

          supabaseClient
            .removeChannel(
              mediaRealtime
            );

        }
        catch(_){}

      }

    }
  );

})();
</script>
